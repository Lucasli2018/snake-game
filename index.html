<script>
(function () {
  'use strict';

  /* ============================================================
   * 1. 配置
   * ========================================================== */
  const Config = {
    COLS: 24,                 // 棋盘列数
    ROWS: 24,                 // 棋盘行数（与列数相等，保证画布为正方形）
    START_LEN: 3,             // 初始蛇长
    BASE_TPS: 5,              // 初始速度：每秒推进 5 格
    MAX_TPS: 16,              // 速度上限：每秒 16 格
    TPS_PER_LEVEL: 1.15,      // 每提升一个等级增加的格/秒
    SCORE_PER_FOOD: 10,       // 每颗食物得分
    SCORE_PER_LEVEL: 100,     // 每 100 分（10 颗食物）提升一个速度等级
    MAX_QUEUED_DIRS: 3,       // 方向缓冲队列最大长度
    MAX_STEPS_PER_FRAME: 4,   // 单帧最多补算的 tick 数，防止卡顿后瞬移
    STORAGE_BEST: 'snake-game.best.v1',
    STORAGE_MUTED: 'snake-game.muted.v1',
    STORAGE_THEME: 'snake-game.theme.v1',
    STORAGE_LEADERBOARD: 'snake-leaderboard',
    LEADERBOARD_MAX: 10,      // 排行榜最多保留条数

    /* ---- C 轮：特殊食物（P1 体验增强）---- */
    SPECIAL_GOLD_ADD: 4,      // 金蛇果：临时加速 +4 格/秒
    SPECIAL_GOLD_TIME: 5,     // 金蛇果 buff 持续 5 秒
    SPECIAL_GOLD_TTL: 8,      // 金蛇果在场上停留 8 秒（不吃则消失）
    SPECIAL_ICE_ADD: 3,       // 冰冻果：临时减速 3 格/秒（存为 add 负值）
    SPECIAL_ICE_TIME: 4,      // 冰冻果 buff 持续 4 秒
    SPECIAL_ICE_TTL: 8,       // 冰冻果在场上停留 8 秒
    SPECIAL_BONUS_SCORE: 25,  // 限时奖励：吃到额外 +25 分
    SPECIAL_BONUS_TIME: 6,    // 限时奖励在场上停留 6 秒（不吃则消失）
    SPECIAL_MIN_TPS: 3,       // 减速下限（不低于此速度，保持可玩）
    SPECIAL_SPAWN_INTERVAL: 9000, // 平均每 9 秒尝试自动生成一个特殊食物

    /* ---- D 轮：关卡 / 障碍 / Boss 蛇（P1 体验增强）---- */
    TOTAL_STAGES: 6,         // 通关所需关卡数（清空第 6 关 = 胜利）
    STAGE_BASE_TARGET: 4,    // 第 1 关需吃到的食物数
    STAGE_TARGET_STEP: 2,    // 每关递增的食物目标（第 N 关 = 4 + (N-1)*2）
    OBSTACLE_STEP: 3,        // 每升一关新增的障碍物数量（第 1 关无障碍，第 2 关起出现）
    BOSS_FIRST_STAGE: 3,     // Boss 蛇首次出现的关卡
    BOSS_EVERY: 3,           // 之后每隔几关再来一次（3、6…）
    BOSS_LEN: 7,             // Boss 蛇初始长度
    BOSS_SPEED_TPS: 4        // Boss 蛇移动速度（格/秒，独立于玩家）
  };

  const DIR = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  const STATE = { READY: 'ready', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover' };

  /* ============================================================
   * 2. 存储（隐私模式下 localStorage 会抛错，全部 try-catch 兜底）
   * ========================================================== */
  const Storage = {
    get: function (key, fallback) {
      try {
        const v = window.localStorage.getItem(key);
        return (v === null || v === undefined) ? fallback : v;
      } catch (e) {
        return fallback;
      }
    },
    set: function (key, value) {
      try {
        window.localStorage.setItem(key, String(value));
        return true;
      } catch (e) {
        return false;
      }
    }
  };

  /* ============================================================
   * 3. 排行榜（localStorage，隐私模式下 try-catch 兜底）
   * ========================================================== */
  const Leaderboard = {
    entries: [],          // 已排序的前 N 条记录
    lastRecord: null,     // 本局刚产生的记录（Game Over 后可编辑名字）

    /** 校验并裁剪单条记录 */
    normalize: function (rec) {
      if (!rec || typeof rec !== 'object') return null;
      const name = String(rec.name || '').slice(0, 3);
      const score = Number(rec.score) || 0;
      const duration = Math.max(0, Math.floor(Number(rec.duration) || 0));
      let date = rec.date;
      if (typeof date !== 'string' || !date) date = new Date().toISOString();
      return { name: name, score: score, date: date, duration: duration };
    },

    /** 从 localStorage 加载排行榜 */
    load: function () {
      try {
        const raw = window.localStorage.getItem(Config.STORAGE_LEADERBOARD);
        if (!raw) { this.entries = []; return; }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) { this.entries = []; return; }
        const out = [];
        for (let i = 0; i < parsed.length; i++) {
          const r = this.normalize(parsed[i]);
          if (r) out.push(r);
        }
        this.entries = out;
        this.sort();
      } catch (e) {
        this.entries = [];
      }
    },

    /** 持久化排行榜 */
    save: function () {
      try {
        window.localStorage.setItem(Config.STORAGE_LEADERBOARD,
          JSON.stringify(this.entries.slice(0, Config.LEADERBOARD_MAX)));
        return true;
      } catch (e) {
        return false;
      }
    },

    /** 按分数降序，同分按时间倒序（新的在前） */
    sort: function () {
      this.entries.sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return new Date(b.date) - new Date(a.date);
      });
      if (this.entries.length > Config.LEADERBOARD_MAX) {
        this.entries.length = Config.LEADERBOARD_MAX;
      }
    },

    /**
     * 添加一条记录。
     * 同名同分视为同一记录：替换旧记录并保留最新时间。
     */
    add: function (rec) {
      const r = this.normalize(rec);
      if (!r) return false;
      const idx = this.entries.findIndex(function (e) {
        return e.name === r.name && e.score === r.score;
      });
      if (idx >= 0) {
        this.entries[idx] = r;
      } else {
        this.entries.push(r);
      }
      this.sort();
      this.save();
      return r;
    },

    /** 移除一条已知记录（用于改名时去重） */
    remove: function (rec) {
      if (!rec) return;
      this.entries = this.entries.filter(function (e) {
        return !(e.name === rec.name && e.score === rec.score && e.date === rec.date);
      });
    },

    /** 清空排行榜 */
    clear: function () {
      this.entries = [];
      this.save();
    },

    /** 计算某分数在当前榜单中的 1-based 名次 */
    rank: function (score) {
      let r = 1;
      for (let i = 0; i < this.entries.length; i++) {
        if (this.entries[i].score > score) r++;
      }
      return r;
    },

    count: function () { return this.entries.length; }
  };

  /* ============================================================
   * 4. 音效（Web Audio API 代码合成，无外部音频文件）
   *    AudioContext 必须在用户首次交互后创建 / resume
   * ========================================================== */
  const Sfx = {
    ctx: null,
    muted: Storage.get(Config.STORAGE_MUTED, '0') === '1',

    /** 首次用户交互后调用：创建 / 恢复音频上下文 */
    unlock: function () {
      if (this.muted) return;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
      }
      if (this.ctx.state === 'suspended' && this.ctx.resume) {
        this.ctx.resume().catch(function () { /* 忽略恢复失败 */ });
      }
    },

    /** 播放单个合成音：频率可线性滑向 endFreq */
    tone: function (opts) {
      if (this.muted || !this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime + (opts.delay || 0);
      const dur = opts.dur || 0.12;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(opts.freq, now);
      if (opts.endFreq && opts.endFreq !== opts.freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.endFreq), now + dur);
      }
      const peak = (opts.gain === undefined ? 0.16 : opts.gain);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    },

    /** 白噪声（撞击的"沙沙"尾音） */
    noise: function (dur, gain, delay) {
      if (this.muted || !this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime + (delay || 0);
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      const src = ctx.createBufferSource();
      const g = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);
      g.gain.setValueAtTime(gain, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.buffer = buf;
      src.connect(filter);
      filter.connect(g);
      g.connect(ctx.destination);
      src.start(now);
    },

    eat: function (level) {
      const base = 620 + Math.min(level, 10) * 18;
      this.tone({ freq: base, endFreq: base * 1.6, type: 'triangle', dur: 0.09, gain: 0.14 });
      this.tone({ freq: base * 1.5, endFreq: base * 2.2, type: 'sine', dur: 0.09, gain: 0.09, delay: 0.055 });
    },

    crash: function () {
      this.tone({ freq: 240, endFreq: 55, type: 'sawtooth', dur: 0.42, gain: 0.16 });
      this.tone({ freq: 120, endFreq: 42, type: 'square',   dur: 0.34, gain: 0.10, delay: 0.02 });
      this.noise(0.28, 0.12, 0.01);
    },

    record: function () {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      for (let i = 0; i < notes.length; i++) {
        this.tone({ freq: notes[i], type: 'triangle', dur: 0.16, gain: 0.12, delay: i * 0.09 });
      }
    },

    start: function () {
      this.tone({ freq: 440, endFreq: 660, type: 'sine', dur: 0.12, gain: 0.10 });
    },

    pause: function (paused) {
      this.tone({ freq: paused ? 520 : 380, endFreq: paused ? 380 : 520, type: 'sine', dur: 0.1, gain: 0.08 });
    },

    /** 吃到特殊食物：金蛇果明亮上扬、冰冻果清冷下行、限时奖励轻快叮咚 */
    special: function (kind) {
      if (kind === 'gold') {
        this.tone({ freq: 880, endFreq: 1320, type: 'triangle', dur: 0.14, gain: 0.13 });
      } else if (kind === 'ice') {
        this.tone({ freq: 540, endFreq: 300, type: 'sine', dur: 0.18, gain: 0.12 });
      } else {
        // bonus：两声叮咚
        this.tone({ freq: 740, endFreq: 988, type: 'triangle', dur: 0.1, gain: 0.12 });
        this.tone({ freq: 988, endFreq: 1318, type: 'sine', dur: 0.1, gain: 0.08, delay: 0.08 });
      }
    }
  };

  /* ============================================================
   * 5. 游戏核心（纯逻辑，不触碰 DOM）
   * ========================================================== */
  const Game = {
    state: STATE.READY,
    snake: [],          // [{x,y}]，下标 0 为蛇头
    prevSnake: [],      // 上一 tick 的蛇身，用于渲染插值
    dirQueue: [],       // 方向缓冲队列，防止同一帧连按两次导致反向穿身
    dir: DIR.right,
    food: { x: 0, y: 0 },
    score: 0,
    best: 0,
    level: 0,
    isRecord: false,
    win: false,
    deathReason: '',    // 'wall' | 'self'，用于结束界面文案
    headPulse: 0,       // 吃到食物时蛇头的缩放脉冲
    occupied: null,     // Uint8Array，用于 O(1) 判断格子是否被蛇占据

    /* ---- C 轮：特殊食物 ---- */
    special: null,             // 当前场上的特殊食物 {x,y,type,ttl,maxTtl}，null 表示无
    speedBuffAdd: 0,           // 当前速度增益（负数表示减速），无 buff 时为 0
    speedBuffTime: 0,          // 速度 buff 剩余秒数
    specialSpawnTimer: 0,      // 自动生成特殊食物的计时器（ms）
    _lastSpecial: null,        // 最近一次吃到的特殊食物 {type,x,y}（供主循环做特效）

    /* ---- D 轮：关卡 / 障碍 / Boss 蛇 ---- */
    stageMode: false,          // 闯关模式总开关（App.start/restart 时开启；单测可关）
    stage: 1,                  // 当前关卡（从 1 开始）
    stageFoods: 0,             // 当前关已吃到的食物数
    stageTarget: 0,            // 当前关目标食物数（吃满即过关）
    obstacles: [],             // 障碍物列表 [{x,y}]
    boss: null,                // Boss 蛇对象 {snake,prevSnake,dir,acc} 或 null
    bossAcc: 0,                // Boss 移动累加器（ms）
    bossHitPlayer: false,      // Boss 本帧撞到玩家（主循环据此判死）
    stageBannerText: '',       // 关卡横幅文案（如「第 3 关」）
    stageBannerTime: 0,        // 关卡横幅剩余显示时间（秒）

    /** 当前速度（格/秒），叠加临时速度 buff（金蛇果加速 / 冰冻果减速） */
    tps: function () {
      const base = Math.min(Config.MAX_TPS, Config.BASE_TPS + this.level * Config.TPS_PER_LEVEL);
      const eff = base + (this.speedBuffAdd || 0);
      return Math.max(Config.SPECIAL_MIN_TPS, eff);
    },

    /** 每 tick 的间隔毫秒数 */
    tickInterval: function () {
      return 1000 / this.tps();
    },

    init: function () {
      const raw = parseInt(Storage.get(Config.STORAGE_BEST, '0'), 10);
      this.best = isNaN(raw) || raw < 0 ? 0 : raw;
      this.occupied = new Uint8Array(Config.COLS * Config.ROWS);
      this.reset();
      this.state = STATE.READY;
    },

    /** 重置为一局新游戏（保留最高分） */
    reset: function () {
      const cx = Math.floor(Config.COLS / 2);
      const cy = Math.floor(Config.ROWS / 2);
      this.snake = [];
      for (let i = 0; i < Config.START_LEN; i++) {
        this.snake.push({ x: cx - i, y: cy });
      }
      this.prevSnake = this.snake.map(function (s) { return { x: s.x, y: s.y }; });
      this.dir = DIR.right;
      this.dirQueue = [];
      this.score = 0;
      this.level = 0;
      this.isRecord = false;
      this.win = false;
      this.deathReason = '';
      this.headPulse = 0;
      this.special = null;
      this.speedBuffAdd = 0;
      this.speedBuffTime = 0;
      this.specialSpawnTimer = 0;
      this._lastSpecial = null;

      /* ---- D 轮：关卡状态（保留外部设置的 stageMode 开关，不在此重置）---- */
      this.stage = 1;
      this.stageFoods = 0;
      this.stageTarget = Config.STAGE_BASE_TARGET;
      this.obstacles = [];
      this.boss = null;
      this.bossAcc = 0;
      this.bossHitPlayer = false;
      this.stageBannerText = '';
      this.stageBannerTime = 0;

      this.placeFood();
    },

    /**
     * 加入一个方向输入。
     * 防反向：新方向必须与队列中最后一个方向（队列空时与当前方向）不相反；
     * 由于入队时已逐级校验，出队执行时不可能出现 180° 掉头。
     */
    queueDirection: function (next) {
      if (this.state !== STATE.PLAYING) return false;
      const last = this.dirQueue.length ? this.dirQueue[this.dirQueue.length - 1] : this.dir;
      if (next.x === last.x && next.y === last.y) return false;          // 与当前方向相同，忽略
      if (next.x === -last.x && next.y === -last.y) return false;        // 180° 反向，忽略
      if (this.dirQueue.length >= Config.MAX_QUEUED_DIRS) return false;  // 队列已满，忽略
      this.dirQueue.push(next);
      return true;
    },

    /** 取出下一个待执行方向（队列为空时保持原方向） */
    consumeDirection: function () {
      if (this.dirQueue.length) {
        this.dir = this.dirQueue.shift();
      }
      return this.dir;
    },

    /** 在空白处随机生成食物；棋盘填满时返回 false（视为通关） */
    placeFood: function () {
      this.occupied.fill(0);
      for (let i = 0; i < this.snake.length; i++) {
        this.occupied[this.snake[i].y * Config.COLS + this.snake[i].x] = 1;
      }
      // 特殊食物也占据一个格子，食物不得与之重叠
      if (this.special) {
        this.occupied[this.special.y * Config.COLS + this.special.x] = 1;
      }
      // 障碍物同样占据格子
      for (let i = 0; i < this.obstacles.length; i++) {
        this.occupied[this.obstacles[i].y * Config.COLS + this.obstacles[i].x] = 1;
      }
      const total = Config.COLS * Config.ROWS;
      let free = 0;
      for (let i = 0; i < total; i++) {
        if (!this.occupied[i]) free++;
      }
      if (free === 0) { this.food = { x: -1, y: -1 }; return false; }

      let target = Math.floor(Math.random() * free);
      for (let i = 0; i < total; i++) {
        if (this.occupied[i]) continue;
        if (target === 0) {
          this.food = { x: i % Config.COLS, y: Math.floor(i / Config.COLS) };
          return true;
        }
        target--;
      }
      return false;
    },

    /** 在「蛇身 + 普通食物」之外随机挑一个空格，返回 {x,y} 或 null（棋盘满） */
    randomEmptyCell: function () {
      this.occupied.fill(0);
      for (let i = 0; i < this.snake.length; i++) {
        this.occupied[this.snake[i].y * Config.COLS + this.snake[i].x] = 1;
      }
      if (this.food.x >= 0) {
        this.occupied[this.food.y * Config.COLS + this.food.x] = 1;
      }
      // 障碍物也占位
      for (let i = 0; i < this.obstacles.length; i++) {
        this.occupied[this.obstacles[i].y * Config.COLS + this.obstacles[i].x] = 1;
      }
      const total = Config.COLS * Config.ROWS;
      let free = 0;
      for (let i = 0; i < total; i++) {
        if (!this.occupied[i]) free++;
      }
      if (free === 0) return null;
      let target = Math.floor(Math.random() * free);
      for (let i = 0; i < total; i++) {
        if (this.occupied[i]) continue;
        if (target === 0) return { x: i % Config.COLS, y: Math.floor(i / Config.COLS) };
        target--;
      }
      return null;
    },

    /** 在空格放置一个特殊食物（gold/ice/bonus）；返回是否成功 */
    placeSpecial: function (type) {
      const cell = this.randomEmptyCell();
      if (!cell) return false;
      const ttlMap = {
        gold: Config.SPECIAL_GOLD_TTL,
        ice: Config.SPECIAL_ICE_TTL,
        bonus: Config.SPECIAL_BONUS_TIME
      };
      const ttl = ttlMap[type] || Config.SPECIAL_BONUS_TIME;
      this.special = { x: cell.x, y: cell.y, type: type, ttl: ttl, maxTtl: ttl };
      return true;
    },

    /**
     * 生成特殊食物。
     * - 不传 type：从 gold / ice / bonus 中等概率随机选一个（供自动生成）
     * - 传 type：强制生成指定类型（供测试 / 演示）
     * 若场上已有特殊食物则直接返回 null（同一时刻最多一颗），成功返回实际类型。
     */
    spawnSpecial: function (forceType) {
      if (this.special) return null;
      const types = ['gold', 'ice', 'bonus'];
      const type = forceType || types[Math.floor(Math.random() * types.length)];
      return this.placeSpecial(type) ? type : null;
    },

    /* ---- D 轮：关卡 / 障碍 / Boss 蛇 ---- */

    /** 某格是否为障碍物 */
    isObstacle: function (x, y) {
      for (let i = 0; i < this.obstacles.length; i++) {
        if (this.obstacles[i].x === x && this.obstacles[i].y === y) return true;
      }
      return false;
    },

    /** 某格是否被玩家蛇身占据（可排除蛇尾，因为尾巴本 tick 会让位） */
    snakeOccupies: function (x, y, excludeTail) {
      const n = excludeTail ? this.snake.length - 1 : this.snake.length;
      for (let i = 0; i < n; i++) {
        if (this.snake[i].x === x && this.snake[i].y === y) return true;
      }
      return false;
    },

    /** 某格是否被 Boss 蛇身占据（可排除蛇尾） */
    bossOccupies: function (x, y, boss, excludeTail) {
      if (!boss) return false;
      const n = excludeTail ? boss.snake.length - 1 : boss.snake.length;
      for (let i = 0; i < n; i++) {
        if (boss.snake[i].x === x && boss.snake[i].y === y) return true;
      }
      return false;
    },

    /** 往场上追加 count 个障碍物（避开蛇 / 食物 / 特殊食物 / 已有障碍）；棋盘满则提前停止 */
    addObstacles: function (count) {
      for (let k = 0; k < count; k++) {
        const cell = this.randomEmptyCell();
        if (!cell) break;
        this.obstacles.push(cell);
      }
    },

    /** 第 stage 关是否为 Boss 关 */
    isBossStage: function (stage) {
      return stage >= Config.BOSS_FIRST_STAGE &&
             (stage - Config.BOSS_FIRST_STAGE) % Config.BOSS_EVERY === 0;
    },

    /**
     * 生成 Boss 蛇：从四个角落候选锚点里挑一个不与蛇/障碍重叠的，
     * 沿边横向铺开 BOSS_LEN 节。实在没有空位则降级为不生成（不影响通关）。
     */
    spawnBoss: function () {
      const len = Config.BOSS_LEN;
      const cand = [
        { x: 1, y: 1, dir: DIR.right },
        { x: Config.COLS - 2, y: 1, dir: DIR.left },
        { x: 1, y: Config.ROWS - 2, dir: DIR.right },
        { x: Config.COLS - 2, y: Config.ROWS - 2, dir: DIR.left }
      ];
      for (let c = 0; c < cand.length; c++) {
        const anchor = cand[c];
        const cells = [];
        let ok = true;
        for (let i = 0; i < len; i++) {
          const x = anchor.x + anchor.dir.x * i;
          const y = anchor.y + anchor.dir.y * i;
          if (x < 0 || y < 0 || x >= Config.COLS || y >= Config.ROWS) { ok = false; break; }
          if (this.isObstacle(x, y) || this.snakeOccupies(x, y) || this.bossOccupies(x, y)) { ok = false; break; }
          cells.push({ x: x, y: y });
        }
        if (ok) {
          this.boss = {
            snake: cells,
            prevSnake: cells.map(function (s) { return { x: s.x, y: s.y }; }),
            dir: anchor.dir,
            acc: 0
          };
          this.bossAcc = 0;
          return;
        }
      }
      this.boss = null;
    },

    /** 过关：进入下一关，累加障碍，按需生成 Boss，刷新横幅 */
    advanceStage: function () {
      this.stage++;
      this.stageFoods = 0;
      this.stageTarget = Config.STAGE_BASE_TARGET + (this.stage - 1) * Config.STAGE_TARGET_STEP;
      // 每升一关新增障碍（第 1 关无障碍，第 2 关起出现，关卡越后越难）
      this.addObstacles(Config.OBSTACLE_STEP);
      // 清掉场上特殊食物，避免新布局把它卡在死角
      this.special = null;
      this.speedBuffAdd = 0;
      this.speedBuffTime = 0;
      // Boss 关则生成本关 Boss 蛇，否则移除
      if (this.isBossStage(this.stage)) this.spawnBoss();
      else this.boss = null;
      // 关卡横幅
      this.stageBannerText = '第 ' + this.stage + ' 关';
      this.stageBannerTime = 2.0;
    },

    /** 用真实时间推进 Boss 蛇（仅 PLAYING 且存在 Boss 时由主循环调用） */
    updateBoss: function (dt) {
      if (!this.boss) return;
      this.bossAcc += dt * 1000;
      const interval = 1000 / Config.BOSS_SPEED_TPS;
      let guard = 0;
      while (this.bossAcc >= interval && guard < 8) {
        this.bossAcc -= interval;
        guard++;
        this.stepBoss();
        if (this.bossHitPlayer) break;
      }
    },

    /** Boss 蛇走一步：朝食物（无食物则朝玩家头）移动，避开墙/障碍/双方身体 */
    stepBoss: function () {
      const b = this.boss;
      if (!b) return;
      const target = (this.food.x >= 0) ? this.food : this.snake[0];
      const head = b.snake[0];
      const dirs = [DIR.up, DIR.down, DIR.left, DIR.right];
      let best = null, bestScore = Infinity;
      for (let i = 0; i < dirs.length; i++) {
        const d = dirs[i];
        const nx = head.x + d.x, ny = head.y + d.y;
        if (nx < 0 || ny < 0 || nx >= Config.COLS || ny >= Config.ROWS) continue;
        if (this.isObstacle(nx, ny)) continue;
        if (this.bossOccupies(nx, ny, b, true)) continue;   // 允许跟在尾巴后（不咬自己）
        // 注意：Boss 不躲避玩家蛇身，才会主动追击并撞上玩家 -> 形成真实威胁
        const dist = Math.abs(nx - target.x) + Math.abs(ny - target.y);
        const score = dist + (d === b.dir ? -0.5 : 0);       // 偏好保持方向更顺滑
        if (score < bestScore) { bestScore = score; best = d; }
      }
      if (!best) return;                                     // 四面楚歌，原地不动
      b.dir = best;
      const nx = head.x + best.x, ny = head.y + best.y;
      b.prevSnake = b.snake.map(function (s) { return { x: s.x, y: s.y }; });
      b.snake.unshift({ x: nx, y: ny });
      b.snake.pop();
      // 撞到玩家：Boss 头与玩家任意一节重合 -> 玩家死亡
      for (let i = 0; i < this.snake.length; i++) {
        if (this.snake[i].x === nx && this.snake[i].y === ny) { this.bossHitPlayer = true; break; }
      }
    },

    /** 吃到特殊食物后的效果（不在此处做渲染/音效，交给主循环） */
    applySpecial: function (sp) {
      if (sp.type === 'gold') {
        this.speedBuffAdd = Config.SPECIAL_GOLD_ADD;
        this.speedBuffTime = Config.SPECIAL_GOLD_TIME;
      } else if (sp.type === 'ice') {
        this.speedBuffAdd = -Config.SPECIAL_ICE_ADD;
        this.speedBuffTime = Config.SPECIAL_ICE_TIME;
      } else if (sp.type === 'bonus') {
        this.addScore(Config.SPECIAL_BONUS_SCORE);
      }
    },

    /** 加分并同步速度等级（bonus 食物与普食都走这里，保证 level 一致） */
    addScore: function (n) {
      this.score += n;
      this.level = Math.floor(this.score / Config.SCORE_PER_LEVEL);
    },

    /**
     * 用真实经过的秒数推进「时间类」状态（仅 PLAYING 态由主循环调用，
     * 暂停时不动 -> buff / 特殊食物随画面一起冻结）。
     * 同时按间隔尝试自动生成特殊食物（同一时刻最多一颗）。
     */
    updateTimers: function (dt) {
      if (this.speedBuffTime > 0) {
        this.speedBuffTime -= dt;
        if (this.speedBuffTime <= 0) {
          this.speedBuffTime = 0;
          this.speedBuffAdd = 0;
        }
      }
      if (this.special) {
        this.special.ttl -= dt;
        if (this.special.ttl <= 0) this.special = null;
      }
      if (this.stageBannerTime > 0) this.stageBannerTime -= dt;
      if (this.stageMode && this.state === STATE.PLAYING && this.boss) {
        this.updateBoss(dt);
      }
      if (this.state === STATE.PLAYING) {
        this.specialSpawnTimer += dt * 1000;
        if (this.specialSpawnTimer >= Config.SPECIAL_SPAWN_INTERVAL && !this.special) {
          this.specialSpawnTimer = 0;
          this.spawnSpecial();
        }
      }
    },

    /**
     * 推进一个逻辑步。
     * @returns {'move'|'eat'|'dead'}
     */
    tick: function () {
      const dir = this.consumeDirection();
      const head = this.snake[0];
      const nx = head.x + dir.x;
      const ny = head.y + dir.y;

      // 撞墙
      if (nx < 0 || ny < 0 || nx >= Config.COLS || ny >= Config.ROWS) {
        this.deathReason = 'wall';
        return 'dead';
      }

      // 撞障碍物（D 轮）
      if (this.isObstacle(nx, ny)) {
        this.deathReason = 'obstacle';
        return 'dead';
      }

      // 撞 Boss 蛇身（D 轮）
      if (this.boss && this.bossOccupies(nx, ny, this.boss)) {
        this.deathReason = 'boss';
        return 'dead';
      }

      // 撞自己：若本 tick 不成长，蛇尾会让出格子，因此最后一节不计入碰撞
      const willGrow = (this.food.x === nx && this.food.y === ny);
      const limit = willGrow ? this.snake.length : this.snake.length - 1;
      for (let i = 0; i < limit; i++) {
        if (this.snake[i].x === nx && this.snake[i].y === ny) {
          this.deathReason = 'self';
          return 'dead';
        }
      }

      // 保存旧蛇身用于渲染插值
      this.prevSnake = this.snake.map(function (s) { return { x: s.x, y: s.y }; });
      this.snake.unshift({ x: nx, y: ny });

      if (willGrow) {
        this.addScore(Config.SCORE_PER_FOOD);
        this.headPulse = 1;
        this.stageFoods++;
        // 关卡推进（仅闯关模式）：吃满目标食物即过关
        if (this.stageMode && this.stageFoods >= this.stageTarget) {
          if (this.stage >= Config.TOTAL_STAGES) {
            this.win = true;                 // 清空最后一关 = 通关
            return 'win';
          }
          this.advanceStage();
          const placed = this.placeFood();
          if (!placed) { this.win = true; return 'win'; }
          return 'stageclear';
        }
        const placed = this.placeFood();
        if (!placed) {
          this.win = true;
          return 'win';
        }
        return 'eat';
      }

      // 吃到特殊食物：不增长蛇身，但触发对应效果（金蛇果加速 / 冰冻果减速 / 限时奖励加分）
      if (this.special && this.special.x === nx && this.special.y === ny) {
        const sp = this.special;
        this.special = null;
        this._lastSpecial = { type: sp.type, x: nx, y: ny };
        this.applySpecial(sp);
        this.snake.pop();
        return 'special';
      }

      this.snake.pop();
      return 'move';
    },

    /** 结束本局并结算最高分 */
    gameOver: function () {
      this.state = STATE.GAMEOVER;
      // 清掉场上特殊食物与速度 buff，避免结束/重开界面残留加速状态
      this.special = null;
      this.speedBuffAdd = 0;
      this.speedBuffTime = 0;
      this.specialSpawnTimer = 0;
      this.bossHitPlayer = false;
      if (this.score > this.best) {
        this.best = this.score;
        this.isRecord = true;
        Storage.set(Config.STORAGE_BEST, this.best);
      } else {
        this.isRecord = false;
      }
    }
  };

  /* ============================================================
   * 6. 视觉特效（粒子 / 飘字 / 震屏），仅影响表现层
   * ========================================================== */
  const Fx = {
    particles: [],
    floaters: [],
    shake: 0,
    time: 0,

    update: function (dt) {
      this.time += dt;

      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.life -= dt;
        if (p.life <= 0) { this.particles.splice(i, 1); continue; }
        p.vy += 380 * dt;          // 重力
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= (1 - 1.6 * dt);    // 空气阻力
      }

      for (let i = this.floaters.length - 1; i >= 0; i--) {
        const f = this.floaters[i];
        f.life -= dt;
        if (f.life <= 0) { this.floaters.splice(i, 1); continue; }
        f.y -= 26 * dt;
      }

      if (this.shake > 0) {
        this.shake = Math.max(0, this.shake - dt * 2.2);
      }
      if (Game.headPulse > 0) {
        Game.headPulse = Math.max(0, Game.headPulse - dt * 3.2);
      }
    },

    burst: function (px, py, cell, colors) {
      const palette = colors || ['#f87171', '#fb923c', '#fde047', '#fca5a5'];
      const count = 14;
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const sp = cell * (2.2 + Math.random() * 3.2);
        this.particles.push({
          x: px, y: py,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - cell * 1.4,
          r: cell * (0.06 + Math.random() * 0.09),
          life: 0.4 + Math.random() * 0.35,
          maxLife: 0.75,
          color: palette[i % palette.length]
        });
      }
    },

    floatText: function (px, py, text) {
      this.floaters.push({ x: px, y: py, text: text, life: 0.85, maxLife: 0.85 });
    },

    shakeScreen: function () { this.shake = 1; },

    clear: function () {
      this.particles.length = 0;
      this.floaters.length = 0;
      this.shake = 0;
    }
  };

  /* ============================================================
   * 7. 渲染器（只负责画，不修改游戏状态）
   *    性能要点：背景/网格/墙烘焙到离屏 canvas（只在 resize 时重画），
   *             每帧只 drawImage 复用，省掉 createRadialGradient 与
   *             24x2 网格线 stroke 的开销。
   * ========================================================== */
  const Renderer = {
    canvas: null,
    ctx: null,
    size: 360,
    cell: 15,
    dpr: 1,
    bgCanvas: null,           // 离屏烘焙：背景 + 网格 + 墙
    bgCanvasCtx: null,
    bgValid: false,           // false 时需要重画（resize / 切背景色时清）
    pulseTime: 0,             // 上次记录的脉冲时间，用于脉冲未变时跳帧

    init: function (canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.resize();
    },

    /** 画布保持正方形并自适应窗口，按 devicePixelRatio 提升清晰度 */
    resize: function () {
      const stage = document.getElementById('stage');
      const rect = stage.getBoundingClientRect();
      // 减去内边距，留出安全边距
      const avail = Math.min(rect.width, rect.height) - 22;
      const size = Math.max(200, Math.floor(avail));

      this.size = size;
      this.cell = size / Config.COLS;
      this.dpr = Math.min(window.devicePixelRatio || 1, 2);

      this.canvas.style.width = size + 'px';
      this.canvas.style.height = size + 'px';
      this.canvas.width = Math.floor(size * this.dpr);
      this.canvas.height = Math.floor(size * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

      this.invalidateBg();
    },

    /** 标记背景离屏画布失效（resize 后调用，下次 render 时重画） */
    invalidateBg: function () {
      this.bgValid = false;
    },

    /** 一次性把背景/网格/墙画到离屏 canvas（窗口大小变化才重画） */
    bakeBackground: function () {
      const size = this.size;
      if (!this.bgCanvas) {
        this.bgCanvas = document.createElement('canvas');
        this.bgCanvasCtx = this.bgCanvas.getContext('2d');
      }
      this.bgCanvas.width = Math.floor(size * this.dpr);
      this.bgCanvas.height = Math.floor(size * this.dpr);
      const bctx = this.bgCanvasCtx;
      bctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

      this._drawBackgroundOnto(bctx, size);
      this._drawGridOnto(bctx, size);
      this._drawWallOnto(bctx, size);

      this.bgValid = true;
    },

    /** 格子坐标 -> 画布像素（格子中心） */
    cx: function (gx) { return (gx + 0.5) * this.cell; },
    cy: function (gy) { return (gy + 0.5) * this.cell; },

    /**
     * 主绘制入口
     * @param {number} alpha tick 之间的插值系数 [0,1]
     * @param {number} time 用于脉动等纯时间动画
     */
    render: function (alpha, time) {
      const ctx = this.ctx;
      const size = this.size;

      // 首次/失效时烘焙背景
      if (!this.bgValid) this.bakeBackground();

      ctx.save();
      ctx.clearRect(0, 0, size, size);

      // 撞击震屏
      if (Fx.shake > 0) {
        const amp = Fx.shake * this.cell * 0.42;
        ctx.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
      }

      // 静态层：drawImage 复用离屏烘焙（最贵的 radialGradient + 网格线 + 墙阴影只画一次）
      ctx.drawImage(this.bgCanvas, 0, 0, size, size);

      this.drawObstacles();
      this.drawFood();
      this.drawSpecial();
      this.drawSnake(alpha);
      this.drawBoss(alpha);
      this.drawParticles();
      this.drawFloaters();
      this.drawBanner();

      ctx.restore();
    },

    /** 静态底色 + 中心柔光（仅在离屏烘焙时调用） */
    _drawBackgroundOnto: function (ctx, size) {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(-size, -size, size * 3, size * 3);

      const g = ctx.createRadialGradient(size * 0.5, size * 0.42, size * 0.05,
                                         size * 0.5, size * 0.5, size * 0.78);
      g.addColorStop(0, 'rgba(56,189,248,0.10)');
      g.addColorStop(1, 'rgba(11,18,32,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    },

    /** 网格线：细线 + 每 4 格的粗线（仅在离屏烘焙时调用） */
    _drawGridOnto: function (ctx, size) {
      const cell = this.cell;
      ctx.lineWidth = 1;
      for (let i = 1; i < Config.COLS; i++) {
        const p = Math.round(i * cell) + 0.5;
        ctx.strokeStyle = (i % 4 === 0) ? 'rgba(148,163,184,0.10)' : 'rgba(148,163,184,0.045)';
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(0 + size, p); ctx.stroke();
      }
    },

    /** 墙壁：内发光描边（仅在离屏烘焙时调用） */
    _drawWallOnto: function (ctx, size) {
      const inset = 2;

      ctx.save();
      ctx.strokeStyle = 'rgba(56,189,248,0.55)';
      ctx.lineWidth = 3;
      ctx.shadowColor = 'rgba(56,189,248,0.55)';
      ctx.shadowBlur = 12;
      roundRect(ctx, inset, inset, size - inset * 2, size - inset * 2, 11);
      ctx.stroke();
      ctx.restore();

      // 内侧一圈柔和亮边，增加厚度感
      ctx.strokeStyle = 'rgba(148,163,184,0.14)';
      ctx.lineWidth = 1;
      roundRect(ctx, 6.5, 6.5, size - 13, size - 13, 8);
      ctx.stroke();
    },

    // 兼容旧调用名（部分测试可能还在用）
    drawBackground: function () { this.invalidateBg(); },
    drawGrid: function () { /* 已在 bakeBackground 中烘焙 */ },
    drawWall: function () { /* 已在 bakeBackground 中烘焙 */ },

    /** 障碍物（D 轮）：石板质感的圆角方块 */
    drawObstacles: function () {
      const obs = Game.obstacles;
      if (!obs || !obs.length) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const pad = cell * 0.08;
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i];
        const x = o.x * cell, y = o.y * cell;
        const g = ctx.createLinearGradient(x, y, x + cell, y + cell);
        g.addColorStop(0, '#475569');
        g.addColorStop(1, '#1e293b');
        ctx.fillStyle = g;
        roundRect(ctx, x + pad, y + pad, cell - pad * 2, cell - pad * 2, cell * 0.18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // 高光点，强化体积感
        ctx.fillStyle = 'rgba(203,213,225,0.22)';
        ctx.beginPath();
        ctx.arc(x + cell * 0.36, y + cell * 0.34, cell * 0.1, 0, Math.PI * 2);
        ctx.fill();
      }
    },

    /** 食物：带果梗、叶片与呼吸光环的苹果 */
    drawFood: function () {
      if (Game.food.x < 0) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const x = this.cx(Game.food.x);
      const y = this.cy(Game.food.y);
      const pulse = 1 + Math.sin(Fx.time * 4.2) * 0.07;
      const r = cell * 0.33 * pulse;

      // 外圈呼吸光环
      const ringR = cell * 0.46 + Math.sin(Fx.time * 4.2) * cell * 0.05;
      ctx.save();
      ctx.strokeStyle = 'rgba(248,113,113,0.30)';
      ctx.lineWidth = Math.max(1, cell * 0.055);
      ctx.beginPath();
      ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 阴影
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.92, r * 0.85, r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 果身（径向渐变）
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r * 1.05);
      g.addColorStop(0, '#fca5a5');
      g.addColorStop(0.45, '#ef4444');
      g.addColorStop(1, '#b91c1c');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.34, y - r * 0.36, r * 0.24, r * 0.16, -0.6, 0, Math.PI * 2);
      ctx.fill();

      // 果梗
      ctx.strokeStyle = '#7c4a12';
      ctx.lineWidth = Math.max(1, cell * 0.075);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y - r * 0.78);
      ctx.quadraticCurveTo(x + r * 0.12, y - r * 1.12, x + r * 0.3, y - r * 1.25);
      ctx.stroke();

      // 叶片
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.ellipse(x + r * 0.52, y - r * 1.12, r * 0.36, r * 0.17, -0.5, 0, Math.PI * 2);
      ctx.fill();
    },

    /**
     * 特殊食物（C 轮）：金蛇果 / 冰冻果 / 限时奖励。
     * 三种外观各异，且都带「限时环」——环随 ttl 收缩，提示玩家抓紧时间。
     */
    drawSpecial: function () {
      const sp = Game.special;
      if (!sp) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const x = this.cx(sp.x);
      const y = this.cy(sp.y);
      const t = Fx.time;
      const pulse = 1 + Math.sin(t * 4.6) * 0.06;
      const r = cell * 0.34 * pulse;

      // 限时环：剩余时间比例 → 半径从 cell*0.5 收到 cell*0.36
      const ratio = sp.maxTtl > 0 ? Math.max(0, Math.min(1, sp.ttl / sp.maxTtl)) : 1;
      const ringR = cell * 0.36 + (cell * 0.16) * ratio;

      // 主题色（按类型区分）
      let core1, core2, core3, glow, ring, spark;
      if (sp.type === 'gold') {
        core1 = '#fef3c7'; core2 = '#f59e0b'; core3 = '#b45309';
        glow = 'rgba(245,158,11,0.34)'; ring = 'rgba(251,191,36,0.45)'; spark = '#fffbeb';
      } else if (sp.type === 'ice') {
        core1 = '#cffafe'; core2 = '#22d3ee'; core3 = '#0e7490';
        glow = 'rgba(34,211,238,0.34)'; ring = 'rgba(103,232,249,0.5)'; spark = '#ecfeff';
      } else { // bonus
        core1 = '#fde68a'; core2 = '#fbbf24'; core3 = '#d97706';
        glow = 'rgba(250,204,21,0.34)'; ring = 'rgba(253,224,71,0.5)'; spark = '#fffde7';
      }

      // 限时环
      ctx.save();
      ctx.strokeStyle = ring;
      ctx.lineWidth = Math.max(1, cell * 0.05);
      ctx.beginPath();
      ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 外发光
      ctx.save();
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 阴影
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.92, r * 0.85, r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 主体径向渐变
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r * 1.05);
      g.addColorStop(0, core1);
      g.addColorStop(0.5, core2);
      g.addColorStop(1, core3);
      ctx.fillStyle = g;

      if (sp.type === 'bonus') {
        // 限时奖励：菱形（旋转方块）造型，更醒目
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 1.1);
        const d = r * 1.05;
        ctx.beginPath();
        ctx.moveTo(0, -d); ctx.lineTo(d, 0); ctx.lineTo(0, d); ctx.lineTo(-d, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        // 金蛇果 / 冰冻果：圆身（与苹果同一种语言）
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.34, y - r * 0.36, r * 0.24, r * 0.16, -0.6, 0, Math.PI * 2);
      ctx.fill();

      // 星形闪光（旋转的小十字），强化「特殊」反馈
      ctx.save();
      ctx.translate(x, y - r * 1.25);
      ctx.rotate(t * 2.2);
      ctx.fillStyle = spark;
      const s = Math.max(1.2, cell * 0.07);
      ctx.globalAlpha = 0.9;
      ctx.fillRect(-s * 0.32, -s, s * 0.64, s * 2);
      ctx.fillRect(-s, -s * 0.32, s * 2, s * 0.64);
      ctx.restore();

      // 金蛇果 / 冰冻果 的果梗 + 叶子（bonus 不需要）
      if (sp.type !== 'bonus') {
        ctx.strokeStyle = sp.type === 'gold' ? '#7c4a12' : '#0e7490';
        ctx.lineWidth = Math.max(1, cell * 0.075);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y - r * 0.78);
        ctx.quadraticCurveTo(x + r * 0.12, y - r * 1.12, x + r * 0.3, y - r * 1.25);
        ctx.stroke();

        ctx.fillStyle = sp.type === 'gold' ? '#4ade80' : '#a5f3fc';
        ctx.beginPath();
        ctx.ellipse(x + r * 0.52, y - r * 1.12, r * 0.36, r * 0.17, -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    },

    /**
     * 蛇身：用圆头折线一次性描出来，天然处理转弯处的连接，
     * 再叠一层虚线做出"鳞片分节"的质感。
     */
    drawSnake: function (alpha) {
      const ctx = this.ctx;
      const cell = this.cell;
      const n = Game.snake.length;
      if (n === 0) return;

      // 1) 计算每节插值的像素中心
      const pts = new Array(n);
      for (let i = 0; i < n; i++) {
        const cur = Game.snake[i];
        const prev = (i < Game.prevSnake.length) ? Game.prevSnake[i] : cur;
        pts[i] = {
          x: this.cx(prev.x + (cur.x - prev.x) * alpha),
          y: this.cy(prev.y + (cur.y - prev.y) * alpha)
        };
      }

      const path = new Path2D();
      path.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < n; i++) path.lineTo(pts[i].x, pts[i].y);

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // 2) 深色描边（轮廓）
      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = cell * 0.9;
      ctx.stroke(path);

      // 3) 主体渐变：蛇头浅绿 -> 蛇尾深绿
      const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
      grad.addColorStop(0, '#86efac');
      grad.addColorStop(0.45, '#34d399');
      grad.addColorStop(1, '#16a34a');
      ctx.strokeStyle = grad;
      ctx.lineWidth = cell * 0.74;
      ctx.stroke(path);

      // 4) 背部虚线高光，做出分节质感
      ctx.save();
      ctx.setLineDash([cell * 0.2, cell * 0.36]);
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = cell * 0.24;
      ctx.stroke(path);
      ctx.restore();

      // 5) 蛇头：眼睛 + 嘴巴
      this.drawHead(pts[0], pts[Math.min(1, n - 1)]);
    },

    drawHead: function (head, neck) {
      const ctx = this.ctx;
      const cell = this.cell;
      const pulse = 1 + Game.headPulse * 0.16;

      let dx = head.x - neck.x;
      let dy = head.y - neck.y;
      let len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.001) {
        // 蛇头与蛇颈重合（蛇长为 1）时无法求出朝向，退化到当前前进方向。
        // 注意：必须在归一化之前判断，否则 len 被兜成 1 后该分支永远进不来。
        dx = Game.dir.x; dy = Game.dir.y; len = 1;
      }
      dx /= len; dy /= len;

      ctx.save();
      ctx.translate(head.x, head.y);

      // 头部底色（略大于身体，形成圆润的脑袋）
      const hr = cell * 0.46 * pulse;
      const g = ctx.createRadialGradient(-hr * 0.3, -hr * 0.3, hr * 0.1, 0, 0, hr);
      g.addColorStop(0, '#bbf7d0');
      g.addColorStop(1, '#4ade80');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, hr, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛：沿前进方向的垂线左右对称分布
      const px = -dy, py = dx;               // 垂直向量
      const eyeOff = cell * 0.2, eyeFwd = cell * 0.12;
      const eyeR = cell * 0.135, pupilR = cell * 0.072;

      for (let s = -1; s <= 1; s += 2) {
        const ex = px * eyeOff * s + dx * eyeFwd;
        const ey = py * eyeOff * s + dy * eyeFwd;

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(ex + dx * eyeR * 0.28, ey + dy * eyeR * 0.28, pupilR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(ex - dx * pupilR * 0.3 + px * pupilR * 0.35,
                ey - dy * pupilR * 0.3 + py * pupilR * 0.35, pupilR * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }

      // 嘴巴：吃到食物瞬间张开
      const open = Game.headPulse * cell * 0.07;
      ctx.strokeStyle = 'rgba(6,78,59,0.75)';
      ctx.lineWidth = Math.max(1, cell * 0.05);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(dx * cell * 0.3 - px * cell * 0.1, dy * cell * 0.3 - py * cell * 0.1);
      ctx.quadraticCurveTo(dx * cell * (0.42 + open * 2), dy * cell * (0.42 + open * 2),
                           dx * cell * 0.3 + px * cell * 0.1, dy * cell * 0.3 + py * cell * 0.1);
      ctx.stroke();

      ctx.restore();
    },

    /** Boss 蛇（D 轮）：暗红发光的危险之蛇，独立于玩家蛇绘制 */
    drawBoss: function (alpha) {
      const b = Game.boss;
      if (!b || !b.snake.length) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const n = b.snake.length;

      const pts = new Array(n);
      for (let i = 0; i < n; i++) {
        const cur = b.snake[i];
        const prev = (i < b.prevSnake.length) ? b.prevSnake[i] : cur;
        pts[i] = {
          x: this.cx(prev.x + (cur.x - prev.x) * alpha),
          y: this.cy(prev.y + (cur.y - prev.y) * alpha)
        };
      }

      const path = new Path2D();
      path.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < n; i++) path.lineTo(pts[i].x, pts[i].y);

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // 深色描边
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = cell * 0.9;
      ctx.stroke(path);

      // 主体渐变
      const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
      grad.addColorStop(0, '#fb7185');
      grad.addColorStop(0.5, '#e11d48');
      grad.addColorStop(1, '#9f1239');
      ctx.strokeStyle = grad;
      ctx.lineWidth = cell * 0.72;
      ctx.stroke(path);

      // 头部
      const head = pts[0];
      const neck = pts[Math.min(1, n - 1)];
      let dx = head.x - neck.x, dy = head.y - neck.y;
      let len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.001) { dx = b.dir.x; dy = b.dir.y; len = 1; }
      dx /= len; dy /= len;

      ctx.save();
      ctx.translate(head.x, head.y);
      const hr = cell * 0.46;
      ctx.shadowColor = 'rgba(225,29,72,0.85)';
      ctx.shadowBlur = cell * 0.4;
      const hg = ctx.createRadialGradient(-hr * 0.3, -hr * 0.3, hr * 0.1, 0, 0, hr);
      hg.addColorStop(0, '#fecaca');
      hg.addColorStop(1, '#ef4444');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(0, 0, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 眼睛（沿前进方向垂线对称）
      const px = -dy, py = dx;
      const eo = cell * 0.2, ef = cell * 0.12, er = cell * 0.13, pr = cell * 0.07;
      for (let s = -1; s <= 1; s += 2) {
        const ex = px * eo * s + dx * ef, ey = py * eo * s + dy * ef;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(ex + dx * er * 0.3, ey + dy * er * 0.3, pr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    },

    /** 关卡横幅（D 轮）：进关瞬间居中显示「第 N 关」，淡入淡出 */
    drawBanner: function () {
      if (Game.stageBannerTime <= 0 || !Game.stageBannerText) return;
      const ctx = this.ctx;
      const size = this.size;
      const t = Game.stageBannerTime;
      const aIn = Math.min(1, (2.0 - t) / 0.3);    // 前 0.3s 淡入
      const aOut = Math.min(1, t / 0.5);           // 末 0.5s 淡出
      const alpha = Math.max(0, Math.min(aIn, aOut));
      if (alpha <= 0) return;
      const pulse = 1 + Math.sin(Fx.time * 6) * 0.04;
      const fontSize = Math.round(size * 0.11 * pulse);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 ' + fontSize + 'px ' + getFontFamily();
      ctx.lineWidth = Math.max(3, size * 0.012);
      ctx.strokeStyle = 'rgba(11,18,32,0.9)';
      ctx.strokeText(Game.stageBannerText, size / 2, size / 2 - size * 0.02);
      const g = ctx.createLinearGradient(0, size / 2 - fontSize, 0, size / 2 + fontSize);
      g.addColorStop(0, '#c4b5fd');
      g.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = g;
      ctx.fillText(Game.stageBannerText, size / 2, size / 2 - size * 0.02);
      if (Game.boss) {
        ctx.font = '600 ' + Math.round(size * 0.045) + 'px ' + getFontFamily();
        ctx.fillStyle = '#fecaca';
        ctx.fillText('⚠ Boss 蛇出没', size / 2, size / 2 + size * 0.08);
      }
      ctx.restore();
    },

    drawParticles: function () {
      const ctx = this.ctx;
      for (let i = 0; i < Fx.particles.length; i++) {
        const p = Fx.particles[i];
        const a = Math.max(0, Math.min(1, p.life / p.maxLife));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    },

    drawFloaters: function () {
      const ctx = this.ctx;
      const cell = this.cell;
      for (let i = 0; i < Fx.floaters.length; i++) {
        const f = Fx.floaters[i];
        const a = Math.max(0, Math.min(1, f.life / f.maxLife));
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fde047';
        ctx.font = '800 ' + Math.round(cell * 0.62) + 'px ' + getFontFamily();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(11,18,32,0.85)';
        ctx.lineWidth = Math.max(2, cell * 0.14);
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }
  };

  /** 圆角矩形路径（自己实现，避免依赖 ctx.roundRect 的兼容性） */
  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function getFontFamily() {
    return '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
  }

  /** 转义文本，避免用户名破坏面板 HTML 结构 */
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** 排行榜日期只取 YYYY-MM-DD 展示 */
  function formatLbDate(iso) {
    if (typeof iso !== 'string' || iso.length < 10) return '';
    return iso.slice(0, 10);
  }

  /** 时长格式化为「Xs」或「Xm Ys」 */
  function formatLbDuration(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + 'm' + (s ? s + 's' : '');
  }

  /* ============================================================
   * 8. UI 层（HUD + 遮罩面板 + 音效按钮 + 排行榜）
   * ========================================================== */
  const UI = {
    els: {},
    lbClearArmed: false,        // 清空按钮是否处于「二次确认倒计时」状态
    lbClearTimer: null,         // 5 秒自动取消的计时器句柄
    lbClearCountdown: 0,        // 倒计时剩余秒数

    init: function () {
      this.els = {
        score: document.getElementById('scoreEl'),
        best: document.getElementById('bestEl'),
        level: document.getElementById('levelEl'),
        tps: document.getElementById('tpsEl'),
        speedFill: document.getElementById('speedFill'),
        overlay: document.getElementById('overlay'),
        panel: document.getElementById('panel'),
        soundBtn: document.getElementById('soundBtn'),
        wave1: document.getElementById('wave1'),
        wave2: document.getElementById('wave2'),
        slash: document.getElementById('slash'),
        themeBtn: document.getElementById('themeBtn'),
        moonIcon: document.getElementById('moonIcon'),
        sunIcon: document.getElementById('sunIcon'),
        stage: document.getElementById('stage'),
        buffBar: document.getElementById('buffBar'),
        buffIc: document.getElementById('buffIc'),
        buffTx: document.getElementById('buffTx'),
        buffTm: document.getElementById('buffTm'),
        stageEl: document.getElementById('stageEl'),
        stageProgEl: document.getElementById('stageProgEl')
      };

      this.els.overlay.addEventListener('click', function () { App.primaryAction(); });
      this.els.soundBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        Sfx.muted = !Sfx.muted;
        Storage.set(Config.STORAGE_MUTED, Sfx.muted ? '1' : '0');
        if (!Sfx.muted) { Sfx.unlock(); Sfx.start(); }
        UI.syncSoundIcon();
      });

      // 主题切换：toggle data-theme + 持久化（themeBtn 可能不存在，如测试环境，需保护）
      const tb = this.els.themeBtn;
      if (tb) {
        const applyTheme = function (theme) {
          if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
          else delete document.documentElement.dataset.theme;
          Storage.set(Config.STORAGE_THEME, theme);
          UI.syncThemeIcon();
        };
        tb.addEventListener('click', function (e) {
          e.stopPropagation();
          const cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
          applyTheme(cur === 'dark' ? 'light' : 'dark');
        });
        // 启动：读取持久化主题（默认浅色）
        const savedTheme = Storage.get(Config.STORAGE_THEME, 'light');
        applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
      }

      this.syncSoundIcon();
      this.updateHud();
      this.syncOverlay();
    },

    syncSoundIcon: function () {
      const on = !Sfx.muted;
      this.els.wave1.style.display = on ? '' : 'none';
      this.els.wave2.style.display = on ? '' : 'none';
      this.els.slash.style.display = on ? 'none' : '';
      this.els.soundBtn.classList.toggle('is-off', !on);
      this.els.soundBtn.title = on ? '音效：开' : '音效：关';
    },

    syncThemeIcon: function () {
      const dark = document.documentElement.dataset.theme === 'dark';
      if (this.els.moonIcon) this.els.moonIcon.style.display = dark ? 'none' : '';
      if (this.els.sunIcon)  this.els.sunIcon.style.display  = dark ? '' : 'none';
      if (this.els.themeBtn) this.els.themeBtn.title = dark ? '主题：深色（点击切浅色）' : '主题：浅色（点击切深色）';
    },

    updateHud: function () {
      this.els.score.textContent = String(Game.score);
      this.els.best.textContent = String(Game.best);
      this.els.level.textContent = String(Game.level + 1);
      this.els.tps.textContent = Game.tps().toFixed(1) + '/s';

      const span = Config.MAX_TPS - Config.BASE_TPS;
      const pct = span <= 0 ? 100 : ((Game.tps() - Config.BASE_TPS) / span) * 100;
      this.els.speedFill.style.width = Math.max(4, Math.min(100, pct)).toFixed(1) + '%';

      // D 轮：关卡指示
      if (this.els.stageEl) {
        this.els.stageEl.textContent = '第 ' + Game.stage + ' 关';
      }
      if (this.els.stageProgEl) {
        this.els.stageProgEl.textContent = Game.stageMode
          ? ('食物 ' + Game.stageFoods + '/' + Game.stageTarget)
          : '';
      }
    },

    /**
     * 刷新加速/减速状态条（金蛇果 / 冰冻果 buff 期间显示）。
     * 暂停时 buff 冻结，倒数也跟着定格，符合「暂停特效冻结」；
     * 非 PLAYING/PAUSED 或无 buff 时隐藏。
     */
    updateBuff: function () {
      const bar = this.els.buffBar;
      if (!bar) return;
      const active = (Game.state === STATE.PLAYING || Game.state === STATE.PAUSED);
      if (active && Game.speedBuffAdd !== 0 && Game.speedBuffTime > 0) {
        const gold = Game.speedBuffAdd > 0;
        bar.hidden = false;
        bar.classList.toggle('gold', gold);
        bar.classList.toggle('ice', !gold);
        if (this.els.buffIc) this.els.buffIc.textContent = gold ? '⚡' : '❄';
        if (this.els.buffTx) this.els.buffTx.textContent = gold ? '加速' : '减速';
        if (this.els.buffTm) this.els.buffTm.textContent = Game.speedBuffTime.toFixed(1) + 's';
      } else {
        bar.hidden = true;
      }
    },

    /** 根据状态渲染遮罩面板内容（三屏均走正常文档流，用 gap 隔开层级） */
    syncOverlay: function () {
      const s = Game.state;
      let html = '';

      if (s === STATE.READY) {
        html =
          '<div class="tag green">READY</div>' +
          '<h2>贪吃蛇</h2>' +
          '<p class="desc">用 <b>↑ ↓ ← →</b> 或 <b>W A S D</b> 控制方向。<br>' +
          '吃到苹果变长加分，吃满目标食物进入下一关；<br>' +
          '第 ' + Config.BOSS_FIRST_STAGE + ' / ' + Config.TOTAL_STAGES + ' 关迎战 <b>Boss 蛇</b>，撞墙、撞障碍或撞到它就结束。</p>' +
          '<button class="btn" id="ovBtn" type="button">开始游戏</button>' +
          '<p class="hint">按 空格 / 点击屏幕 开始</p>' +
          this.renderLeaderboardBlock();

      } else if (s === STATE.PAUSED) {
        // 暂停屏不加排行榜，保持轻量
        html =
          '<div class="tag">PAUSED</div>' +
          '<h2>已暂停</h2>' +
          '<p class="desc">当前得分 <b>' + Game.score + '</b>　最高分 <b>' + Game.best + '</b></p>' +
          '<button class="btn" id="ovBtn" type="button">继续游戏</button>' +
          '<p class="hint">按 空格 / Esc 继续，移动端轻点屏幕继续，按 R 重新开始</p>';

      } else if (s === STATE.GAMEOVER) {
        const title = Game.win ? '通关啦！' : '游戏结束';
        let reason;
        if (Game.win)                           reason = '你清空了全部 ' + Config.TOTAL_STAGES + ' 关，这不太科学……';
        else if (Game.deathReason === 'wall')     reason = '撞到墙壁了，注意提前转向。';
        else if (Game.deathReason === 'obstacle') reason = '撞到障碍物了，绕着走。';
        else if (Game.deathReason === 'boss')     reason = '被 Boss 蛇撞上了，下次离它远点。';
        else                                       reason = '咬到自己了，别急着回头。';
        if (!Game.win) reason += '（本局闯到第 ' + Game.stage + ' 关）';

        // 本局成绩已在 endGame 时写入排行榜（Leaderboard.lastRecord）
        let lbHtml = '';
        const rec = Leaderboard.lastRecord;
        if (rec) {
          const rank = Leaderboard.rank(rec.score);
          const total = Leaderboard.count();
          const medalCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
          const medalIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#';
          lbHtml =
            '<div class="lb-current">' +
              '<div class="rank-badge ' + medalCls + '">' +
                '<span class="medal">' + medalIcon + '</span>' +
                '<span class="rank-num">第 ' + rank + ' / ' + total + ' 名</span>' +
              '</div>' +
            '</div>' +
            '<div class="lb-current">' +
              '<input id="lbName" type="text" maxlength="3" value="' + escapeHtml(rec.name) + '" readonly placeholder="Ply">' +
              '<button id="lbEdit" type="button">改名</button>' +
              '<button id="lbSave" type="button" style="display:none">保存</button>' +
            '</div>';
        }

        // 蛇长 = 初始长度 + 吃到的食物数
        const snakeLen = Game.snake.length;
        // 速度等级 = Game.level + 1（UI 上从 1 开始计数）
        const speedLv = Game.level + 1;
        const tpsVal = Game.tps().toFixed(1);

        html =
          '<div class="tag amber">GAME OVER</div>' +
          '<h2>' + title + '</h2>' +
          (Game.isRecord ? '<div class="record-badge">★ 新纪录</div>' : '') +
          '<div class="go-stats">' +
            '<div class="cell score"><div class="k">本局得分</div><div class="v">' + Game.score + '</div></div>' +
            '<div class="cell len"><div class="k">蛇身长度</div><div class="v">' + snakeLen + '</div></div>' +
            '<div class="cell speed"><div class="k">最快速度</div><div class="v">Lv.' + speedLv + '<small>·' + tpsVal + '/s</small></div></div>' +
          '</div>' +
          '<p class="desc">' + reason + '</p>' +
          lbHtml +
          '<button class="btn" id="ovBtn" type="button">再来一局</button>' +
          '<p class="hint">按 R / 空格 / 点击屏幕 重新开始</p>';

      } else {
        this.els.overlay.hidden = true;
        return;
      }

      this.els.panel.innerHTML = html;
      this.els.overlay.hidden = false;
      this.updateBuff();

      const self = this;
      const btn = document.getElementById('ovBtn');
      if (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          App.primaryAction();
        });
      }

      // 开始屏：清空按钮（二次确认）
      const clearBtn = document.getElementById('lbClear');
      if (clearBtn) {
        clearBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          self.onClearClick();
        });
      }

      // 结束屏：名次改名
      const lbName = document.getElementById('lbName');
      if (lbName) {
        lbName.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.code === 'Enter') {
            e.preventDefault();
            self.onSaveName();
          }
        });
      }
      const editBtn = document.getElementById('lbEdit');
      if (editBtn) {
        editBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          self.onEditName();
        });
      }
      const saveBtn = document.getElementById('lbSave');
      if (saveBtn) {
        saveBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          self.onSaveName();
        });
      }
    },

    /** 开始屏排行榜区块：Top 10 列表 + 清空入口 */
    renderLeaderboardBlock: function () {
      const self = Leaderboard.lastRecord;
      // 用于高亮"自己"行：与 lastRecord 同名 + 同分的最新记录视为"自己"
      const selfKey = self ? (self.name + '|' + self.score) : null;

      let rows = '';
      if (Leaderboard.entries.length === 0) {
        rows = '<li class="lb-empty">暂无记录</li>';
      } else {
        for (let i = 0; i < Leaderboard.entries.length; i++) {
          const e = Leaderboard.entries[i];
          const rank = i + 1;
          const topCls = rank <= 3 ? ' is-top' + rank : '';
          const key = e.name + '|' + e.score;
          const selfCls = (selfKey && key === selfKey) ? ' is-self' : '';
          const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
          rows +=
            '<li class="' + topCls + selfCls + '">' +
              '<span class="lb-ranknum">' + rankIcon + '</span>' +
              '<span class="lb-name">' + escapeHtml(e.name) + '</span>' +
              '<span class="lb-score">' + e.score + '</span>' +
              '<span class="lb-meta">' + formatLbDate(e.date) + ' · ' + formatLbDuration(e.duration) + '</span>' +
            '</li>';
        }
      }
      const clearLabel = this.lbClearArmed ? '确认清空 (' + this.lbClearCountdown + 's)' : '清空';
      return '' +
        '<div class="leaderboard">' +
          '<div class="lb-header">' +
            '<span>排行榜 TOP ' + Config.LEADERBOARD_MAX + '</span>' +
            '<button id="lbClear" type="button" class="lb-danger">' + clearLabel + '</button>' +
          '</div>' +
          '<ul class="lb-list">' + rows + '</ul>' +
        '</div>';
    },

    /** 清空按钮：首次点击进入 5 秒二次确认倒计时（防误点），再次点击才真正清空 */
    onClearClick: function () {
      if (this.lbClearArmed) {
        Leaderboard.clear();
        this.disarmClear();
        this.syncOverlay();
      } else {
        this.armClear();
      }
    },

    armClear: function () {
      this.lbClearArmed = true;
      this.lbClearCountdown = 5;
      const btn = document.getElementById('lbClear');
      if (btn) btn.textContent = '确认清空 (' + this.lbClearCountdown + 's)';
      const self = this;
      // 5 秒后若未确认，自动取消
      this.lbClearTimer = window.setTimeout(function () {
        self.disarmClear();
        self.syncOverlay();
      }, 5000);
      // 倒计时数字递减（仅提示，不影响逻辑）
      for (let i = 1; i <= 5; i++) {
        (function (step) {
          window.setTimeout(function () {
            if (!self.lbClearArmed) return;
            self.lbClearCountdown = 5 - step;
            const b = document.getElementById('lbClear');
            if (b && self.lbClearArmed) b.textContent = '确认清空 (' + self.lbClearCountdown + 's)';
          }, step * 1000);
        })(i);
      }
    },

    disarmClear: function () {
      this.lbClearArmed = false;
      this.lbClearCountdown = 0;
      if (this.lbClearTimer) {
        window.clearTimeout(this.lbClearTimer);
        this.lbClearTimer = null;
      }
    },

    /** 结束屏「改名」：解锁输入框并切换为保存按钮 */
    onEditName: function () {
      const input = document.getElementById('lbName');
      if (input) {
        input.readOnly = false;
        if (input.focus) input.focus();
      }
      const edit = document.getElementById('lbEdit');
      const save = document.getElementById('lbSave');
      if (edit) edit.style.display = 'none';
      if (save) save.style.display = '';
    },

    /** 结束屏「保存」：以新名字重写入榜记录（改名即换名，保留成绩与时间） */
    onSaveName: function () {
      const input = document.getElementById('lbName');
      const raw = (input && typeof input.value === 'string') ? input.value.trim() : '';
      const name = raw ? raw.slice(0, 3) : 'Ply';
      const rec = Leaderboard.lastRecord;
      if (!rec) return;
      Leaderboard.remove(rec);
      const updated = Leaderboard.add({
        name: name,
        score: rec.score,
        date: new Date().toISOString(),
        duration: rec.duration
      });
      Leaderboard.lastRecord = updated;
      this.syncOverlay();
    }
  };

  /* ============================================================
   * 9. 输入（键盘 + 触摸滑动）
   * ========================================================== */
  const Input = {
    touchStart: null,

    init: function () {
      document.addEventListener('keydown', this.onKeyDown.bind(this), false);

      // 触摸滑动
      const stage = document.getElementById('stage');
      stage.addEventListener('touchstart', this.onTouchStart.bind(this), { passive: true });
      stage.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
      stage.addEventListener('touchend', this.onTouchEnd.bind(this), { passive: true });

      // 虚拟方向键（仅触摸/窄屏显示）：pointerdown 即时转向，防 300ms 延迟与缩放
      const dpadDirs = ['up', 'down', 'left', 'right'];
      for (let i = 0; i < dpadDirs.length; i++) {
        const btn = document.getElementById('dbtn-' + dpadDirs[i]);
        if (!btn) continue;
        (function (el, dirName) {
          el.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            Sfx.unlock();
            const dir = DIR[dirName];
            if (!dir) return;
            if (Game.state === STATE.READY) App.start();
            Game.queueDirection(dir);
          });
        })(btn, dpadDirs[i]);
      }
    },

    onKeyDown: function (e) {
      const k = e.key;
      const code = e.code;

      // 方向键与空格会滚动页面，统一拦截
      const isArrow = (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight');
      if (isArrow || code === 'Space' || k === ' ' || k === 'Spacebar') {
        e.preventDefault();
      }

      // 首次交互解锁音频
      Sfx.unlock();

      let dir = null;
      if (k === 'ArrowUp'    || code === 'ArrowUp'    || k === 'w' || k === 'W') dir = DIR.up;
      if (k === 'ArrowDown'  || code === 'ArrowDown'  || k === 's' || k === 'S') dir = DIR.down;
      if (k === 'ArrowLeft'  || code === 'ArrowLeft'  || k === 'a' || k === 'A') dir = DIR.left;
      if (k === 'ArrowRight' || code === 'ArrowRight' || k === 'd' || k === 'D') dir = DIR.right;

      if (dir) {
        if (Game.state === STATE.READY) {
          App.start();
        }
        Game.queueDirection(dir);
        return;
      }

      if (code === 'Space' || k === ' ' || k === 'Spacebar') {
        App.primaryAction();
        return;
      }

      if (k === 'Escape' || k === 'Esc') {
        if (Game.state === STATE.PLAYING) App.pause();
        else if (Game.state === STATE.PAUSED) App.resume();
        return;
      }

      if (k === 'r' || k === 'R') {
        App.restart();
        return;
      }

      if (k === 'Enter') {
        App.primaryAction();
        return;
      }

      // 开始界面：任意其它键也能开始
      if (Game.state === STATE.READY) {
        App.start();
      }
    },

    onTouchStart: function (e) {
      Sfx.unlock();
      if (!e.touches || e.touches.length !== 1) { this.touchStart = null; return; }
      this.touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    },

    onTouchMove: function (e) {
      // 阻止页面在画布上滑动时被拖动
      if (this.touchStart) e.preventDefault();
    },

    onTouchEnd: function (e) {
      const start = this.touchStart;
      this.touchStart = null;
      if (!start) return;
      const t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
      if (!t) return;

      const dx = t.clientX - start.x;
      const dy = t.clientY - start.y;

      // 位移过小视为轻点（tap）：
      //   - 游戏中 -> 暂停（满足"移动端轻点暂停"，overlay 此时 hidden 不抢事件）
      //   - 准备态 -> 开始（保留原"轻点开始"能力）
      //   - 结束/暂停态 overlay 已显示，轻点交给 overlay 的 click -> primaryAction 处理，避免双重触发
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
        if (Game.state === STATE.PLAYING) App.pause();
        else if (Game.state === STATE.READY) App.start();
        return;
      }

      if (Game.state === STATE.READY) App.start();

      let dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = (dx > 0) ? DIR.right : DIR.left;
      else                             dir = (dy > 0) ? DIR.down  : DIR.up;
      Game.queueDirection(dir);
    }
  };

  /* ============================================================
   * 10. 应用主控：状态切换 + 固定步长主循环
   * ========================================================== */
  const App = {
    lastTime: 0,
    accumulator: 0,
    alpha: 1,
    running: false,
    gameStart: 0,               // 本局开始的真实时间戳（ms），用于统计时长
    boundFrame: null,           // 预先绑定，避免每帧创建新的闭包

    init: function () {
      Game.init();
      Leaderboard.load();
      Renderer.init(document.getElementById('game'));
      UI.init();
      Input.init();

      // 窗口尺寸变化：重设画布并立即重绘
      let resizeTimer = null;
      window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          Renderer.resize();
          Renderer.render(App.alpha);
        }, 60);
      }, false);
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { Renderer.resize(); Renderer.render(App.alpha); }, 220);
      }, false);

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function () {
          Renderer.resize();
          Renderer.render(App.alpha);
        }).observe(document.getElementById('stage'));
      }

      // 页面不可见 / 失焦时自动暂停
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && Game.state === STATE.PLAYING) App.pause();
      }, false);
      window.addEventListener('blur', function () {
        if (Game.state === STATE.PLAYING) App.pause();
      }, false);

      this.running = true;
      this.boundFrame = this.frame.bind(this);
      this.lastTime = performance.now();
      this._hasRendered = false;
      requestAnimationFrame(this.boundFrame);
    },

    /**
     * 遮罩按钮 / 空格 / 点击遮罩的统一行为。
     * 四个状态全部覆盖（README 与页脚都宣称「空格 = 开始/暂停/继续/重开」）。
     * 说明：playing 态下遮罩是 hidden 的，所以点击路径不会走到 PLAYING 分支，
     *       只有键盘空格会命中它。
     */
    primaryAction: function () {
      Sfx.unlock();
      if (Game.state === STATE.READY)         this.start();
      else if (Game.state === STATE.PLAYING)  this.pause();
      else if (Game.state === STATE.PAUSED)   this.resume();
      else if (Game.state === STATE.GAMEOVER) this.restart();
    },

    start: function () {
      if (Game.state === STATE.READY || Game.state === STATE.GAMEOVER) {
        Game.stageMode = true;        // 闯关模式：真实开局即开启（D 轮）
        Game.reset();
      }
      Game.state = STATE.PLAYING;
      this.gameStart = Date.now();
      this.accumulator = 0;
      this.alpha = 0;
      Fx.clear();
      Sfx.start();
      UI.updateHud();
      UI.syncOverlay();
    },

    /**
     * 结束一局时把成绩写入排行榜（默认名 Ply），并记住本局记录用于后续改名。
     * 兼容隐私模式：localStorage 写入失败时静默降级，不抛异常。
     */
    commitScore: function () {
      const end = Date.now();
      const duration = this.gameStart
        ? Math.max(0, Math.floor((end - this.gameStart) / 1000))
        : 0;
      const stored = Leaderboard.add({
        name: 'Ply',
        score: Game.score,
        date: new Date().toISOString(),
        duration: duration
      });
      Leaderboard.lastRecord = stored;
    },

    pause: function () {
      if (Game.state !== STATE.PLAYING) return;
      Game.state = STATE.PAUSED;
      Sfx.pause(true);
      UI.syncOverlay();
    },

    resume: function () {
      if (Game.state !== STATE.PAUSED) return;
      Game.state = STATE.PLAYING;
      this.accumulator = 0;   // 丢弃暂停期间的时间，避免恢复瞬间连续推进
      Sfx.pause(false);
      UI.syncOverlay();
    },

    restart: function () {
      Game.stageMode = true;          // 闯关模式：重开也开启（D 轮）
      Game.reset();
      Game.state = STATE.PLAYING;
      this.gameStart = Date.now();
      this.accumulator = 0;
      this.alpha = 0;
      Fx.clear();
      Sfx.start();
      UI.updateHud();
      UI.syncOverlay();
    },

    /** 结束一局：结算、音效、震屏 */
    endGame: function () {
      Game.gameOver();
      this.commitScore();
      Fx.shakeScreen();
      // 用完震屏效果后立刻清掉残留飘字/粒子，避免遮罩半透明时被透出来叠加造成"UI 重叠"假象
      setTimeout(function () { Fx.clear(); }, 60);
      Sfx.crash();
      if (Game.isRecord) {
        setTimeout(function () { Sfx.record(); }, 320);
      }
      this.alpha = 1;
      UI.updateHud();
      UI.syncOverlay();
    },

    /**
     * 主循环：requestAnimationFrame + 时间累加器，固定步长推进逻辑，
     * 渲染每帧进行，并用 acc/interval 做插值让移动更顺滑。
     *
     * 节流策略（保持 60fps 体感但省电）：
     *   - PLAYING 态：每帧都渲染（食物呼吸、震屏等需要连续）
     *   - 非 PLAYING 且无任何动画（粒子/飘字/震屏/呼吸/未生效的蛇身插值）：
     *     强制跳到下一个 ≥33ms 的帧再渲染（≈30fps 上限），浏览器 tab 切回时
     *     仍立即补一帧避免黑屏
     *   - 离屏烘焙后的静态层每帧只 drawImage，不重算 gradient
     */
    frame: function (now) {
      let dt = (now - this.lastTime) / 1000;
      this.lastTime = now;
      if (!isFinite(dt) || dt < 0) dt = 0;
      if (dt > 0.25) dt = 0.25;   // 切后台回来后不要一次性补算

      let needRender = true;
      let renderAlpha = this.alpha;

      if (Game.state === STATE.PLAYING) {
        const interval = Game.tickInterval();
        this.accumulator += dt * 1000;

        // 真实时间推进 buff / 特殊食物 TTL / 自动生成（暂停态由 B 轮逻辑跳过，画面冻结）
        Game.updateTimers(dt);
        // Boss 蛇本帧撞到玩家 -> 直接判死（不 return，下方 tick 循环因状态已变而不执行，正常续帧）
        if (Game.bossHitPlayer && Game.state === STATE.PLAYING) {
          this.endGame();
        }

        let steps = 0;
        while (this.accumulator >= interval &&
               steps < Config.MAX_STEPS_PER_FRAME &&
               Game.state === STATE.PLAYING) {
          this.accumulator -= interval;
          steps++;

          const prevFood = { x: Game.food.x, y: Game.food.y };
          const result = Game.tick();

          if (result === 'dead') {
            this.endGame();
            break;
          }

          if (result === 'stageclear') {
            const px = Renderer.cx(prevFood.x);
            const py = Renderer.cy(prevFood.y);
            Fx.burst(px, py, Renderer.cell, ['#a78bfa', '#c4b5fd', '#8b5cf6', '#ddd6fe']);
            Fx.floatText(px, py - Renderer.cell * 0.5, '第 ' + Game.stage + ' 关');
            Sfx.start();
            UI.updateHud();
            continue;
          }

          if (result === 'special') {
            const ls = Game._lastSpecial;
            const px = Renderer.cx(ls.x);
            const py = Renderer.cy(ls.y);
            if (ls.type === 'gold') {
              Fx.burst(px, py, Renderer.cell, ['#fde047', '#fbbf24', '#f59e0b', '#fef3c7']);
              Fx.floatText(px, py - Renderer.cell * 0.5, '⚡加速');
            } else if (ls.type === 'ice') {
              Fx.burst(px, py, Renderer.cell, ['#a5f3fc', '#22d3ee', '#67e8f9', '#ecfeff']);
              Fx.floatText(px, py - Renderer.cell * 0.5, '❄减速');
            } else {
              Fx.burst(px, py, Renderer.cell, ['#fde68a', '#fbbf24', '#fcd34d', '#fffbeb']);
              Fx.floatText(px, py - Renderer.cell * 0.5, '+' + Config.SPECIAL_BONUS_SCORE);
            }
            Sfx.special(ls.type);
            UI.updateHud();
          }

          if (result === 'eat' || result === 'win') {
            const px = Renderer.cx(prevFood.x);
            const py = Renderer.cy(prevFood.y);
            Fx.burst(px, py, Renderer.cell);
            Fx.floatText(px, py - Renderer.cell * 0.5, '+' + Config.SCORE_PER_FOOD);
            Sfx.eat(Game.level);
            UI.updateHud();
          }

          if (result === 'win') {
            Game.gameOver();
            this.commitScore();
            this.alpha = 1;
            Sfx.record();
            UI.updateHud();
            UI.syncOverlay();
            break;
          }
        }

        // 累加器封顶：丢弃本帧消化不掉的时间欠账。
        // 极端低帧率（<4fps）叠加高等级时，单帧最多 4 步消耗不完 clamp 后的 250ms，
        // 剩余时间若不丢弃会无限累积；帧率恢复后会以 4 步/帧 长时间"快进补账"，
        // 而不是与真实时间重新同步。封顶后低帧率下游戏只是略慢，属于正确的优雅降级。
        // 用 intervalNow（而非循环前的 interval）是因为吃食物可能在本帧内升过级。
        const intervalNow = Game.tickInterval();
        const accCap = intervalNow * Config.MAX_STEPS_PER_FRAME;
        if (this.accumulator > accCap) this.accumulator = accCap;

        if (Game.state === STATE.PLAYING) {
          this.alpha = Math.max(0, Math.min(1, this.accumulator / intervalNow));
        }
        renderAlpha = this.alpha;
        UI.updateBuff();
      } else {
        // 非 PLAYING 态：累加器/alpha 保持不变（暂停时不清，resume 时再清），
        // 这样切到后台再回来时不会因为长时间 dt 累加而触发补算。
        // 节流：没有任何动画时降到 30fps，省 CPU
        renderAlpha = 0;
        const animating =
          Fx.particles.length > 0 ||
          Fx.floaters.length > 0 ||
          Fx.shake > 0 ||
          Game.headPulse > 0;
        if (!animating && this._hasRendered) {
          const sinceLast = now - (this._lastRenderTs || 0);
          if (sinceLast < 33) needRender = false;
        }
        this._hasRendered = true;
      }

      if (needRender) {
        // 暂停/结束/准备态不跑 Fx.update：Fx.time 不累加、headPulse 不衰减、粒子不更新
        // -> 画面完全定格（蛇/食物/粒子冻结），即"暂停特效冻结"
        if (Game.state === STATE.PLAYING) Fx.update(dt);
        Renderer.render(renderAlpha, Fx.time);
        this._lastRenderTs = now;
      }

      requestAnimationFrame(this.boundFrame);
    }
  };

  /* ============================================================
   * 11. 启动
   * ========================================================== */
  function boot() {
    App.init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, false);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
