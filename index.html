      // G 轮：开始屏模式选择
      for (let i = 0; i < MODES.length; i++) {
        const mbtn = document.getElementById('mode' + i);
        if (!mbtn) continue;
        (function (id) {
          mbtn.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            Game.setMode(id);
            UI.syncOverlay();
          });
        })(MODES[i].id);
      }

      // G 轮：开始屏皮肤选择（未解锁的 Skins.select 会直接返回 false）
      for (let i = 0; i < SNAKE_SKINS.length; i++) {
        const sbtn = document.getElementById('skin' + i);
        if (!sbtn) continue;
        (function (id) {
          sbtn.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (Skins.select(id)) {
              Sfx.start();
              UI.syncOverlay();
            }
          });
        })(SNAKE_SKINS[i].id);
      }

      // 开始屏：清空按钮（二次确认）
      const clearBtn = document.getElementById('lbClear');
      if (clearBtn) {
        clearBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          self.onClearClick();
        });
      }

      // 开始屏：排行榜按钮 -> 进入独立排行榜面板
      const lbBtn = document.getElementById('ovLb');
      if (lbBtn) {
        lbBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          App.showLeaderboard();
        });
      }
      // 排行榜面板：返回按钮 -> 回到开始屏
      const backBtn = document.getElementById('ovBack');
      if (backBtn) {
        backBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          App.showStart();
        });
      }

      // 开始屏：好友榜按钮 -> 进入独立好友榜面板
      const frBtn = document.getElementById('ovFriends');
      if (frBtn) {
        frBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          App.showFriends();
        });
      }
      // 开始屏：成就按钮 -> 跳转到成就系统独立展示页
      const achBtn = document.getElementById('ovAch');
      if (achBtn) {
        achBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          window.location.href = 'achievements-showcase.html';
        });
      }
      // 开始屏：玩法指引按钮 -> 打开指引弹窗
      const guideBtn = document.getElementById('ovGuide');
      if (guideBtn) {
        guideBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          UI.showGuide();
        });
      }
      // 开始屏：天赋按钮 -> 进入独立天赋面板
      const talentBtn = document.getElementById('ovTalent');
      if (talentBtn) {
        talentBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          Game.state = STATE.TALENTS;
          UI.syncOverlay();
        });
      }
      // 开始屏：每日挑战 -> 开始一局当日同图挑战
      const dailyBtn = document.getElementById('ovDaily');
      if (dailyBtn) {
        dailyBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          App.startDaily();
        });
      }
      // 开始屏：每日榜 -> 进入独立每日榜面板
      const dailyLbBtn = document.getElementById('ovDailyLb');
      if (dailyLbBtn) {
        dailyLbBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          App.showDaily();
        });
      }
      // 天赋面板：逐张升级按钮 -> 扣星屑并刷新面板
      if (Game.state === STATE.TALENTS) {
        const defs = Meta.defs();
        for (let i = 0; i < defs.length; i++) {
          const upBtn = document.getElementById('talentUp' + i);
          if (!upBtn) continue;
          (function (id) {
            upBtn.addEventListener('click', function (e) {
              if (e && e.stopPropagation) e.stopPropagation();
              if (Meta.upgrade(id)) UI.syncOverlay();
            });
          })(defs[i].id);
        }
      }
      // 好友榜面板：导入 / 删除 / 返回
      const importBtn = document.getElementById('ovImport');
      if (importBtn) {
        importBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          self.onImportFriend();
        });
      }
      const friendInput = document.getElementById('friendCode');
      if (friendInput) {
        friendInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.code === 'Enter') {
            e.preventDefault();
            self.onImportFriend();
          }
        });
      }
      const frList = FriendsBoard.list();
      for (let i = 0; i < frList.length; i++) {
        const delBtn = document.getElementById('frDel' + i);
        if (!delBtn) continue;
        (function (code) {
          delBtn.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            FriendsBoard.remove(code);
            self.syncOverlay();
          });
        })(frList[i].code);
      }

      // 结束屏：复制分享码 / 保存成绩卡
      const copyBtn = document.getElementById('ovShareCopy');
      if (copyBtn) {
        copyBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          const codeEl = document.getElementById('shareCode');
          const txt = codeEl ? codeEl.textContent : '';
          copyText(txt);
          copyBtn.textContent = '已复制 ✓';
          setTimeout(function () { copyBtn.textContent = '复制分享码'; }, 1500);
        });
      }
      const cardBtn = document.getElementById('ovCardSave');
      if (cardBtn) {
        cardBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          saveScoreCard();
        });
      }

      // 结束屏：名次改名
      const lbName = document.getElementById('lbName');
      if (lbName) {
        lbName.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.code === 'Enter') {
            e.preventDefault();
            self.onSaveName();
          }
        });
      }
      const editBtn = document.getElementById('lbEdit');
      if (editBtn) {
        editBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          self.onEditName();
        });
      }
      const saveBtn = document.getElementById('lbSave');
      if (saveBtn) {
        saveBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          self.onSaveName();
        });
      }
    },

    /** E 轮：选中第 index 张升级卡 —— 生效、播音效、关面板、继续游戏 */
    pickUpgrade: function (index) {
      const list = Game.pendingUpgrades;
      if (!Game.awaitingUpgrade || !list || index < 0 || index >= list.length) return false;
      const id = list[index].id;
      if (!Game.applyUpgrade(id)) return false;
      Sfx.upgrade();
      App.afterUpgrade();
      return true;

              '<span class="ach-name">' + escapeHtml(a.name) + '</span>' +

    /** H 轮：导入一条好友分享码，刷新提示与列表 */
    onImportFriend: function () {
      const input = document.getElementById('friendCode');
      const code = input ? input.value : '';
      const res = FriendsBoard.add(code);
      this.syncOverlay();   // 先刷新好友列表（会重建面板，旧提示元素随之销毁）
      const msgEl = document.getElementById('friendMsg');  // 取重建后的元素再写提示
      if (msgEl) {
        if (res.ok) msgEl.textContent = '已导入好友成绩：' + (res.data.s) + ' 分';
        else if (res.reason === 'dup') msgEl.textContent = '这条分享码已经导入过了';
        else if (res.reason === 'empty') msgEl.textContent = '请先粘贴分享码';
        else msgEl.textContent = '分享码无法识别，请检查是否完整';
        msgEl.className = 'social-msg' + (res.ok ? ' ok' : ' err');
      }
    },

    /** 清空按钮：首次点击进入 5 秒二次确认倒计时（防误点），再次点击才真正清空 */
    onClearClick: function () {
      if (this.lbClearArmed) {
        Leaderboard.clear();
        this.disarmClear();
        this.syncOverlay();
      } else {
        this.armClear();
      }
    },

    armClear: function () {
      this.lbClearArmed = true;
      this.lbClearCountdown = 5;
      const btn = document.getElementById('lbClear');
      if (btn) btn.textContent = '清空(' + this.lbClearCountdown + 's)';
      const self = this;
      // 5 秒后若未确认，自动取消
      this.lbClearTimer = window.setTimeout(function () {
        self.disarmClear();
        self.syncOverlay();
      }, 5000);
      // 倒计时数字递减（仅提示，不影响逻辑）
      for (let i = 1; i <= 5; i++) {
        (function (step) {
          window.setTimeout(function () {
            if (!self.lbClearArmed) return;
            self.lbClearCountdown = 5 - step;
            const b = document.getElementById('lbClear');
            if (b && self.lbClearArmed) b.textContent = '清空(' + self.lbClearCountdown + 's)';
          }, step * 1000);
        })(i);
      }
    },

    disarmClear: function () {
      this.lbClearArmed = false;
      this.lbClearCountdown = 0;
      if (this.lbClearTimer) {
        window.clearTimeout(this.lbClearTimer);
        this.lbClearTimer = null;
      }
    },

    /** 结束屏「改名」：解锁输入框并切换为保存按钮 */
    onEditName: function () {
      const input = document.getElementById('lbName');
      if (input) {
        input.readOnly = false;
        if (input.focus) input.focus();
      }
      const edit = document.getElementById('lbEdit');
      const save = document.getElementById('lbSave');
      if (edit) edit.style.display = 'none';
      if (save) save.style.display = '';
    },

    /** 结束屏「保存」：以新名字重写入榜记录（改名即换名，保留成绩与时间） */
    onSaveName: function () {
      const input = document.getElementById('lbName');
      const raw = (input && typeof input.value === 'string') ? input.value.trim() : '';
      const name = raw ? raw.slice(0, 10) : 'Ply';
      const rec = Leaderboard.lastRecord;
      if (!rec) return;
      Leaderboard.remove(rec);
      const updated = Leaderboard.add({
        name: name,
        score: rec.score,
        date: new Date().toISOString(),
        duration: rec.duration
      });
      Leaderboard.lastRecord = updated;
      this.syncOverlay();
    }
  };

  /* ============================================================
   * 9. 输入（键盘 + 触摸滑动）
   * ========================================================== */
  const Input = {
    touchStart: null,

    init: function () {
      document.addEventListener('keydown', this.onKeyDown.bind(this), false);

      // 触摸滑动
      const stage = document.getElementById('stage');
      stage.addEventListener('touchstart', this.onTouchStart.bind(this), { passive: true });
      stage.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
      stage.addEventListener('touchend', this.onTouchEnd.bind(this), { passive: true });
    },

    onKeyDown: function (e) {
      const k = e.key;
      const code = e.code;

      // 方向键与空格会滚动页面，统一拦截
      const isArrow = (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight');
      if (isArrow || code === 'Space' || k === ' ' || k === 'Spacebar') {
        e.preventDefault();
      }

      // 首次交互解锁音频
      Sfx.unlock();

      // 玩法指引弹窗打开时：Esc / 空格 / Enter / 方向键 先关闭弹窗，不触发开始游戏
      if (UI.guideVisible) {
        if (k === 'Escape' || k === 'Esc' || code === 'Space' || k === ' ' || k === 'Spacebar' || k === 'Enter' || isArrow) {
          UI.hideGuide();
          return;
        }
      }

      // E 轮：升级卡选择（1 / 2 / 3），放在方向键之前拦截
      if (Game.awaitingUpgrade && (k === '1' || k === '2' || k === '3')) {
        UI.pickUpgrade(parseInt(k, 10) - 1);
        return;
      }

      let dir = null;
      if (k === 'ArrowUp'    || code === 'ArrowUp'    || k === 'w' || k === 'W') dir = DIR.up;
      if (k === 'ArrowDown'  || code === 'ArrowDown'  || k === 's' || k === 'S') dir = DIR.down;
      if (k === 'ArrowLeft'  || code === 'ArrowLeft'  || k === 'a' || k === 'A') dir = DIR.left;
      if (k === 'ArrowRight' || code === 'ArrowRight' || k === 'd' || k === 'D') dir = DIR.right;

      if (dir) {
        if (Game.state === STATE.READY) {
          App.start();
        }
        Game.queueDirection(dir);
        return;
      }

      if (code === 'Space' || k === ' ' || k === 'Spacebar') {
        App.primaryAction();
        return;
      }

      if (k === 'Escape' || k === 'Esc') {
        if (Game.state === STATE.PLAYING) App.pause();
        else if (Game.state === STATE.PAUSED) App.resume();
        else if (Game.state === STATE.LEADERBOARD) App.showStart();
        else if (Game.state === STATE.SOCIAL) App.showStart();
        else if (Game.state === STATE.ACHIEVEMENTS) App.showStart();
        else if (Game.state === STATE.TALENTS) App.showStart();
        else if (Game.state === STATE.DAILY) App.showStart();
        return;
      }

      // J 轮：独立面板态（含每日榜）下 R 键不误重开上一局
      if (k === 'r' || k === 'R') {
        if (Game.state === STATE.PLAYING || Game.state === STATE.PAUSED ||
            Game.state === STATE.GAMEOVER || Game.state === STATE.READY) {
          App.restart();
        }
        return;
      }

      if (k === 'Enter') {
        App.primaryAction();
        return;
      }

      // 开始界面：任意其它键也能开始
      if (Game.state === STATE.READY) {
        App.start();
      }
    },

    onTouchStart: function (e) {
      Sfx.unlock();
      if (!e.touches || e.touches.length !== 1) { this.touchStart = null; return; }
      this.touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    },

    onTouchMove: function (e) {
      // 阻止页面在画布上滑动时被拖动
      if (this.touchStart) e.preventDefault();
    },

    onTouchEnd: function (e) {
      const start = this.touchStart;
      this.touchStart = null;
      if (!start) return;
      const t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
      if (!t) return;

      const dx = t.clientX - start.x;
      const dy = t.clientY - start.y;

      // 位移过小视为轻点（tap）：
      //   - 游戏中 -> 暂停（满足"移动端轻点暂停"，overlay 此时 hidden 不抢事件）
      //   - 准备态 -> 不开始，必须点「开始游戏」按钮（与桌面一致，防误触）
      //   - 结束/暂停态 overlay 已显示，轻点交给 overlay 的 click -> primaryAction 处理，避免双重触发
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
        if (Game.state === STATE.PLAYING) App.pause();
        return;
      }

      // 准备态：不开始、不设方向，等用户点「开始游戏」按钮
      if (Game.state === STATE.READY) return;

      let dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = (dx > 0) ? DIR.right : DIR.left;
      else                             dir = (dy > 0) ? DIR.down  : DIR.up;
      Game.queueDirection(dir);
    }
  };

  /* ============================================================
   * 10. 应用主控：状态切换 + 固定步长主循环
   * ========================================================== */
  const App = {
    lastTime: 0,
    accumulator: 0,
    alpha: 1,
    running: false,
    gameStart: 0,               // 本局开始的真实时间戳（ms），用于统计时长
    boundFrame: null,           // 预先绑定，避免每帧创建新的闭包

    init: function () {
      Game.init();
      Leaderboard.load();
      Achievements.load();          // G 轮
      Skins.load();
      Stats.load();
      Renderer.init(document.getElementById('game'));
      UI.init();
      Input.init();

      // 窗口尺寸变化：重设画布并立即重绘
      let resizeTimer = null;
      window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          Renderer.resize();
          Renderer.render(App.alpha);
        }, 60);
      }, false);
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { Renderer.resize(); Renderer.render(App.alpha); }, 220);
      }, false);

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function () {
          Renderer.resize();
          Renderer.render(App.alpha);
        }).observe(document.getElementById('stage'));
      }

      // 页面不可见 / 失焦时自动暂停
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && Game.state === STATE.PLAYING) App.pause();
      }, false);
      window.addEventListener('blur', function () {
        if (Game.state === STATE.PLAYING) App.pause();
      }, false);

      this.running = true;
      this.boundFrame = this.frame.bind(this);
      this.lastTime = performance.now();
      this._hasRendered = false;
      requestAnimationFrame(this.boundFrame);

      this.maybeShowGuide();
    },

    /**
     * 遮罩按钮 / 空格 / 点击遮罩的统一行为。
     * 四个状态全部覆盖（README 与页脚都宣称「空格 = 开始/暂停/继续/重开」）。
     * 说明：playing 态下遮罩是 hidden 的，所以点击路径不会走到 PLAYING 分支，
     *       只有键盘空格会命中它。
     */
    primaryAction: function () {
      Sfx.unlock();
      if (Game.state === STATE.READY)         this.start();
      else if (Game.state === STATE.PLAYING)  this.pause();
      else if (Game.state === STATE.PAUSED)   this.resume();
      else if (Game.state === STATE.GAMEOVER) this.restart();
      else if (Game.state === STATE.LEADERBOARD) return;  // 独立面板态：不误开始
      else if (Game.state === STATE.SOCIAL) return;        // 独立面板态：不误开始
      else if (Game.state === STATE.ACHIEVEMENTS) return;  // 独立面板态：不误开始
      else if (Game.state === STATE.TALENTS) return;       // 独立面板态：不误开始
      else if (Game.state === STATE.DAILY) return;         // 独立面板态：不误开始
    },

    /** 进入独立排行榜面板（暂停游戏逻辑，与 READY 同级） */
    showLeaderboard: function () {
      Game.state = STATE.LEADERBOARD;
      UI.syncOverlay();
    },

    /** 从独立面板返回开始屏 */
    showStart: function () {
      Game.state = STATE.READY;
      UI.syncOverlay();
      this.maybeShowGuide();
    },

    /** 首次进入首页时自动弹出玩法指引（每个 session 只自动弹一次） */
    maybeShowGuide: function () {
      if (UI.guideVisible) return;
      try {
        // 无 sessionStorage（如测试环境）或已关闭本 session，都不再自动弹出
        if (typeof sessionStorage === 'undefined') return;
        if (sessionStorage.getItem('snake-guide-closed') === '1') return;
      } catch (e) { return; }
      UI.showGuide();
    },

    /** H 轮：进入好友榜独立面板 */
    showFriends: function () {
      Game.state = STATE.SOCIAL;
      UI.syncOverlay();
    },

    /** G 轮：进入成就独立面板 */
    showAchievements: function () {
      Game.state = STATE.ACHIEVEMENTS;
      UI.syncOverlay();
    },

    /** J 轮：进入每日榜独立面板 */
    showDaily: function () {
      Game.state = STATE.DAILY;
      UI.syncOverlay();
    },

    /**
     * J 轮：开始一局每日挑战。
     * 固定用闯关模式 + 当日种子（同图）+ 当日修饰，保证当天所有人公平同图。
     */
    startDaily: function () {
      Game.daily = true;
      Game.mode = 'stage';
      Game.stageMode = true;
      Game.dailySeed = Daily.seed();
      Game.dailyMods = Daily.mods();
      Game.reset();
      Game.state = STATE.PLAYING;
      this.gameStart = Date.now();
      this.accumulator = 0;
      this.alpha = 0;
      Fx.clear();
      Sfx.start();
      UI.updateHud();
      UI.syncOverlay();
    },

    start: function () {
      if (Game.state === STATE.READY || Game.state === STATE.GAMEOVER) {
        // G 轮：是否走闯关逻辑（关卡/Boss/毒区）由所选模式决定
        Game.stageMode = (Game.mode === 'stage');
        Game.daily = false;   // J 轮：普通「开始游戏」永远不是每日挑战（每日走 startDaily）
        Game.reset();
      }
      Game.state = STATE.PLAYING;
      this.gameStart = Date.now();
      this.accumulator = 0;
      this.alpha = 0;
      Fx.clear();
      Sfx.start();
      UI.updateHud();
      UI.syncOverlay();
    },

    /**
     * 结束一局时把成绩写入排行榜（默认名 Ply），并记住本局记录用于后续改名。
     * 兼容隐私模式：localStorage 写入失败时静默降级，不抛异常。
     */
    /** 本局已进行的秒数 */
    runDuration: function () {
      return this.gameStart
        ? Math.max(0, Math.floor((Date.now() - this.gameStart) / 1000))
        : 0;
    },

    commitScore: function () {
      const duration = this.runDuration();
      const stored = Leaderboard.add({
        name: 'Ply',
        score: Game.score,
        date: new Date().toISOString(),
        duration: duration,
        mode: Game.mode            // G 轮：区分三种模式的成绩
      });
      Leaderboard.lastRecord = stored;
    },

    pause: function () {
      if (Game.state !== STATE.PLAYING) return;
      if (Game.awaitingUpgrade) return;        // E 轮：选卡期间不允许暂停，否则面板会被顶掉
      Game.state = STATE.PAUSED;
      Sfx.pause(true);
      UI.syncOverlay();
    },

    resume: function () {
      if (Game.state !== STATE.PAUSED) return;
      Game.state = STATE.PLAYING;
      this.accumulator = 0;   // 丢弃暂停期间的时间，避免恢复瞬间连续推进
      Sfx.pause(false);
      UI.syncOverlay();
    },

    restart: function () {
      Game.stageMode = (Game.mode === 'stage');   // G 轮：同上
      Game.reset();
      Game.state = STATE.PLAYING;
      this.gameStart = Date.now();
      this.accumulator = 0;
      this.alpha = 0;
      Fx.clear();
      Sfx.start();
      UI.updateHud();
      UI.syncOverlay();
    },

    /**
     * E 轮：受击（扣 1 点生命但没死）—— 震屏 + 红色粒子 + "-1 ♥" 飘字 + 闷响。
     * 注意：不调用 endGame，游戏继续；蛇身收缩与免伤由 Game.hit 完成。
     */
    onHit: function () {
      const head = Game.snake[0];
      const px = Renderer.cx(head.x);
      const py = Renderer.cy(head.y);
      Fx.shakeScreen();
      Fx.burst(px, py, Renderer.cell, ['#fca5a5', '#ef4444', '#fecaca', '#fee2e2']);
      Fx.floatText(px, py - Renderer.cell * 0.6, '-1 ♥');
      Sfx.hit();
      UI.updateHud();
    },

    /**
     * F 轮：Boss 被击中 / 被击破的反馈（粒子、飘字、音效、震屏）。
     * info 来自 Game._lastBossHit，由主循环在 tick 后消费。
     */
    onBossHit: function (info) {
      const px = Renderer.cx(info.x);
      const py = Renderer.cy(info.y);
      if (info.killed) {
        Fx.burst(px, py, Renderer.cell * 1.6, ['#fca5a5', '#ef4444', '#fb923c', '#fef3c7', '#ffffff']);
        Fx.floatText(px, py - Renderer.cell * 0.8,
          info.left > 0 ? ('分裂！+' + Math.round(Config.BOSS_KILL_SCORE * Game.scoreMul))
                        : ('击破 +' + Math.round(Config.BOSS_KILL_SCORE * Game.scoreMul)));
        Fx.shakeScreen();
        Sfx.bossDown();
      } else {
        Fx.burst(px, py, Renderer.cell, ['#fecaca', '#f87171', '#ffffff']);
        Fx.floatText(px, py - Renderer.cell * 0.6, '-1');
        Sfx.bossHit();
      }
      UI.updateHud();
    },

    /** E 轮：过关后弹出三选一升级卡（选完才继续推进逻辑） */
    openUpgrade: function () {
      if (!Game.pendingUpgrades || !Game.pendingUpgrades.length) return;
      Game.awaitingUpgrade = true;
      this.accumulator = 0;
      Sfx.offer();
      UI.syncOverlay();
    },

    /** E 轮：选完卡后恢复推进 */
    afterUpgrade: function () {
      this.accumulator = 0;
      UI.updateHud();
      UI.syncOverlay();
    },

    /** 结束一局：结算、音效、震屏 */
    endGame: function () {
      Game._runDuration = this.runDuration();   // G 轮：累计统计要用到
      Game.gameOver();
      this.commitScore();
      Fx.shakeScreen();
      // 用完震屏效果后立刻清掉残留飘字/粒子，避免遮罩半透明时被透出来叠加造成"UI 重叠"假象
      setTimeout(function () { Fx.clear(); }, 60);
      Sfx.crash();
      if (Game.isRecord) {
        setTimeout(function () { Sfx.record(); }, 320);
      }
      this.alpha = 1;
      UI.updateHud();
      UI.syncOverlay();
    },

    /**
     * 主循环：requestAnimationFrame + 时间累加器，固定步长推进逻辑，
     * 渲染每帧进行，并用 acc/interval 做插值让移动更顺滑。
     *
     * 节流策略（保持 60fps 体感但省电）：
     *   - PLAYING 态：每帧都渲染（食物呼吸、震屏等需要连续）
     *   - 非 PLAYING 且无任何动画（粒子/飘字/震屏/呼吸/未生效的蛇身插值）：
     *     强制跳到下一个 ≥33ms 的帧再渲染（≈30fps 上限），浏览器 tab 切回时
     *     仍立即补一帧避免黑屏
     *   - 离屏烘焙后的静态层每帧只 drawImage，不重算 gradient
     */
    frame: function (now) {
      let dt = (now - this.lastTime) / 1000;
      this.lastTime = now;
      if (!isFinite(dt) || dt < 0) dt = 0;
      if (dt > 0.25) dt = 0.25;   // 切后台回来后不要一次性补算

      let needRender = true;
      let renderAlpha = this.alpha;

      if (Game.state === STATE.PLAYING) {
        const interval = Game.tickInterval();
        this.accumulator += dt * 1000;

        // 真实时间推进 buff / 特殊食物 TTL / 自动生成（暂停态由 B 轮逻辑跳过，画面冻结）
        Game.updateTimers(dt);
        // G 轮：限时模式时间到 -> 直接结算（这是"完成"而不是死亡）
        if (Game.timeUp && Game.state === STATE.PLAYING) {
          Game.timeUp = false;
          Game.deathReason = 'timeup';
          this.endGame();
        }

        // Boss 蛇本帧撞到玩家 -> E 轮改为受击（扣 1 点生命），扣光才判死
        if (Game.bossHitPlayer && Game.state === STATE.PLAYING) {
          Game.bossHitPlayer = false;
          // E 轮：免伤期间 Boss 撞上来也不扣血 —— 这正是「护盾果」的价值
          if (Game.invincible <= 0) {
            if (Game.hit('boss') === 'dead') this.endGame();
            else this.onHit();
          }
        }

        let steps = 0;
        while (this.accumulator >= interval &&
               steps < Config.MAX_STEPS_PER_FRAME &&
               Game.state === STATE.PLAYING &&
               !Game.awaitingUpgrade) {
          this.accumulator -= interval;
          steps++;

          const prevFood = { x: Game.food.x, y: Game.food.y };
          const result = Game.tick();

          // F 轮：本次 tick 若撞中 Boss 尾巴，先消费打击反馈
          if (Game._lastBossHit) {
            this.onBossHit(Game._lastBossHit);
            Game._lastBossHit = null;
          }

          if (result === 'dead') {
            this.endGame();
            break;
          }

          // E 轮：受击未致死 —— 只播特效，游戏继续
          if (result === 'hit') {
            this.onHit();
            continue;
          }

          if (result === 'stageclear') {
            const px = Renderer.cx(prevFood.x);
            const py = Renderer.cy(prevFood.y);
            Fx.burst(px, py, Renderer.cell, ['#a78bfa', '#c4b5fd', '#8b5cf6', '#ddd6fe']);
            Fx.floatText(px, py - Renderer.cell * 0.5, '第 ' + Game.stage + ' 关');
            Sfx.start();
            UI.updateHud();
            this.openUpgrade();          // E 轮：过关抽卡（有卡则暂停等选）
            continue;
          }

          if (result === 'special') {
            const ls = Game._lastSpecial;
            const px = Renderer.cx(ls.x);
            const py = Renderer.cy(ls.y);
            if (ls.type === 'gold') {
              Fx.burst(px, py, Renderer.cell, ['#fde047', '#fbbf24', '#f59e0b', '#fef3c7']);
              Fx.floatText(px, py - Renderer.cell * 0.5, '⚡加速');
            } else if (ls.type === 'ice') {
              Fx.burst(px, py, Renderer.cell, ['#a5f3fc', '#22d3ee', '#67e8f9', '#ecfeff']);
              Fx.floatText(px, py - Renderer.cell * 0.5, '❄减速');
            } else {
              Fx.burst(px, py, Renderer.cell, ['#fde68a', '#fbbf24', '#fcd34d', '#fffbeb']);
              Fx.floatText(px, py - Renderer.cell * 0.5, '+' + Config.SPECIAL_BONUS_SCORE);
            }
            Sfx.special(ls.type);
            UI.updateHud();
          }

          if (result === 'eat' || result === 'win') {
            const px = Renderer.cx(prevFood.x);
            const py = Renderer.cy(prevFood.y);
            Fx.burst(px, py, Renderer.cell);
            Fx.floatText(px, py - Renderer.cell * 0.5, '+' + Config.SCORE_PER_FOOD);
            Sfx.eat(Game.level);
            UI.updateHud();
          }

          if (result === 'win') {
            Game.gameOver();
            this.commitScore();
            this.alpha = 1;
            Sfx.record();
            UI.updateHud();
            UI.syncOverlay();
            break;
          }
        }

        // 累加器封顶：丢弃本帧消化不掉的时间欠账。
        // 极端低帧率（<4fps）叠加高等级时，单帧最多 4 步消耗不完 clamp 后的 250ms，
        // 剩余时间若不丢弃会无限累积；帧率恢复后会以 4 步/帧 长时间"快进补账"，
        // 而不是与真实时间重新同步。封顶后低帧率下游戏只是略慢，属于正确的优雅降级。
        // 用 intervalNow（而非循环前的 interval）是因为吃食物可能在本帧内升过级。
        const intervalNow = Game.tickInterval();
        const accCap = intervalNow * Config.MAX_STEPS_PER_FRAME;
        if (this.accumulator > accCap) this.accumulator = accCap;

        if (Game.state === STATE.PLAYING) {
          this.alpha = Math.max(0, Math.min(1, this.accumulator / intervalNow));
        }
        renderAlpha = this.alpha;
        UI.updateBuff();
        UI.updateCombo();
        // G 轮：限时模式倒计时每帧都在变，需要跟着刷新 HUD
        if (Game.isTimeAttack()) UI.updateHud();
      } else {
        // 非 PLAYING 态：累加器/alpha 保持不变（暂停时不清，resume 时再清），
        // 这样切到后台再回来时不会因为长时间 dt 累加而触发补算。
        // 节流：没有任何动画时降到 30fps，省 CPU
        renderAlpha = 0;
        const animating =
          Fx.particles.length > 0 ||
          Fx.floaters.length > 0 ||
          Fx.shake > 0 ||
          Game.headPulse > 0;
        if (!animating && this._hasRendered) {
          const sinceLast = now - (this._lastRenderTs || 0);
          if (sinceLast < 33) needRender = false;
        }
        this._hasRendered = true;
      }

      if (needRender) {
        // 暂停/结束/准备态不跑 Fx.update：Fx.time 不累加、headPulse 不衰减、粒子不更新
        // -> 画面完全定格（蛇/食物/粒子冻结），即"暂停特效冻结"
        if (Game.state === STATE.PLAYING) Fx.update(dt);
        Renderer.render(renderAlpha, Fx.time);
        this._lastRenderTs = now;
      }

      requestAnimationFrame(this.boundFrame);
    }
  };

  /* ============================================================
   * 11. 启动
   * ========================================================== */
  function boot() {
    App.init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, false);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
