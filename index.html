      const ttl = ttlMap[type] || Config.SPECIAL_BONUS_TIME;
      this.special = { x: cell.x, y: cell.y, type: type, ttl: ttl, maxTtl: ttl };
      return true;
    },

    /**
     * 生成特殊食物。
     * - 不传 type：从 gold / ice / bonus 中等概率随机选一个（供自动生成）
     * - 传 type：强制生成指定类型（供测试 / 演示）
     * 若场上已有特殊食物则直接返回 null（同一时刻最多一颗），成功返回实际类型。
     */
    spawnSpecial: function (forceType) {
      if (this.special) return null;
      const types = ['gold', 'ice', 'bonus'];
      // E 轮：拿到「护盾果」升级后，护盾果进入刷新池
      if (this.shieldLevel > 0) types.push('shield');
      const type = forceType || types[Math.floor(this.rng() * types.length)];
      return this.placeSpecial(type) ? type : null;
    },

    /* ---- D 轮：关卡 / 障碍 / Boss 蛇 ---- */

    /** 某格是否为障碍物 */
    isObstacle: function (x, y) {
      for (let i = 0; i < this.obstacles.length; i++) {
        if (this.obstacles[i].x === x && this.obstacles[i].y === y) return true;
      }
      return false;
    },

    /** 某格是否被玩家蛇身占据（可排除蛇尾，因为尾巴本 tick 会让位） */
    snakeOccupies: function (x, y, excludeTail) {
      const n = excludeTail ? this.snake.length - 1 : this.snake.length;
      for (let i = 0; i < n; i++) {
        if (this.snake[i].x === x && this.snake[i].y === y) return true;
      }
      return false;
    },

    /** 某格是否被 Boss 蛇身占据（可排除蛇尾） */
    bossOccupies: function (x, y, boss, excludeTail) {
      if (!boss) return false;
      const n = excludeTail ? boss.snake.length - 1 : boss.snake.length;
      for (let i = 0; i < n; i++) {
        if (boss.snake[i].x === x && boss.snake[i].y === y) return true;
      }
      return false;
    },

    /** 往场上追加 count 个障碍物（避开蛇 / 食物 / 特殊食物 / 已有障碍）；棋盘满则提前停止 */
    addObstacles: function (count) {
      for (let k = 0; k < count; k++) {
        const cell = this.randomEmptyCell();
        if (!cell) break;
        this.obstacles.push(cell);
      }
    },

    /** 第 stage 关是否为 Boss 关 */
    isBossStage: function (stage) {
      return stage >= Config.BOSS_FIRST_STAGE &&
             (stage - Config.BOSS_FIRST_STAGE) % Config.BOSS_EVERY === 0;
    },

    /** 第 stage 关是第几个 Boss 关（首个 Boss 关返回 0） */
    bossStageIndex: function (stage) {
      return Math.floor((stage - Config.BOSS_FIRST_STAGE) / Config.BOSS_EVERY);
    },

    /**
     * F 轮：该关的 Boss 形态。
     * - chaser   追猎者：D 轮原行为，一路追食物
     * - splitter 分裂者：更长的蛇，被击破后分裂出若干条 dasher 小蛇
     * - dasher   游猎者：分裂体，平时追击，每隔几秒朝玩家直线冲刺一次
     */
    bossKindFor: function (stage) {
      // 非 Boss 关（例如直接调 spawnBoss 做测试）一律按追猎者处理
      if (!this.isBossStage(stage)) return 'chaser';
      return this.bossStageIndex(stage) === 0 ? 'chaser' : 'splitter';
    },

    /** F 轮：Boss 形态的中文名（横幅与血条用） */
    bossName: function (kind) {
      if (kind === 'chaser') return '追猎者';
      if (kind === 'splitter') return '分裂者';
      return '游猎者';
    },

    /**
     * F 轮：在 (sx,sy) 处沿某个合法方向铺一条 len 节的 Boss 蛇。
     * 四个方向都试一遍，空间不足则返回 null（不生成，不影响通关）。
     */
    spawnBossAt: function (sx, sy, kind, len, hp) {
      const dirs = [DIR.right, DIR.left, DIR.down, DIR.up];
      for (let d = 0; d < dirs.length; d++) {
        const dir = dirs[d];
        const cells = [];
        let ok = true;
        // 必须从远端往回铺：cells[0] 是头，身体要落在头的后方，
        // 否则头一迈步就撞上自己的身体（冲刺型会因此永远起不了步）。
        for (let i = len - 1; i >= 0; i--) {
          const x = sx + dir.x * i;
          const y = sy + dir.y * i;
          if (x < 0 || y < 0 || x >= Config.COLS || y >= Config.ROWS) { ok = false; break; }
          if (this.isObstacle(x, y) || this.snakeOccupies(x, y) ||
              this.bossAt(x, y) || this.inHazard(x, y)) { ok = false; break; }
          cells.push({ x: x, y: y });
        }
        if (!ok) continue;
        const b = {
          snake: cells,
          prevSnake: cells.map(function (s) { return { x: s.x, y: s.y }; }),
          dir: dir,
          acc: 0,
          hp: hp,
          maxHp: hp,
          kind: kind,
          dashTimer: Config.BOSS_DASH_INTERVAL * 0.6,   // 首次冲刺给点缓冲
          dashWarn: 0,
          dashTime: 0,
          dashDir: dir,
          hitFlash: 0
        };
        this.bosses.push(b);
        return b;
      }
      return null;
    },

    /**
     * 生成 Boss 蛇：从四个角落候选锚点里挑一个不与蛇/障碍重叠的，
     * 沿边横向铺开。实在没有空位则降级为不生成（不影响通关）。
     */
    spawnBoss: function () {
      const kind = this.bossKindFor(this.stage);
      const idx = this.bossStageIndex(this.stage);
      const hp = Config.BOSS_HP_BASE + Math.max(0, idx) * Config.BOSS_HP_STEP;
      const len = (kind === 'splitter') ? Config.BOSS_LEN + 1 : Config.BOSS_LEN;
      const cand = [
        { x: 1, y: 1, dir: DIR.right },
        { x: Config.COLS - 2, y: 1, dir: DIR.left },
        { x: 1, y: Config.ROWS - 2, dir: DIR.right },
        { x: Config.COLS - 2, y: Config.ROWS - 2, dir: DIR.left }
      ];
      for (let c = 0; c < cand.length; c++) {
        const a = cand[c];
        // 锚点方向优先：spawnBossAt 内部按 right/left/down/up 试，
        // 这里把锚点方向放在首位重试一次，保证贴边铺开
        const b = this.spawnBossAt(a.x, a.y, kind, len, hp);
        if (b) return b;
      }
      return null;
    },

    /** F 轮：某格是否被某条 Boss 占据，返回 {boss, idx, isTail} 或 null */
    bossAt: function (x, y) {
      for (let k = 0; k < this.bosses.length; k++) {
        const b = this.bosses[k];
        for (let i = 0; i < b.snake.length; i++) {
          if (b.snake[i].x === x && b.snake[i].y === y) {
            return { boss: b, idx: i, isTail: i === b.snake.length - 1 };
          }
        }
      }
      return null;
    },

    /**
     * F 轮：玩家撞中 Boss 尾巴 —— Boss 扣 1 点血，玩家安全通过。
     * 血量归零：分裂者会炸成若干条小蛇，其余直接消失；击破给分。
     */
    damageBoss: function (b, x, y) {
      b.hp--;
      b.hitFlash = Config.BOSS_HIT_FLASH;
      const killed = b.hp <= 0;
      let left = this.bosses.length;
      if (killed) {
        this.runBossKills++;                     // G 轮：统计与成就
        if (b.kind === 'splitter') this._killedSplitter = true;
        // 先移除本体再分裂：否则 spawnBossAt 会把本体的身体当成障碍物，
        // 导致分裂体一处都放不下（本体已死，它占的格子本该立刻释放）
        this.removeBoss(b);
        if (b.kind === 'splitter') this.splitBoss(b);
        left = this.bosses.length;
        this.addScore(Math.round(Config.BOSS_KILL_SCORE * this.scoreMul));
      }
      this._lastBossHit = { x: x, y: y, kind: b.kind, killed: killed, left: left };
      return b.hp;
    },

    /** F 轮：分裂者被击破 —— 沿尸体均分的位置炸出若干条会冲刺的小蛇 */
    splitBoss: function (b) {
      const n = Config.BOSS_SPLIT_COUNT;
      for (let i = 0; i < n; i++) {
        const at = Math.floor((i + 1) * b.snake.length / (n + 1));
        const seed = b.snake[at] || b.snake[0];
        this.spawnBossAt(seed.x, seed.y, 'dasher', Config.BOSS_SPLIT_LEN, Config.BOSS_SPLIT_HP);
      }
    },

    /** F 轮：移除一条 Boss（数组里做 splice） */
    removeBoss: function (b) {
      const i = this.bosses.indexOf(b);
      if (i >= 0) this.bosses.splice(i, 1);
    },

    /* ---- F 轮：毒区地形 ---- */

    /** 某格是否落在毒区内 */
    inHazard: function (x, y) {
      for (let i = 0; i < this.hazards.length; i++) {
        const h = this.hazards[i];
        if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) return true;
      }
      return false;
    },

    /**
     * 毒区覆盖的所有格子是否与蛇 / Boss / 食物 / 已有毒区冲突。
     * 注意必须逐格检查整片区域：毒区是 2×2，左上角不冲突不代表整片不冲突
     * （食物落在右下角时同样会把玩家逼进毒区）。
     */
    _hazardBlocked: function (x, y, w, h) {
      for (let a = x; a < x + w; a++) {
        for (let b = y; b < y + h; b++) {
          if (this.food.x === a && this.food.y === b) return true;
          if (this.snakeOccupies(a, b) || this.bossAt(a, b) || this.inHazard(a, b)) return true;
        }
      }
      return false;
    },

    /**
     * Boss 关生成毒区：整片区域必须干净。
     * 随机落点被占用就换个落点重试（最多 12 次），否则棋盘上障碍一多就会少生成毒区，
     * 关卡难度会随运气浮动。
     */
    spawnHazards: function (count) {
      const s = Config.HAZARD_SIZE;
      for (let k = 0; k < count; k++) {
        for (let attempt = 0; attempt < 12; attempt++) {
          const cell = this.randomEmptyCell();
          if (!cell) break;
          const x = Math.max(0, Math.min(cell.x, Config.COLS - s));
          const y = Math.max(0, Math.min(cell.y, Config.ROWS - s));
          if (this._hazardBlocked(x, y, s, s)) continue;
          this.hazards.push({ x: x, y: y, w: s, h: s, timer: Config.HAZARD_DRIFT });
          break;
        }
      }
    },

    /**
     * 毒区漂移：每隔 HAZARD_DRIFT 秒朝随机方向挪 1 格。
     * 永远不会主动压到玩家蛇身 / Boss / 食物 —— 毒区是压缩走位的地形，不是必死陷阱。
     */
    updateHazards: function (dt) {
      for (let i = 0; i < this.hazards.length; i++) {
        const h = this.hazards[i];
        h.timer -= dt;
        if (h.timer > 0) continue;
        h.timer = Config.HAZARD_DRIFT;
        const dirs = [DIR.up, DIR.down, DIR.left, DIR.right];
        const d = dirs[Math.floor(Math.random() * dirs.length)];
        const nx = h.x + d.x, ny = h.y + d.y;
        if (nx < 0 || ny < 0 || nx + h.w > Config.COLS || ny + h.h > Config.ROWS) continue;
        if (this._hazardBlocked(nx, ny, h.w, h.h)) continue;
        if (this.food.x >= nx && this.food.x < nx + h.w &&
            this.food.y >= ny && this.food.y < ny + h.h) continue;
        h.x = nx; h.y = ny;
      }
    },

    /** 过关：进入下一关，累加障碍，按需生成 Boss，刷新横幅 */
    advanceStage: function () {
      this.stage++;
      this.stageFoods = 0;
      this.stageTarget = Config.STAGE_BASE_TARGET + (this.stage - 1) * Config.STAGE_TARGET_STEP;
      this.level++;   // 过关升一级（速度随之变快，见 tps()）
      // 每升一关新增障碍（第 1 关无障碍，第 2 关起出现，关卡越后越难）
      // J 轮：每日修饰「荆棘日」会让每关额外多刷障碍
      this.addObstacles(Config.OBSTACLE_STEP + (this.dailyObsBonus || 0));
      // 清掉场上特殊食物，避免新布局把它卡在死角
      this.special = null;
      this.speedBuffAdd = 0;
      this.speedBuffTime = 0;
      // 升级增长蛇长：在尾部沿当前方向延伸
      this.growSnake(Config.GROW_PER_STAGE);
      // F 轮：Boss 关重新生成 Boss 与毒区，非 Boss 关清空
      this.bosses = [];
      this.hazards = [];
      if (this.isBossStage(this.stage)) {
        this.spawnBoss();
        // J 轮：每日修饰「毒雾日」会让 Boss 关毒区数量翻倍
        this.spawnHazards(Config.HAZARD_COUNT * (this.dailyHazardMul || 1));
      }
      // 关卡横幅
      this.stageBannerText = '第 ' + this.stage + ' 关';
      this.stageBannerTime = 2.0;
      // E 轮：过关抽三张升级卡（由主循环弹出，玩家选完才继续推进）
      this.pendingUpgrades = this.rollUpgrades();
    },

    /** 在尾部沿合法方向延伸 n 节（升级增长蛇长用；吃食物本身等长，不增长）。
     *  优先沿尾巴前进方向，越界或与蛇身/障碍重叠时改试其余三向，保证不越界、不脱节。 */
    growSnake: function (n) {
      const self = this;
      const blocked = function (x, y) {
        if (x < 0 || y < 0 || x >= Config.COLS || y >= Config.ROWS) return true;
        if (self.obstacles) {
          for (let i = 0; i < self.obstacles.length; i++) {
            if (self.obstacles[i].x === x && self.obstacles[i].y === y) return true;
          }
        }
        for (let i = 0; i < self.snake.length; i++) {
          if (self.snake[i].x === x && self.snake[i].y === y) return true;
        }
        return false;
      };
      for (let k = 0; k < n; k++) {
        const tail = this.snake[this.snake.length - 1];
        const prev = this.snake[this.snake.length - 2] || { x: tail.x - 1, y: tail.y };
        const fwd = { x: tail.x - prev.x, y: tail.y - prev.y };
        // 候选方向：优先沿尾巴前进方向，其次其余三向（跳过回头，避免与 prev 重叠）
        const cands = [fwd, { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
        let placed = false;
        for (let c = 0; c < cands.length; c++) {
          const d = cands[c];
          if (d.x === -fwd.x && d.y === -fwd.y) continue;   // 回头会与 prev 重叠
          const tx = tail.x + d.x, ty = tail.y + d.y;
          if (blocked(tx, ty)) continue;
          this.snake.push({ x: tx, y: ty });
          placed = true;
          break;
        }
        if (!placed) {
          // 极端拥挤兜底：强行接到尾部前进方向（保证不死循环，极少数情况可能重叠）
          this.snake.push({ x: tail.x + fwd.x, y: tail.y + fwd.y });
        }
      }
    },

    /**
     * F 轮：用真实时间推进全部 Boss（暂停时不调用，随画面冻结）。
     * 每条 Boss 有独立累加器，冲刺期间速度按 BOSS_DASH_MUL 放大。
     */
    updateBoss: function (dt) {
      const list = this.bosses;
      for (let k = 0; k < list.length; k++) {
        const b = list[k];
        if (b.hitFlash > 0) b.hitFlash = Math.max(0, b.hitFlash - dt);

        // 冲刺型的状态机：待机 -> 预警（锁定方向、身体发亮）-> 冲刺 -> 待机
        if (b.kind === 'dasher') {
          if (b.dashTime > 0) {
            b.dashTime -= dt;
          } else if (b.dashWarn > 0) {
            b.dashWarn -= dt;
            if (b.dashWarn <= 0) {
              b.dashTime = Config.BOSS_DASH_TIME;
              b.dir = b.dashDir;
            }
          } else {
            b.dashTimer -= dt;
            if (b.dashTimer <= 0) {
              b.dashWarn = Config.BOSS_DASH_WARN;
              b.dashDir = this.towardPlayer(b);
              b.dashTimer = Config.BOSS_DASH_INTERVAL + Config.BOSS_DASH_WARN + Config.BOSS_DASH_TIME;
            }
          }
        }

        const mul = (b.dashTime > 0) ? Config.BOSS_DASH_MUL : 1;
        b.acc += dt * 1000 * mul;
        const interval = 1000 / Config.BOSS_SPEED_TPS;
        let guard = 0;
        while (b.acc >= interval && guard < 8) {
          b.acc -= interval;
          guard++;
          this.stepBoss(b);
          if (this.bossHitPlayer) break;
        }
      }
    },

    /** F 轮：冲刺方向 —— 朝玩家蛇头的主轴方向（四选一，保证走直线） */
    towardPlayer: function (b) {
      const head = b.snake[0];
      const t = this.snake[0];
      const dx = t.x - head.x, dy = t.y - head.y;
      if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? DIR.right : DIR.left;
      return dy >= 0 ? DIR.down : DIR.up;
    },

    /** Boss 蛇走一步：冲刺中走直线，否则按形态追击 */
    stepBoss: function (b) {
      if (!b) return;
      if (b.dashTime > 0) return this.stepBossDash(b);
      return this.stepBossSeek(b);
    },

    /** 冲刺中：沿锁定方向直线冲；撞墙/障碍/自己身体则提前结束冲刺并转回追击 */
    stepBossDash: function (b) {
      const head = b.snake[0];
      const nx = head.x + b.dir.x, ny = head.y + b.dir.y;
      if (nx < 0 || ny < 0 || nx >= Config.COLS || ny >= Config.ROWS) { b.dashTime = 0; return this.stepBossSeek(b); }
      if (this.isObstacle(nx, ny) || this.bossOccupies(nx, ny, b, true)) {
        b.dashTime = 0;
        return this.stepBossSeek(b);
      }
      this.advanceBossHead(b, nx, ny);
    },

    /** 追击：朝食物（无食物则朝玩家头）移动，避开墙/障碍/双方身体 */
    stepBossSeek: function (b) {
      const target = (this.food.x >= 0) ? this.food : this.snake[0];
      const head = b.snake[0];
      const dirs = [DIR.up, DIR.down, DIR.left, DIR.right];
      let best = null, bestScore = Infinity;
      for (let i = 0; i < dirs.length; i++) {
        const d = dirs[i];
        const nx = head.x + d.x, ny = head.y + d.y;
        if (nx < 0 || ny < 0 || nx >= Config.COLS || ny >= Config.ROWS) continue;
        if (this.isObstacle(nx, ny)) continue;
        if (this.bossOccupies(nx, ny, b, true)) continue;   // 允许跟在尾巴后（不咬自己）
        // 注意：Boss 不躲避玩家蛇身，才会主动追击并撞上玩家 -> 形成真实威胁
        const dist = Math.abs(nx - target.x) + Math.abs(ny - target.y);
        const score = dist + (d === b.dir ? -0.5 : 0);       // 偏好保持方向更顺滑
        if (score < bestScore) { bestScore = score; best = d; }
      }
      if (!best) return;                                     // 四面楚歌，原地不动
      b.dir = best;
      this.advanceBossHead(b, head.x + best.x, head.y + best.y);
    },

    /** 把 Boss 头推进到 (nx,ny)：记录插值用的 prevSnake、收缩尾巴、检测是否撞到玩家 */
    advanceBossHead: function (b, nx, ny) {
      b.prevSnake = b.snake.map(function (s) { return { x: s.x, y: s.y }; });
      b.snake.unshift({ x: nx, y: ny });
      b.snake.pop();
      // 撞到玩家：Boss 头与玩家任意一节重合 -> 玩家受击（E 轮：扣 1 点生命）
      for (let i = 0; i < this.snake.length; i++) {
        if (this.snake[i].x === nx && this.snake[i].y === ny) { this.bossHitPlayer = true; break; }
      }
    },

    /** 吃到特殊食物后的效果（不在此处做渲染/音效，交给主循环） */
    applySpecial: function (sp) {
      if (sp.type === 'gold') {
        this.speedBuffAdd = Config.SPECIAL_GOLD_ADD;
        this.speedBuffTime = Config.SPECIAL_GOLD_TIME;
      } else if (sp.type === 'ice') {
        this.speedBuffAdd = -Config.SPECIAL_ICE_ADD;
        this.speedBuffTime = Config.SPECIAL_ICE_TIME;
      } else if (sp.type === 'bonus') {
        this.addScore(Math.round(Config.SPECIAL_BONUS_SCORE * this.scoreMul));
        this._gotBonus = true;              // G 轮：成就「幸运儿」
      } else if (sp.type === 'shield') {
        this.invincible = Config.SHIELD_TIME;
      }
    },

    /** 加分（速度等级 level 改由「过关」驱动，见 advanceStage，不再随 score 变化） */
    addScore: function (n) {
      this.score += n;
    },

    /**
     * 用真实经过的秒数推进「时间类」状态（仅 PLAYING 态由主循环调用，
     * 暂停时不动 -> buff / 特殊食物随画面一起冻结）。
     * 同时按间隔尝试自动生成特殊食物（同一时刻最多一颗）。
     */
    updateTimers: function (dt) {
      if (this.speedBuffTime > 0) {
        this.speedBuffTime -= dt;
        if (this.speedBuffTime <= 0) {
          this.speedBuffTime = 0;
          this.speedBuffAdd = 0;
        }
      }
      // E 轮：免伤时间（受击无敌 / 护盾果）
      if (this.invincible > 0) {
        this.invincible -= dt;
        if (this.invincible < 0) this.invincible = 0;
      }
      // E 轮：连击窗口（超时未再进食则清零）
      if (this.comboTimer > 0) {
        this.comboTimer -= dt;
        if (this.comboTimer <= 0) {
          this.comboTimer = 0;
          this.combo = 0;
        }
      }
      if (this.special) {
        this.special.ttl -= dt;
        if (this.special.ttl <= 0) this.special = null;
      }
      if (this.stageBannerTime > 0) this.stageBannerTime -= dt;
      // G 轮：限时模式倒计时（时间到由主循环结算，不算死亡）
      if (this.mode === 'timeattack' && this.state === STATE.PLAYING) {
        this.timeLeft -= dt;
        if (this.timeLeft <= 0) {
          this.timeLeft = 0;
          this.timeUp = true;
        }
      }
      // G 轮：成就提示停留计时（暂停时同样冻结）
      if (this.achToast) {
        this.achToast.time -= dt;
        if (this.achToast.time <= 0) this.achToast = null;
      }
      // F 轮：Boss 与毒区各自按真实时间推进（PLAYING 之外不调用，暂停时随画面冻结）
      if (this.state === STATE.PLAYING) {
        if (this.bosses.length) this.updateBoss(dt);
        if (this.hazards.length) this.updateHazards(dt);
      }
      if (this.state === STATE.PLAYING) {
        this.specialSpawnTimer += dt * 1000;
        if (this.specialSpawnTimer >= this.specialInterval && !this.special) {
          this.specialSpawnTimer = 0;
          this.spawnSpecial();
        }
      }
    },

    /** G 轮：切换玩法模式（开始屏选择）；非法值一律兜底为闯关 */
    setMode: function (mode) {
      for (let i = 0; i < MODES.length; i++) {
        if (MODES[i].id === mode) { this.mode = mode; return this.mode; }
      }
      this.mode = 'stage';
      return this.mode;
    },

    /**
     * G 轮：无尽 / 限时模式是否该因吃食物变长。
     * 判据用 mode 而不是 stageMode：stageMode 只在走 App.start/restart 时才被同步，
     * 直接调 reset() 的场合它保持 false，会误判成「非闯关」而让蛇白白变长。
     */
    shouldGrow: function () {
      if (this.mode === 'stage') return false;
      return (this.foodEaten % Config.GROW_EVERY) === 0;
    },

    /** G 轮：限时模式剩余秒数（非限时返回 0） */
    isTimeAttack: function () { return this.mode === 'timeattack'; },

    /**
     * G 轮：检查并解锁成就。
     * 只依赖「本局 + 累计统计数据」，所以在得分变化、击破、结算等节点都能安全调用。
     */
    checkAchievements: function () {
      const got = [];
      const tryUnlock = function (id) { if (Achievements.unlock(id)) got.push(id); };

      if (this.score >= 100)  tryUnlock('score100');
      if (this.score >= 500)  tryUnlock('score500');
      if (this.score >= 1000) tryUnlock('score1000');
      if (this.comboBest >= 5)  tryUnlock('combo5');
      if (this.comboBest >= 15) tryUnlock('combo15');
      if (this.runBossKills >= 1) tryUnlock('boss1');
      if (this._killedSplitter)  tryUnlock('bossSplit');
      if (this.win && this.stageMode) tryUnlock('clear');
      if (this._gotBonus) tryUnlock('lucky');
      if (this.tps() >= Config.MAX_TPS) tryUnlock('speed');
      if (this.snake.length >= 20) tryUnlock('long');
      // 「完成第一局」依赖累计数据，必须在 Stats.merge 之后才成立
      if (Stats.data && Stats.data.games >= 1) tryUnlock('first');

      for (let i = 0; i < got.length; i++) this.showAchievement(got[i]);
      return got;
    },

    /** G 轮：弹出成就提示（同一时刻只展示最新一个） */
    showAchievement: function (id) {
      const a = Achievements.find(id);
      if (!a) return;
      this.achToast = { name: a.name, desc: a.desc, time: Config.ACH_TOAST_TIME, max: Config.ACH_TOAST_TIME };
      Sfx.achievement();
    },

    /** E 轮：当前连击倍率——第 N 连 = 1 + (N-1) × COMBO_STEP，封顶 COMBO_MAX_MUL */
    comboMultiplier: function () {
      if (this.combo <= 1) return 1;
      return Math.min(Config.COMBO_MAX_MUL, 1 + (this.combo - 1) * Config.COMBO_STEP);
    },

    /** E 轮：吃到普通食物——推进连击、按倍率加分，返回本次实际得分 */
    gainFoodScore: function () {
      this.combo++;
      if (this.combo > this.comboBest) this.comboBest = this.combo;
      this.comboTimer = this.comboWindow;
      const gain = Math.round(Config.SCORE_PER_FOOD * this.comboMultiplier() * this.scoreMul);
      this.addScore(gain);
      this._lastGain = gain;

      // G 轮：无尽模式速度随分数提升，每升 UPGRADE_EVERY_LEVEL 级弹一次升级卡
      // （闯关模式的 level 由 advanceStage 递增，这里不碰）
      if (this.mode === 'endless') {
        const lv = Math.floor(this.score / Config.SCORE_PER_LEVEL);
        if (lv > this.level) {
          this.level = lv;
          if (lv % Config.UPGRADE_EVERY_LEVEL === 0) this.pendingUpgrades = this.rollUpgrades();
        }
      }
      return gain;
    },

    /**
     * E 轮：受击——扣 1 点生命而不是直接结束。
     * - 还有命：进入 1.2s 免伤 + 蛇身收缩（喘息空间），返回 'hit'
     * - 没命了：返回 'dead'（由主循环走 endGame）
     */
    hit: function (reason) {
      this.deathReason = reason;
      this.combo = 0;
      this.comboTimer = 0;
      this.lives--;
      if (this.lives <= 0) {
        this.lives = 0;
        return 'dead';
      }
      this.invincible = Config.HIT_INVINCIBLE;
      const target = Math.max(Config.START_LEN, this.snake.length - Config.HIT_SHRINK);
      while (this.snake.length > target) this.snake.pop();
      this.prevSnake = this.snake.map(function (s) { return { x: s.x, y: s.y }; });
      return 'hit';
    },

    /** E 轮：抽三张升级卡（排除已满级 / 当前不可用的） */
    rollUpgrades: function () {
      const pool = [];
      for (let i = 0; i < UPGRADES.length; i++) {
        const u = UPGRADES[i];
        const lv = this.upgradeLevels[u.id] || 0;
        if (lv >= u.max) continue;
        if (u.available && !u.available(this)) continue;
        pool.push(u);
      }
      for (let i = pool.length - 1; i > 0; i--) {      // Fisher-Yates 洗牌
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      return pool.slice(0, 3);
    },

    /** E 轮：选中一张升级卡——生效、记等级、关闭选卡面板 */
    applyUpgrade: function (id) {
      let card = null;
      if (this.pendingUpgrades) {
        for (let i = 0; i < this.pendingUpgrades.length; i++) {
          if (this.pendingUpgrades[i].id === id) { card = this.pendingUpgrades[i]; break; }
        }
      }
      if (!card) return false;
      card.apply(this);
      this.upgradeLevels[id] = (this.upgradeLevels[id] || 0) + 1;
      this.pendingUpgrades = null;
      this.awaitingUpgrade = false;
      return true;
    },

    /**
     * 推进一个逻辑步。
     * @returns {'move'|'eat'|'special'|'stageclear'|'hit'|'dead'|'win'}
     */
    tick: function () {
      const dir = this.consumeDirection();
      const head = this.snake[0];
      let nx = head.x + dir.x;
      let ny = head.y + dir.y;

      // 免伤期间（受击无敌 / 护盾果）：撞上任何东西都停在原地、不扣血 —— 相当于一次短促的受击硬直。
      // 之所以不「环绕」也不「穿透」：环绕会让蛇头与第二节相隔整张棋盘，折线渲染会画出一条
      // 贯穿全屏的断线；穿透身体则会产生重叠格（蛇身画出来会打结）。宁可停这 1.2 秒。
      const harmless = this.invincible > 0;

      if (nx < 0 || ny < 0 || nx >= Config.COLS || ny >= Config.ROWS) {
        return harmless ? 'blocked' : this.hit('wall');
      }
      if (this.isObstacle(nx, ny)) {
        return harmless ? 'blocked' : this.hit('obstacle');
      }
      // F 轮：毒区地形 —— 踩进去受击（毒区永远不主动压到玩家，是走位压力不是必死陷阱）
      if (this.inHazard(nx, ny)) {
        return harmless ? 'blocked' : this.hit('hazard');
      }
      // F 轮：撞 Boss —— 撞中尾节是「攻击」（Boss 扣血、玩家安全通过），撞身体才受伤
      const bHit = this.bossAt(nx, ny);
      if (bHit) {
        if (bHit.isTail) this.damageBoss(bHit.boss, nx, ny);
        else return harmless ? 'blocked' : this.hit('boss');
      }
      // 撞自己：移动是等长的（尾巴会让出当前格），因此最后一节不计入碰撞
      const limit = this.snake.length - 1;
      for (let i = 0; i < limit; i++) {
        if (this.snake[i].x === nx && this.snake[i].y === ny) {
          return harmless ? 'blocked' : this.hit('self');
        }
      }

      // 保存旧蛇身用于渲染插值
      this.prevSnake = this.snake.map(function (s) { return { x: s.x, y: s.y }; });
      this.snake.unshift({ x: nx, y: ny });

      // 吃普通食物：加分 + 推进关卡，但蛇身不变长（等长移动）
      if (this.food.x === nx && this.food.y === ny) {
        this.gainFoodScore();
        this.headPulse = 1;
        this.foodEaten++;
        this.runFoods++;
        this.stageFoods++;
        // 关卡推进（仅闯关模式）：吃满目标食物即过关
        if (this.stageMode && this.stageFoods >= this.stageTarget) {
          if (this.stage >= Config.TOTAL_STAGES) {
            this.win = true;                 // 清空最后一关 = 通关
            this.snake.pop();                // 等长移动（不再增长）
            return 'win';
          }
          this.advanceStage();               // 过关：升一级 + 蛇身增长
          this.snake.pop();                  // 吃食物本身等长，增长交由 advanceStage 负责
          const placed = this.placeFood();
          if (!placed) { this.win = true; return 'win'; }
          return 'stageclear';
        }
        const placed = this.placeFood();
        if (!placed) {
          this.win = true;
          return 'win';
        }
        // G 轮：无尽 / 限时吃到就变长；闯关模式变长交给过关，这里仍是等长移动
        if (this.shouldGrow()) return 'eat';
        this.snake.pop();
        return 'eat';
      }

      // 吃到特殊食物：不增长蛇身，但触发对应效果（金蛇果加速 / 冰冻果减速 / 限时奖励加分）
      if (this.special && this.special.x === nx && this.special.y === ny) {
        const sp = this.special;
        this.special = null;
        this._lastSpecial = { type: sp.type, x: nx, y: ny };
        this.applySpecial(sp);
        this.snake.pop();
        return 'special';
      }

      this.snake.pop();
      return 'move';
    },

    /** 结束本局并结算最高分 */
    gameOver: function () {
      this.state = STATE.GAMEOVER;
      // 清掉场上特殊食物与速度 buff，避免结束/重开界面残留加速状态
      this.special = null;
      this.speedBuffAdd = 0;
      this.speedBuffTime = 0;
      this.specialSpawnTimer = 0;
      this.bossHitPlayer = false;
      this._lastBossHit = null;
      this.invincible = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.pendingUpgrades = null;
      // G 轮：成就先按本局数据结算一次，合并统计后再结算一次
      // （「完成第一局」依赖累计的 Stats.data.games）
      this.checkAchievements();
      Stats.merge({
        win: this.win,
        score: this.score,
        foods: this.runFoods,
        duration: this._runDuration,
        bestCombo: this.comboBest,
        bossKills: this.runBossKills
      });
      this.checkAchievements();

      if (this.score > this.best) {
        this.best = this.score;
        this.isRecord = true;
        Storage.set(Config.STORAGE_BEST, this.best);
      } else {
        this.isRecord = false;
      }

      // I 轮：本局结算星屑（跨局货币），累加进 Meta 持久化
      this._lastEarned = Meta.earnedFor(this);
      // J 轮：每日挑战 —— 记入今日榜并更新连续打卡，连续打卡给星屑加成
      if (this.daily) {
        this._dailyResult = Daily.record({
          name: 'Ply',
          score: this.score,
          duration: this._runDuration,
          mode: 'daily'
        });
        this._lastEarned = Math.round(this._lastEarned * (1 + this._dailyResult.streak.bonusPct));
      }
      Meta.addStardust(this._lastEarned);
    },

    /** H 轮：把本局关键成绩打包成分享码用的 runData（m 为模式索引：stage=0/endless=1/timeattack=2） */
    buildShareRun: function () {
      let m = 0;
      for (let i = 0; i < MODES.length; i++) {
        if (MODES[i].id === this.mode) { m = i; break; }
      }
      return {
        v: Config.SHARE_VERSION,
        m: m,
        s: this.score,
        l: this.snake.length,
        t: Math.floor(this._runDuration || 0),
        b: this.runBossKills,
        c: this.comboBest,
        a: Achievements.count()
      };
    }
  };

  /* ============================================================
   * 6. 视觉特效（粒子 / 飘字 / 震屏），仅影响表现层
   * ========================================================== */
  const Fx = {
    particles: [],
    floaters: [],
    shake: 0,
    time: 0,

    update: function (dt) {
      this.time += dt;

      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.life -= dt;
        if (p.life <= 0) { this.particles.splice(i, 1); continue; }
        p.vy += 380 * dt;          // 重力
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= (1 - 1.6 * dt);    // 空气阻力
      }

      for (let i = this.floaters.length - 1; i >= 0; i--) {
        const f = this.floaters[i];
        f.life -= dt;
        if (f.life <= 0) { this.floaters.splice(i, 1); continue; }
        f.y -= 26 * dt;
      }

      if (this.shake > 0) {
        this.shake = Math.max(0, this.shake - dt * 2.2);
      }
      if (Game.headPulse > 0) {
        Game.headPulse = Math.max(0, Game.headPulse - dt * 3.2);
      }
    },

    burst: function (px, py, cell, colors) {
      const palette = colors || ['#f87171', '#fb923c', '#fde047', '#fca5a5'];
      const count = 14;
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const sp = cell * (2.2 + Math.random() * 3.2);
        this.particles.push({
          x: px, y: py,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - cell * 1.4,
          r: cell * (0.06 + Math.random() * 0.09),
          life: 0.4 + Math.random() * 0.35,
          maxLife: 0.75,
          color: palette[i % palette.length]
        });
      }
    },

    floatText: function (px, py, text) {
      this.floaters.push({ x: px, y: py, text: text, life: 0.85, maxLife: 0.85 });
    },

    shakeScreen: function () { this.shake = 1; },

    clear: function () {
      this.particles.length = 0;
      this.floaters.length = 0;
      this.shake = 0;
    }
  };

  /* ============================================================
   * 7. 渲染器（只负责画，不修改游戏状态）
   *    性能要点：背景/网格/墙烘焙到离屏 canvas（只在 resize 时重画），
   *             每帧只 drawImage 复用，省掉 createRadialGradient 与
   *             24x2 网格线 stroke 的开销。
   * ========================================================== */
  const Renderer = {
    canvas: null,
    ctx: null,
    size: 360,
    cell: 15,
    dpr: 1,
    bgCanvas: null,           // 离屏烘焙：背景 + 网格 + 墙
    bgCanvasCtx: null,
    bgValid: false,           // false 时需要重画（resize / 切背景色时清）
    pulseTime: 0,             // 上次记录的脉冲时间，用于脉冲未变时跳帧

    init: function (canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.resize();
    },

    /** 画布保持正方形并自适应窗口，按 devicePixelRatio 提升清晰度 */
    resize: function () {
      const stage = document.getElementById('stage');
      const rect = stage.getBoundingClientRect();
      // 减去内边距，留出安全边距
      const avail = Math.min(rect.width, rect.height) - 22;
      const size = Math.max(200, Math.floor(avail));

      this.size = size;
      this.cell = size / Config.COLS;
      this.dpr = Math.min(window.devicePixelRatio || 1, 2);

      this.canvas.style.width = size + 'px';
      this.canvas.style.height = size + 'px';
      this.canvas.width = Math.floor(size * this.dpr);
      this.canvas.height = Math.floor(size * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

      this.invalidateBg();
    },

    /** 标记背景离屏画布失效（resize 后调用，下次 render 时重画） */
    invalidateBg: function () {
      this.bgValid = false;
    },

    /** 一次性把背景/网格/墙画到离屏 canvas（窗口大小变化才重画） */
    bakeBackground: function () {
      const size = this.size;
      if (!this.bgCanvas) {
        this.bgCanvas = document.createElement('canvas');
        this.bgCanvasCtx = this.bgCanvas.getContext('2d');
      }
      this.bgCanvas.width = Math.floor(size * this.dpr);
      this.bgCanvas.height = Math.floor(size * this.dpr);
      const bctx = this.bgCanvasCtx;
      bctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

      this._drawBackgroundOnto(bctx, size);
      this._drawGridOnto(bctx, size);
      this._drawWallOnto(bctx, size);

      this.bgValid = true;
    },

    /** 格子坐标 -> 画布像素（格子中心） */
    cx: function (gx) { return (gx + 0.5) * this.cell; },
    cy: function (gy) { return (gy + 0.5) * this.cell; },

    /**
     * 主绘制入口
     * @param {number} alpha tick 之间的插值系数 [0,1]
     * @param {number} time 用于脉动等纯时间动画
     */
    render: function (alpha, time) {
      const ctx = this.ctx;
      const size = this.size;

      // 首次/失效时烘焙背景
      if (!this.bgValid) this.bakeBackground();

      ctx.save();
      ctx.clearRect(0, 0, size, size);

      // 撞击震屏
      if (Fx.shake > 0) {
        const amp = Fx.shake * this.cell * 0.42;
        ctx.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
      }

      // 静态层：drawImage 复用离屏烘焙（最贵的 radialGradient + 网格线 + 墙阴影只画一次）
      ctx.drawImage(this.bgCanvas, 0, 0, size, size);

      this.drawObstacles();
      this.drawHazards();        // F 轮：毒区（压在食物下方，不遮挡可拾取物）
      this.drawFood();
      this.drawSpecial();
      this.drawSnake(alpha);
      this.drawBoss(alpha);
      this.drawParticles();
      this.drawFloaters();
      this.drawBanner();

      ctx.restore();

      // F 轮：Boss 血条画在 restore 之后 —— 不跟随撞击震屏一起抖
      this.drawBossHealth();
      // G 轮：成就提示同样画在 restore 之后
      this.drawAchievement();
    },

    /** 静态底色 + 中心柔光（仅在离屏烘焙时调用） */
    _drawBackgroundOnto: function (ctx, size) {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(-size, -size, size * 3, size * 3);

      const g = ctx.createRadialGradient(size * 0.5, size * 0.42, size * 0.05,
                                         size * 0.5, size * 0.5, size * 0.78);
      g.addColorStop(0, 'rgba(56,189,248,0.10)');
      g.addColorStop(1, 'rgba(11,18,32,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    },

    /** 网格线：细线 + 每 4 格的粗线（仅在离屏烘焙时调用） */
    _drawGridOnto: function (ctx, size) {
      const cell = this.cell;
      ctx.lineWidth = 1;
      for (let i = 1; i < Config.COLS; i++) {
        const p = Math.round(i * cell) + 0.5;
        ctx.strokeStyle = (i % 4 === 0) ? 'rgba(148,163,184,0.10)' : 'rgba(148,163,184,0.045)';
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(0 + size, p); ctx.stroke();
      }
    },

    /** 墙壁：内发光描边（仅在离屏烘焙时调用） */
    _drawWallOnto: function (ctx, size) {
      const inset = 2;

      ctx.save();
      ctx.strokeStyle = 'rgba(56,189,248,0.55)';
      ctx.lineWidth = 3;
      ctx.shadowColor = 'rgba(56,189,248,0.55)';
      ctx.shadowBlur = 12;
      roundRect(ctx, inset, inset, size - inset * 2, size - inset * 2, 11);
      ctx.stroke();
      ctx.restore();

      // 内侧一圈柔和亮边，增加厚度感
      ctx.strokeStyle = 'rgba(148,163,184,0.14)';
      ctx.lineWidth = 1;
      roundRect(ctx, 6.5, 6.5, size - 13, size - 13, 8);
      ctx.stroke();
    },

    // 兼容旧调用名（部分测试可能还在用）
    drawBackground: function () { this.invalidateBg(); },
    drawGrid: function () { /* 已在 bakeBackground 中烘焙 */ },
    drawWall: function () { /* 已在 bakeBackground 中烘焙 */ },

    /** 障碍物（D 轮）：石板质感的圆角方块 */
    drawObstacles: function () {
      const obs = Game.obstacles;
      if (!obs || !obs.length) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const pad = cell * 0.08;
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i];
        const x = o.x * cell, y = o.y * cell;
        const g = ctx.createLinearGradient(x, y, x + cell, y + cell);
        g.addColorStop(0, '#475569');
        g.addColorStop(1, '#1e293b');
        ctx.fillStyle = g;
        roundRect(ctx, x + pad, y + pad, cell - pad * 2, cell - pad * 2, cell * 0.18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // 高光点，强化体积感
        ctx.fillStyle = 'rgba(203,213,225,0.22)';
        ctx.beginPath();
        ctx.arc(x + cell * 0.36, y + cell * 0.34, cell * 0.1, 0, Math.PI * 2);
        ctx.fill();
      }
    },

    /** 食物：带果梗、叶片与呼吸光环的苹果 */
    drawFood: function () {
      if (Game.food.x < 0) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const x = this.cx(Game.food.x);
      const y = this.cy(Game.food.y);
      const pulse = 1 + Math.sin(Fx.time * 4.2) * 0.07;
      const r = cell * 0.33 * pulse;

      // 外圈呼吸光环
      const ringR = cell * 0.46 + Math.sin(Fx.time * 4.2) * cell * 0.05;
      ctx.save();
      ctx.strokeStyle = 'rgba(248,113,113,0.30)';
      ctx.lineWidth = Math.max(1, cell * 0.055);
      ctx.beginPath();
      ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 阴影
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.92, r * 0.85, r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 果身（径向渐变）
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r * 1.05);
      g.addColorStop(0, '#fca5a5');
      g.addColorStop(0.45, '#ef4444');
      g.addColorStop(1, '#b91c1c');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.34, y - r * 0.36, r * 0.24, r * 0.16, -0.6, 0, Math.PI * 2);
      ctx.fill();

      // 果梗
      ctx.strokeStyle = '#7c4a12';
      ctx.lineWidth = Math.max(1, cell * 0.075);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y - r * 0.78);
      ctx.quadraticCurveTo(x + r * 0.12, y - r * 1.12, x + r * 0.3, y - r * 1.25);
      ctx.stroke();

      // 叶片
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.ellipse(x + r * 0.52, y - r * 1.12, r * 0.36, r * 0.17, -0.5, 0, Math.PI * 2);
      ctx.fill();
    },

    /**
     * 特殊食物（C 轮）：金蛇果 / 冰冻果 / 限时奖励。
     * 三种外观各异，且都带「限时环」——环随 ttl 收缩，提示玩家抓紧时间。
     */
    drawSpecial: function () {
      const sp = Game.special;
      if (!sp) return;
      const ctx = this.ctx;
      const cell = this.cell;
      const x = this.cx(sp.x);
      const y = this.cy(sp.y);
      const t = Fx.time;
      const pulse = 1 + Math.sin(t * 4.6) * 0.06;
      const r = cell * 0.34 * pulse;

      // 限时环：剩余时间比例 → 半径从 cell*0.5 收到 cell*0.36
      const ratio = sp.maxTtl > 0 ? Math.max(0, Math.min(1, sp.ttl / sp.maxTtl)) : 1;
      const ringR = cell * 0.36 + (cell * 0.16) * ratio;

      // 主题色（按类型区分）
      let core1, core2, core3, glow, ring, spark;
      if (sp.type === 'gold') {
        core1 = '#fef3c7'; core2 = '#f59e0b'; core3 = '#b45309';
        glow = 'rgba(245,158,11,0.34)'; ring = 'rgba(251,191,36,0.45)'; spark = '#fffbeb';
      } else if (sp.type === 'ice') {
        core1 = '#cffafe'; core2 = '#22d3ee'; core3 = '#0e7490';
        glow = 'rgba(34,211,238,0.34)'; ring = 'rgba(103,232,249,0.5)'; spark = '#ecfeff';
      } else if (sp.type === 'shield') {   // E 轮：护盾果（青绿）
        core1 = '#f0fdfa'; core2 = '#2dd4bf'; core3 = '#0f766e';
        glow = 'rgba(45,212,191,0.34)'; ring = 'rgba(94,234,212,0.5)'; spark = '#ccfbf1';
      } else { // bonus
        core1 = '#fde68a'; core2 = '#fbbf24'; core3 = '#d97706';
        glow = 'rgba(250,204,21,0.34)'; ring = 'rgba(253,224,71,0.5)'; spark = '#fffde7';
      }

      // 限时环
      ctx.save();
      ctx.strokeStyle = ring;
      ctx.lineWidth = Math.max(1, cell * 0.05);
      ctx.beginPath();
      ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 外发光
      ctx.save();
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 阴影
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.92, r * 0.85, r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 主体径向渐变
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r * 1.05);
      g.addColorStop(0, core1);
      g.addColorStop(0.5, core2);
      g.addColorStop(1, core3);
      ctx.fillStyle = g;

      if (sp.type === 'shield') {
        // E 轮：护盾果 —— 盾牌造型
        const sw = r * 0.92, sh = r * 1.16;
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        ctx.moveTo(-sw, -sh * 0.72);
        ctx.lineTo(sw, -sh * 0.72);
        ctx.lineTo(sw, sh * 0.12);
        ctx.quadraticCurveTo(sw * 0.72, sh * 0.86, 0, sh);
        ctx.quadraticCurveTo(-sw * 0.72, sh * 0.86, -sw, sh * 0.12);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else if (sp.type === 'bonus') {
        // 限时奖励：菱形（旋转方块）造型，更醒目
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 1.1);
        const d = r * 1.05;
        ctx.beginPath();
        ctx.moveTo(0, -d); ctx.lineTo(d, 0); ctx.lineTo(0, d); ctx.lineTo(-d, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        // 金蛇果 / 冰冻果：圆身（与苹果同一种语言）
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.34, y - r * 0.36, r * 0.24, r * 0.16, -0.6, 0, Math.PI * 2);
      ctx.fill();

      // 星形闪光（旋转的小十字），强化「特殊」反馈
      ctx.save();
      ctx.translate(x, y - r * 1.25);
      ctx.rotate(t * 2.2);
      ctx.fillStyle = spark;
      const s = Math.max(1.2, cell * 0.07);
      ctx.globalAlpha = 0.9;
      ctx.fillRect(-s * 0.32, -s, s * 0.64, s * 2);
      ctx.fillRect(-s, -s * 0.32, s * 2, s * 0.64);
      ctx.restore();

      // 金蛇果 / 冰冻果 的果梗 + 叶子（bonus 与 shield 不需要）
      if (sp.type !== 'bonus' && sp.type !== 'shield') {
        ctx.strokeStyle = sp.type === 'gold' ? '#7c4a12' : '#0e7490';
        ctx.lineWidth = Math.max(1, cell * 0.075);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y - r * 0.78);
        ctx.quadraticCurveTo(x + r * 0.12, y - r * 1.12, x + r * 0.3, y - r * 1.25);
        ctx.stroke();

        ctx.fillStyle = sp.type === 'gold' ? '#4ade80' : '#a5f3fc';
        ctx.beginPath();
        ctx.ellipse(x + r * 0.52, y - r * 1.12, r * 0.36, r * 0.17, -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    },

    /**
     * 蛇身：用圆头折线一次性描出来，天然处理转弯处的连接，
     * 再叠一层虚线做出"鳞片分节"的质感。
     */
    drawSnake: function (alpha) {
      const ctx = this.ctx;
      const cell = this.cell;
      const n = Game.snake.length;
      if (n === 0) return;

      // 1) 计算每节插值的像素中心
      const pts = new Array(n);
      for (let i = 0; i < n; i++) {
        const cur = Game.snake[i];
        const prev = (i < Game.prevSnake.length) ? Game.prevSnake[i] : cur;
        pts[i] = {
          x: this.cx(prev.x + (cur.x - prev.x) * alpha),
          y: this.cy(prev.y + (cur.y - prev.y) * alpha)
        };
      }

      const path = new Path2D();
      path.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < n; i++) path.lineTo(pts[i].x, pts[i].y);

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // G 轮：配色取自当前皮肤（未解锁的皮肤不会被选中，见 Skins.currentSkin）
      const skin = Skins.currentSkin();

      // 2) 深色描边（轮廓）
      ctx.strokeStyle = skin.edge;
      ctx.lineWidth = cell * 0.9;
      ctx.stroke(path);

      // 3) 主体渐变：蛇头浅 -> 蛇尾深
      const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
      grad.addColorStop(0, skin.c1);
      grad.addColorStop(0.45, skin.c2);
      grad.addColorStop(1, skin.c3);
      ctx.strokeStyle = grad;
      ctx.lineWidth = cell * 0.74;
      ctx.stroke(path);

      // 4) 背部虚线高光，做出分节质感
      ctx.save();
      ctx.setLineDash([cell * 0.2, cell * 0.36]);
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = cell * 0.24;
      ctx.stroke(path);
      ctx.restore();

      // 4.5) E 轮：免伤期间蛇身外圈闪烁，明确告诉玩家"现在撞不死"
      //      Fx.time 在暂停时不推进，闪烁随画面一起定格
      if (Game.invincible > 0) {
        const blink = 0.4 + 0.35 * Math.sin(Fx.time * 18);
        ctx.save();
        ctx.globalAlpha = Math.max(0.12, Math.min(0.85, blink));
        ctx.strokeStyle = '#a5f3fc';
        ctx.lineWidth = cell * 1.02;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke(path);
        ctx.restore();
      }

      // 5) 蛇头：眼睛 + 嘴巴
      this.drawHead(pts[0], pts[Math.min(1, n - 1)], skin);
    },

    drawHead: function (head, neck, skinIn) {
      const ctx = this.ctx;
      const cell = this.cell;
      const skin = skinIn || Skins.currentSkin();
      const pulse = 1 + Game.headPulse * 0.16;

      let dx = head.x - neck.x;
      let dy = head.y - neck.y;
      let len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.001) {
        // 蛇头与蛇颈重合（蛇长为 1）时无法求出朝向，退化到当前前进方向。
        // 注意：必须在归一化之前判断，否则 len 被兜成 1 后该分支永远进不来。
        dx = Game.dir.x; dy = Game.dir.y; len = 1;
      }
      dx /= len; dy /= len;

      ctx.save();
      ctx.translate(head.x, head.y);

      // 头部底色（略大于身体，形成圆润的脑袋）
      const hr = cell * 0.46 * pulse;
      const g = ctx.createRadialGradient(-hr * 0.3, -hr * 0.3, hr * 0.1, 0, 0, hr);
      g.addColorStop(0, skin.head1);
      g.addColorStop(1, skin.head2);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, hr, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛：沿前进方向的垂线左右对称分布
      const px = -dy, py = dx;               // 垂直向量
      const eyeOff = cell * 0.2, eyeFwd = cell * 0.12;
      const eyeR = cell * 0.135, pupilR = cell * 0.072;

      for (let s = -1; s <= 1; s += 2) {
        const ex = px * eyeOff * s + dx * eyeFwd;
        const ey = py * eyeOff * s + dy * eyeFwd;

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(ex + dx * eyeR * 0.28, ey + dy * eyeR * 0.28, pupilR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(ex - dx * pupilR * 0.3 + px * pupilR * 0.35,
                ey - dy * pupilR * 0.3 + py * pupilR * 0.35, pupilR * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }

      // 嘴巴：吃到食物瞬间张开
      const open = Game.headPulse * cell * 0.07;
      ctx.strokeStyle = 'rgba(6,78,59,0.75)';
      ctx.lineWidth = Math.max(1, cell * 0.05);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(dx * cell * 0.3 - px * cell * 0.1, dy * cell * 0.3 - py * cell * 0.1);
      ctx.quadraticCurveTo(dx * cell * (0.42 + open * 2), dy * cell * (0.42 + open * 2),
                           dx * cell * 0.3 + px * cell * 0.1, dy * cell * 0.3 + py * cell * 0.1);
      ctx.stroke();

      ctx.restore();
    },

    /**
     * F 轮：Boss 蛇（多形态）
     * - chaser   追猎者：暗红，D 轮原行为
     * - splitter 分裂者：紫红，更长的蛇，被击破后分裂
     * - dasher   游猎者：橙红，会周期性朝玩家直线冲刺
     * 另外：命中闪白、冲刺预警箭头、尾节弱点圆环（提示"撞这里"）
     */
    drawBoss: function (alpha) {
      const list = Game.bosses;
      for (let k = 0; k < list.length; k++) this.drawOneBoss(list[k], alpha);
    },

    /** 形态配色 */
    _bossPalette: function (kind) {
      if (kind === 'splitter') {
        return { edge: '#4c1d95', c1: '#e9d5ff', c2: '#a855f7', c3: '#6b21a8',
                 glow: 'rgba(168,85,247,0.85)', head1: '#f3e8ff', head2: '#a855f7' };
      }
      if (kind === 'dasher') {
        return { edge: '#7c2d12', c1: '#fed7aa', c2: '#f97316', c3: '#9a3412',
                 glow: 'rgba(249,115,22,0.9)', head1: '#ffedd5', head2: '#f97316' };
      }
      return { edge: '#7f1d1d', c1: '#fb7185', c2: '#e11d48', c3: '#9f1239',
               glow: 'rgba(225,29,72,0.85)', head1: '#fecaca', head2: '#ef4444' };
    },

    drawOneBoss: function (b, alpha) {
      const ctx = this.ctx;
      const cell = this.cell;
      const n = b.snake.length;
      if (!n) return;
      const pal = this._bossPalette(b.kind);

      const pts = new Array(n);
      for (let i = 0; i < n; i++) {
        const cur = b.snake[i];
        const prev = (i < b.prevSnake.length) ? b.prevSnake[i] : cur;
        pts[i] = {
          x: this.cx(prev.x + (cur.x - prev.x) * alpha),
          y: this.cy(prev.y + (cur.y - prev.y) * alpha)
        };
      }

      const path = new Path2D();
      path.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < n; i++) path.lineTo(pts[i].x, pts[i].y);

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // 深色描边
      ctx.strokeStyle = pal.edge;
      ctx.lineWidth = cell * 0.9;
      ctx.stroke(path);

      // 主体渐变
      const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
      grad.addColorStop(0, pal.c1);
      grad.addColorStop(0.5, pal.c2);
      grad.addColorStop(1, pal.c3);
      ctx.strokeStyle = grad;
      ctx.lineWidth = cell * 0.72;
      ctx.stroke(path);

      // 命中闪白 / 冲刺预警：整条叠一层亮色
      const flash = b.hitFlash > 0 ? (b.hitFlash / Config.BOSS_HIT_FLASH) : 0;
      const warn = b.dashWarn > 0 ? (0.5 + 0.5 * Math.sin(Fx.time * 26)) : 0;
      if (flash > 0 || warn > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, Math.max(flash * 0.9, warn * 0.5));
        ctx.strokeStyle = flash > 0 ? '#ffffff' : '#fde68a';
        ctx.lineWidth = cell * 0.8;
        ctx.stroke(path);
        ctx.restore();
      }

      // 头部
      const head = pts[0];
      const neck = pts[Math.min(1, n - 1)];
      let dx = head.x - neck.x, dy = head.y - neck.y;
      let len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.001) { dx = b.dir.x; dy = b.dir.y; len = 1; }
      dx /= len; dy /= len;

      ctx.save();
      ctx.translate(head.x, head.y);
      const hr = cell * 0.46;
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = cell * 0.4;
      const hg = ctx.createRadialGradient(-hr * 0.3, -hr * 0.3, hr * 0.1, 0, 0, hr);
      hg.addColorStop(0, pal.head1);
      hg.addColorStop(1, pal.head2);
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(0, 0, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 眼睛（沿前进方向垂线对称）
      const px = -dy, py = dx;
      const eo = cell * 0.2, ef = cell * 0.12, er = cell * 0.13, pr = cell * 0.07;
      for (let s = -1; s <= 1; s += 2) {
        const ex = px * eo * s + dx * ef, ey = py * eo * s + dy * ef;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(ex + dx * er * 0.3, ey + dy * er * 0.3, pr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      // 冲刺预警：头前方一个闪烁箭头，给玩家反应时间
      if (b.dashWarn > 0) {
        const d = b.dashDir;
        ctx.save();
        ctx.globalAlpha = 0.45 + 0.4 * Math.sin(Fx.time * 26);
        ctx.fillStyle = '#fde68a';
        const s = cell * 0.32, off = cell * 0.7;
        ctx.beginPath();
        ctx.moveTo(head.x + d.x * off, head.y + d.y * off);
        ctx.lineTo(head.x + d.x * (off + s) - d.y * s * 0.7, head.y + d.y * (off + s) + d.x * s * 0.7);
        ctx.lineTo(head.x + d.x * (off + s) + d.y * s * 0.7, head.y + d.y * (off + s) - d.x * s * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 尾节弱点：脉动虚线圆环，明确告诉玩家"撞这里"
      const tail = pts[n - 1];
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.32 * Math.sin(Fx.time * 5);
      ctx.strokeStyle = '#fef9c3';
      ctx.lineWidth = Math.max(1.5, cell * 0.075);
      ctx.setLineDash([cell * 0.18, cell * 0.16]);
      ctx.beginPath();
      ctx.arc(tail.x, tail.y, cell * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    },

    /** F 轮：毒区 —— 紫色半透明方块 + 缓慢上浮的气泡 */
    drawHazards: function () {
      const hs = Game.hazards;
      if (!hs.length) return;
      const ctx = this.ctx;
      const cell = this.cell;
      for (let i = 0; i < hs.length; i++) {
        const h = hs[i];
        const x = h.x * cell, y = h.y * cell, w = h.w * cell, hh = h.h * cell;
        ctx.save();
        ctx.fillStyle = 'rgba(147,51,234,0.26)';
        roundRect(ctx, x + cell * 0.06, y + cell * 0.06, w - cell * 0.12, hh - cell * 0.12, cell * 0.22);
        ctx.fill();
        ctx.strokeStyle = 'rgba(192,132,252,0.5)';
        ctx.lineWidth = Math.max(1, cell * 0.055);
        ctx.stroke();

        ctx.fillStyle = 'rgba(216,180,254,0.6)';
        for (let k = 0; k < 3; k++) {
          const ph = (Fx.time * 0.55 + k * 0.37 + i * 0.21) % 1;
          const bx = x + w * (0.24 + 0.26 * k);
          const by = y + hh - ph * hh * 0.85 - cell * 0.12;
          ctx.globalAlpha = (1 - ph) * 0.65;
          ctx.beginPath();
          ctx.arc(bx, by, cell * (0.06 + 0.05 * (1 - ph)), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    },

    /**
     * G 轮：成就提示 —— 画布右上角滑入的小卡片，停留 ACH_TOAST_TIME 秒。
     * 用 Canvas 而不是 DOM：不新增 HTML 结构，也就不会破坏
     * 「遮罩面板全部走文档流」这条既有约束。
     */
    drawAchievement: function () {
      const t = Game.achToast;
      if (!t) return;
      const ctx = this.ctx;
      const size = this.size;

      // 前 0.25s 从右侧滑入，末 0.45s 滑出
      const elapsed = t.max - t.time;
      let offset = 0;
      if (elapsed < 0.25) offset = (1 - elapsed / 0.25) * size * 0.14;
      else if (t.time < 0.45) offset = (1 - t.time / 0.45) * size * 0.14;
      const alpha = Math.max(0, Math.min(1, t.time / 0.45));
      if (alpha <= 0) return;

      const w = size * 0.54;
      const h = size * 0.095;
      const x = size - w - size * 0.03 + offset;
      const y = size * 0.05 + h + size * 0.03;   // 让开画布顶部的 Boss 血条

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(15,23,42,0.9)';
      roundRect(ctx, x, y, w, h, h * 0.28);
      ctx.fill();
      ctx.strokeStyle = 'rgba(250,204,21,0.65)';
      ctx.lineWidth = Math.max(1, size * 0.004);
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fde68a';
      ctx.font = '800 ' + Math.round(size * 0.03) + 'px ' + getFontFamily();
      ctx.fillText('\u2605 成就解锁 · ' + t.name, x + h * 0.32, y + h * 0.36);
      ctx.fillStyle = 'rgba(226,232,240,0.82)';
      ctx.font = '500 ' + Math.round(size * 0.022) + 'px ' + getFontFamily();
      ctx.fillText(t.desc, x + h * 0.32, y + h * 0.72);
      ctx.restore();
    },

    /**
     * F 轮：Boss 血条 —— 画布顶部中央，不受震屏影响。
     * 多条 Boss（分裂体）时显示合计血量与条数。
     */
    drawBossHealth: function () {
      const list = Game.bosses;
      if (!list.length) return;
      const ctx = this.ctx;
      const size = this.size;

      let cur = 0, max = 0;
      for (let i = 0; i < list.length; i++) {
        cur += Math.max(0, list[i].hp);
        max += list[i].maxHp;
      }
      if (max <= 0) return;

      const w = size * 0.44;
      const h = Math.max(8, size * 0.022);
      const x = (size - w) / 2;
      const y = size * 0.018;
      const r = h / 2;

      ctx.save();
      ctx.fillStyle = 'rgba(15,23,42,0.72)';
      roundRect(ctx, x, y, w, h, r);
      ctx.fill();
      ctx.strokeStyle = 'rgba(248,113,113,0.45)';
      ctx.lineWidth = Math.max(1, size * 0.004);
      ctx.stroke();

      const ratio = Math.max(0, Math.min(1, cur / max));
      if (ratio > 0) {
        const g = ctx.createLinearGradient(x, y, x + w, y);
        g.addColorStop(0, '#ef4444');
        g.addColorStop(1, '#fb923c');
        ctx.fillStyle = g;
        roundRect(ctx, x + 1, y + 1, Math.max(h * 0.5, (w - 2) * ratio), h - 2, r);
        ctx.fill();
      }

      ctx.font = '700 ' + Math.round(size * 0.026) + 'px ' + getFontFamily();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fecaca';
      const name = Game.bossName(list[0].kind);
      const label = (list.length > 1 ? (name + ' ×' + list.length) : name) + '  ' + cur + '/' + max;
      ctx.fillText(label, size / 2, y + h + size * 0.022);
      ctx.restore();
    },

    /** 关卡横幅（D 轮）：进关瞬间居中显示「第 N 关」，淡入淡出 */
    drawBanner: function () {
      if (Game.stageBannerTime <= 0 || !Game.stageBannerText) return;
      const ctx = this.ctx;
      const size = this.size;
      const t = Game.stageBannerTime;
      const aIn = Math.min(1, (2.0 - t) / 0.3);    // 前 0.3s 淡入
      const aOut = Math.min(1, t / 0.5);           // 末 0.5s 淡出
      const alpha = Math.max(0, Math.min(aIn, aOut));
      if (alpha <= 0) return;
      const pulse = 1 + Math.sin(Fx.time * 6) * 0.04;
      const fontSize = Math.round(size * 0.11 * pulse);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 ' + fontSize + 'px ' + getFontFamily();
      ctx.lineWidth = Math.max(3, size * 0.012);
      ctx.strokeStyle = 'rgba(11,18,32,0.9)';
      ctx.strokeText(Game.stageBannerText, size / 2, size / 2 - size * 0.02);
      const g = ctx.createLinearGradient(0, size / 2 - fontSize, 0, size / 2 + fontSize);
      g.addColorStop(0, '#c4b5fd');
      g.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = g;
      ctx.fillText(Game.stageBannerText, size / 2, size / 2 - size * 0.02);
      if (Game.bosses.length) {
        ctx.font = '600 ' + Math.round(size * 0.045) + 'px ' + getFontFamily();
        ctx.fillStyle = '#fecaca';
        ctx.fillText('⚠ ' + Game.bossName(Game.bosses[0].kind) + ' · 撞它的尾巴', size / 2, size / 2 + size * 0.08);
      }
      ctx.restore();
    },

    drawParticles: function () {
      const ctx = this.ctx;
      for (let i = 0; i < Fx.particles.length; i++) {
        const p = Fx.particles[i];
        const a = Math.max(0, Math.min(1, p.life / p.maxLife));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    },

    drawFloaters: function () {
      const ctx = this.ctx;
      const cell = this.cell;
      for (let i = 0; i < Fx.floaters.length; i++) {
        const f = Fx.floaters[i];
        const a = Math.max(0, Math.min(1, f.life / f.maxLife));
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fde047';
        ctx.font = '800 ' + Math.round(cell * 0.62) + 'px ' + getFontFamily();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(11,18,32,0.85)';
        ctx.lineWidth = Math.max(2, cell * 0.14);
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }
  };

  /** 圆角矩形路径（自己实现，避免依赖 ctx.roundRect 的兼容性） */
  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function getFontFamily() {
    return '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
  }

  /** 转义文本，避免用户名破坏面板 HTML 结构 */
  /** G 轮：模式 id -> 中文名（老记录没有 mode 字段时按闯关显示） */
  function modeName(id) {
    for (let i = 0; i < MODES.length; i++) {
      if (MODES[i].id === id) return MODES[i].name;
    }
    return '闯关';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** H 轮：复制文本到剪贴板（优先 Clipboard API，失败降级 execCommand） */
  function copyText(text) {
    try {
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* 继续走降级 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) {
      return false;
    }
  }

  /** H 轮：合成一张成绩卡 PNG 并触发下载（file:// 下 canvas 无跨域图片，不会被污染） */
  function saveScoreCard() {
    try {
      const c = document.createElement('canvas');
      c.width = 480; c.height = 600;
      const ctx = c.getContext('2d');
      const skin = (typeof Skins !== 'undefined' && Skins.currentSkin) ? Skins.currentSkin() : null;
      const head = skin && skin.head ? skin.head : '#65d36e';
      const body = skin && skin.body ? skin.body : '#3fae57';
      // 背景
      const grad = ctx.createLinearGradient(0, 0, 0, 600);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#1e293b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 480, 600);
      // 标题
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(Game.win ? '通关啦！' : '贪吃蛇 · 成绩卡', 240, 70);
      // 蛇头图标
      ctx.fillStyle = head;
      ctx.beginPath(); ctx.arc(240, 130, 34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(200, 165, 24, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(168, 192, 16, 0, Math.PI * 2); ctx.fill();
      // 分数
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 72px sans-serif';
      ctx.fillText(String(Game.score), 240, 300);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px sans-serif';
      ctx.fillText('得分', 240, 326);
      // 明细
      const run = Game.buildShareRun();
      const mName = MODES[run.m] ? MODES[run.m].name : '未知';
      const lines = [
        '模式：' + mName,
        '蛇身长度：' + run.l,
        '时长：' + run.t + ' 秒',
        '最高连击：' + run.c,
        '击破 Boss：' + run.b,
        '成就：' + run.a + ' / 12'
      ];
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'left';
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], 70, 380 + i * 30);
      }
      // 分享码
      const code = Share.encode(run);
      ctx.fillStyle = '#64748b';
      ctx.font = '13px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('分享码：' + code, 240, 575);
      // 下载
      const url = c.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'snake-score.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) { /* 不支持时静默 */ }
  }

  /** 排行榜日期只取 YYYY-MM-DD 展示 */
  function formatLbDate(iso) {
    if (typeof iso !== 'string' || iso.length < 10) return '';
    return iso.slice(0, 10);
  }

  /** 时长格式化为「Xs」或「Xm Ys」 */
  function formatLbDuration(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + 'm' + (s ? s + 's' : '');
  }

  /* ============================================================
   * 8. UI 层（HUD + 遮罩面板 + 音效按钮 + 排行榜）
   * ========================================================== */
  const UI = {
    els: {},
    lbClearArmed: false,        // 清空按钮是否处于「二次确认倒计时」状态
    lbClearTimer: null,         // 5 秒自动取消的计时器句柄
    lbClearCountdown: 0,        // 倒计时剩余秒数

    init: function () {
      this.els = {
        score: document.getElementById('scoreEl'),
        best: document.getElementById('bestEl'),
        level: document.getElementById('levelEl'),
        tps: document.getElementById('tpsEl'),
        speedFill: document.getElementById('speedFill'),
        overlay: document.getElementById('overlay'),
        panel: document.getElementById('panel'),
        soundBtn: document.getElementById('soundBtn'),
        wave1: document.getElementById('wave1'),
        wave2: document.getElementById('wave2'),
        slash: document.getElementById('slash'),
        themeBtn: document.getElementById('themeBtn'),
        moonIcon: document.getElementById('moonIcon'),
        sunIcon: document.getElementById('sunIcon'),
        stage: document.getElementById('stage'),
        buffBar: document.getElementById('buffBar'),
        buffIc: document.getElementById('buffIc'),
        buffTx: document.getElementById('buffTx'),
        buffTm: document.getElementById('buffTm'),
        stageEl: document.getElementById('stageEl'),
        stageProgEl: document.getElementById('stageProgEl'),
        // E 轮：生命 + 连击
        livesEl: document.getElementById('livesEl'),
        comboBar: document.getElementById('comboBar'),
        comboMul: document.getElementById('comboMul'),
        comboCnt: document.getElementById('comboCnt'),
        comboTm: document.getElementById('comboTm'),
        // 玩法指引弹窗
        guideModal: document.getElementById('guideModal'),
        guideBody: document.getElementById('guideBody'),
        guideClose: document.getElementById('guideClose'),
        guideOk: document.getElementById('guideOk')
      };

      this.els.overlay.addEventListener('click', function () {
        // 准备态：只有「开始游戏」按钮能开始，点屏幕任意处（模式/皮肤/排行榜等）不启动，避免误触
        if (Game.state === STATE.READY) return;
        // 结束态：只响应「再来一局」按钮，点遮罩其它位置不重启（避免误触，见 bug 修复）
        if (Game.state === STATE.GAMEOVER) return;
        // J 轮：每日榜是独立面板，点遮罩不误触发其它动作
        if (Game.state === STATE.DAILY) return;
        // E 轮：选卡期间点空白处不响应，避免把选卡面板顶掉
        if (Game.awaitingUpgrade) return;
        App.primaryAction();
      });

      // 玩法指引弹窗：关闭按钮 / 知道了 / 点背景遮罩关闭
      const self = this;
      if (this.els.guideClose) {
        this.els.guideClose.addEventListener('click', function (e) {
          e.stopPropagation();
          self.hideGuide();
        });
      }
      if (this.els.guideOk) {
        this.els.guideOk.addEventListener('click', function (e) {
          e.stopPropagation();
          self.hideGuide();
        });
      }
      if (this.els.guideModal) {
        this.els.guideModal.addEventListener('click', function (e) {
          if (e.target === self.els.guideModal || e.target.classList.contains('guide-backdrop')) {
            self.hideGuide();
          }
        });
      }

      this.els.soundBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        Sfx.muted = !Sfx.muted;
        Storage.set(Config.STORAGE_MUTED, Sfx.muted ? '1' : '0');
        if (!Sfx.muted) { Sfx.unlock(); Sfx.start(); }
        UI.syncSoundIcon();
      });

      // 主题切换：toggle data-theme + 持久化（themeBtn 可能不存在，如测试环境，需保护）
      const tb = this.els.themeBtn;
      if (tb) {
        const applyTheme = function (theme) {
          if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
          else delete document.documentElement.dataset.theme;
          Storage.set(Config.STORAGE_THEME, theme);
          UI.syncThemeIcon();
        };
        tb.addEventListener('click', function (e) {
          e.stopPropagation();
          const cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
          applyTheme(cur === 'dark' ? 'light' : 'dark');
        });
        // 启动：读取持久化主题（默认浅色）
        const savedTheme = Storage.get(Config.STORAGE_THEME, 'light');
        applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
      }

      this.syncSoundIcon();
      this.updateHud();
      this.syncOverlay();
    },

    syncSoundIcon: function () {
      const on = !Sfx.muted;
      this.els.wave1.style.display = on ? '' : 'none';
      this.els.wave2.style.display = on ? '' : 'none';
      this.els.slash.style.display = on ? 'none' : '';
      this.els.soundBtn.classList.toggle('is-off', !on);
      this.els.soundBtn.title = on ? '音效：开' : '音效：关';
    },

    syncThemeIcon: function () {
      const dark = document.documentElement.dataset.theme === 'dark';
      if (this.els.moonIcon) this.els.moonIcon.style.display = dark ? 'none' : '';
      if (this.els.sunIcon)  this.els.sunIcon.style.display  = dark ? '' : 'none';
      if (this.els.themeBtn) this.els.themeBtn.title = dark ? '主题：深色（点击切浅色）' : '主题：浅色（点击切深色）';
    },

    updateHud: function () {
      this.els.score.textContent = String(Game.score);
      this.els.best.textContent = String(Game.best);
      this.els.level.textContent = String(Game.level + 1);
      this.els.tps.textContent = Game.tps().toFixed(1) + '/s';

      const span = Config.MAX_TPS - Config.BASE_TPS;
      const pct = span <= 0 ? 100 : ((Game.tps() - Config.BASE_TPS) / span) * 100;
      this.els.speedFill.style.width = Math.max(4, Math.min(100, pct)).toFixed(1) + '%';

      // D 轮：关卡指示（G 轮：限时模式下改显示剩余时间）
      if (this.els.stageEl) {
        this.els.stageEl.textContent = Game.isTimeAttack()
          ? ('剩余 ' + Game.timeLeft.toFixed(1) + 's')
          : ('第 ' + Game.stage + ' 关');
      }
      if (this.els.stageProgEl) {
        this.els.stageProgEl.textContent = Game.isTimeAttack()
          ? '限时冲刺'
          : (Game.stageMode ? ('食物 ' + Game.stageFoods + '/' + Game.stageTarget) : '');
      }

      // E 轮：生命（满的实心 ♥，已消耗的空心 ♡；剩 1 点时脉动告警）
      if (this.els.livesEl) {
        let h = '';
        for (let i = 0; i < Game.maxLives; i++) {
          const alive = i < Game.lives;
          h += '<span class="life' + (alive ? '' : ' gone') + '">' + (alive ? '♥' : '♡') + '</span>';
        }
        this.els.livesEl.innerHTML = h;
        const inGame = (Game.state === STATE.PLAYING || Game.state === STATE.PAUSED);
        this.els.livesEl.classList.toggle('low', inGame && Game.lives === 1);
      }
    },

    /**
     * 刷新加速/减速状态条（金蛇果 / 冰冻果 buff 期间显示）。
     * 暂停时 buff 冻结，倒数也跟着定格，符合「暂停特效冻结」；
     * 非 PLAYING/PAUSED 或无 buff 时隐藏。
     */
    updateBuff: function () {
      const bar = this.els.buffBar;
      if (!bar) return;
      const active = (Game.state === STATE.PLAYING || Game.state === STATE.PAUSED);
      if (active && Game.speedBuffAdd !== 0 && Game.speedBuffTime > 0) {
        const gold = Game.speedBuffAdd > 0;
        bar.hidden = false;
        bar.classList.toggle('gold', gold);
        bar.classList.toggle('ice', !gold);
        if (this.els.buffIc) this.els.buffIc.textContent = gold ? '⚡' : '❄';
        if (this.els.buffTx) this.els.buffTx.textContent = gold ? '加速' : '减速';
        if (this.els.buffTm) this.els.buffTm.textContent = Game.speedBuffTime.toFixed(1) + 's';
      } else {
        bar.hidden = true;
      }
    },

    /**
     * E 轮：刷新连击条（有连击时显示在画布顶部中央）。
     * 与 buff-bar 一个贴顶一个贴底，互不遮挡；暂停时随画面一起定格。
     */
    updateCombo: function () {
      const bar = this.els.comboBar;
      if (!bar) return;
      const active = (Game.state === STATE.PLAYING || Game.state === STATE.PAUSED);
      if (active && Game.combo > 0 && Game.comboTimer > 0) {
        bar.hidden = false;
        bar.classList.toggle('hot', Game.combo >= 5);
        if (this.els.comboMul) this.els.comboMul.textContent = '×' + Game.comboMultiplier().toFixed(1);
        if (this.els.comboCnt) this.els.comboCnt.textContent = '连击 ' + Game.combo;
        if (this.els.comboTm)  this.els.comboTm.textContent  = Game.comboTimer.toFixed(1) + 's';
      } else {
        bar.hidden = true;
      }
    },

    /** 根据状态渲染遮罩面板内容（三屏均走正常文档流，用 gap 隔开层级） */
    syncOverlay: function () {
      const s = Game.state;
      let html = '';

      // E 轮：过关三选一 —— 优先级高于其它面板（此时游戏逻辑已暂停）
      if (Game.awaitingUpgrade && Game.pendingUpgrades && Game.pendingUpgrades.length) {
        html =
          '<div class="tag">LEVEL UP</div>' +
          '<h2>第 ' + Game.stage + ' 关 · 选一项强化</h2>' +
          this.renderUpgradeCards() +
          '<p class="hint">按 <b>1</b> / <b>2</b> / <b>3</b> 或点击卡片选择</p>';
        this.els.panel.innerHTML = html;
        this.els.overlay.hidden = false;
        this.updateBuff();
        this.updateCombo();
        this.bindUpgradeCards();
        return;
      }

      if (s === STATE.READY) {
        html =
          '<div class="tag green">READY</div>' +
          '<h2>贪吃蛇</h2>' +
          '<button class="btn ghost guide-trigger" id="ovGuide" type="button">❓ 玩法指引</button>' +
          this.renderModes() +
          this.renderSkins() +
          this.renderProfile() +
          '<p class="stardust-balance">✨ 星屑：<b>' + Meta.stardust() + '</b></p>' +
          '<button class="btn" id="ovBtn" type="button">开始游戏</button>' +
          '<div class="btn-row">' +
            '<button class="btn ghost" id="ovLb" type="button">🏆 排行榜</button>' +
            '<button class="btn ghost" id="ovAch" type="button">★ 成就</button>' +
            '<button class="btn ghost" id="ovFriends" type="button">👥 好友榜</button>' +
            '<button class="btn ghost" id="ovTalent" type="button">🌟 天赋</button>' +
            '<button class="btn ghost" id="ovDaily" type="button">📅 每日挑战</button>' +
            '<button class="btn ghost" id="ovDailyLb" type="button">📅 每日榜</button>' +
          '</div>' +
          '<p class="hint">按 空格 / Enter 开始 · 点「排行榜 / 成就 / 好友榜 / 天赋 / 每日」查看</p>'

      } else if (s === STATE.PAUSED) {
        // 暂停屏不加排行榜，保持轻量
        html =
          '<div class="tag">PAUSED</div>' +
          '<h2>已暂停</h2>' +
          '<p class="desc">当前得分 <b>' + Game.score + '</b>　最高分 <b>' + Game.best + '</b></p>' +
          '<button class="btn" id="ovBtn" type="button">继续游戏</button>' +
          '<p class="hint">按 空格 / Esc 继续，移动端轻点屏幕继续，按 R 重新开始</p>';

      } else if (s === STATE.GAMEOVER) {
        const title = Game.win ? '通关啦！' : '游戏结束';
        let reason;
        if (Game.mode === 'timeattack')          reason = '时间到！' + Config.TIME_ATTACK_SEC + ' 秒内拿到 <b>' + Game.score + '</b> 分。';
        else if (Game.win)                       reason = '你清空了全部 ' + Config.TOTAL_STAGES + ' 关，这不太科学……';
        else if (Game.deathReason === 'wall')     reason = '撞到墙壁了，注意提前转向。';
        else if (Game.deathReason === 'obstacle') reason = '撞到障碍物了，绕着走。';
        else if (Game.deathReason === 'boss')     reason = '被 Boss 蛇撞上了，要撞就撞它的尾巴。';
        else if (Game.deathReason === 'hazard')   reason = '踩进毒区了，紫色区域要绕开。';
        else                                       reason = '咬到自己了，别急着回头。';
        if (!Game.win) reason += '（本局闯到第 ' + Game.stage + ' 关）';

        // H 轮：本局成绩打包成分享码，供复制 / 好友榜导入
        const shareCode = Share.encode(Game.buildShareRun());

        // 本局成绩已在 endGame 时写入排行榜（Leaderboard.lastRecord）
        let lbHtml = '';
        const rec = Leaderboard.lastRecord;
        if (rec) {
          const rank = Leaderboard.rank(rec.score);
          const total = Leaderboard.count();
          const medalCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
          const medalIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#';
          lbHtml =
            '<div class="lb-current">' +
              '<div class="rank-badge ' + medalCls + '">' +
                '<span class="medal">' + medalIcon + '</span>' +
                '<span class="rank-num">第 ' + rank + ' / ' + total + ' 名</span>' +
              '</div>' +
            '</div>' +
            '<div class="lb-current">' +
              '<input id="lbName" type="text" maxlength="10" value="' + escapeHtml(rec.name) + '" readonly placeholder="Ply">' +
              '<button id="lbEdit" type="button">改名</button>' +
              '<button id="lbSave" type="button" style="display:none">保存</button>' +
            '</div>';
        }

        // 蛇长 = 初始长度 + 过关增长（GROW_PER_STAGE × 已过关数）
        const snakeLen = Game.snake.length;
        // 速度等级 = Game.level + 1（UI 上从 1 开始计数）
        const speedLv = Game.level + 1;
        const tpsVal = Game.tps().toFixed(1);

        html =
          '<div class="tag amber">GAME OVER</div>' +
          '<h2>' + title + '</h2>' +
          (Game.isRecord ? '<div class="record-badge">★ 新纪录</div>' : '') +
          '<div class="go-stats">' +
            '<div class="cell score"><div class="k">本局得分</div><div class="v">' + Game.score + '</div></div>' +
            '<div class="cell combo"><div class="k">最高连击</div><div class="v">' + Game.comboBest + '</div></div>' +
            '<div class="cell len"><div class="k">蛇身长度</div><div class="v">' + snakeLen + '</div></div>' +
            '<div class="cell speed"><div class="k">最快速度</div><div class="v">Lv.' + speedLv + '<small>·' + tpsVal + '/s</small></div></div>' +
          '</div>' +
          '<p class="desc">' + reason + '</p>' +
          lbHtml +
          '<p class="stardust-earn">本局获得 ✨<b>' + (Game._lastEarned || 0) + '</b> 星屑（累计 ✨' + Meta.stardust() + '）</p>' +
          (Game.daily && Game._dailyResult
            ? '<p class="daily-earn">📅 今日榜 第 <b>' + Game._dailyResult.rank + '</b> / ' + Game._dailyResult.total +
              ' 名　连续打卡 <b>' + Game._dailyResult.streak.count + '</b> 天（星屑 +' + Math.round(Game._dailyResult.streak.bonusPct * 100) + '%）</p>'
            : '') +
          (shareCode
            ? '<div class="go-actions">' +
                '<button class="btn" id="ovBtn" type="button">再来一局</button>' +
                '<button class="btn ghost" id="ovShareCopy" type="button">复制分享码</button>' +
                '<button class="btn ghost" id="ovCardSave" type="button">保存成绩卡</button>' +
              '</div>' +
              '<div class="share-block">' +
                '<div class="share-label">成绩分享码（发给好友比一比）</div>' +
                '<div class="share-code" id="shareCode">' + escapeHtml(shareCode) + '</div>' +
              '</div>'
            : '<button class="btn" id="ovBtn" type="button">再来一局</button>') +
          '<p class="hint">按 R / 空格 重新开始，或点「再来一局」</p>';

      } else if (s === STATE.DAILY) {
        const st = Daily.streak();
        html =
          '<div class="tag">DAILY</div>' +
          '<h2>📅 每日榜</h2>' +
          '<p class="desc">今日挑战 <b>' + Daily.todayKey() + '</b>　连续打卡 <b>' + st.count + '</b> 天（星屑 +' + Math.round(st.bonusPct * 100) + '%）</p>' +
          this.renderDailyMods() +
          this.renderDailyBlock() +
          '<button class="btn ghost" id="ovBack" type="button">返回</button>' +
          '<p class="hint">按 Esc / 点「返回」回到开始</p>';

      } else if (s === STATE.LEADERBOARD) {
        html =
          '<div class="tag">LEADERBOARD</div>' +
          '<h2>🏆 排行榜</h2>' +
          this.renderLeaderboardBlock() +
          '<button class="btn ghost" id="ovBack" type="button">返回</button>' +
          '<p class="hint">按 Esc / 点「返回」回到开始</p>';

      } else if (s === STATE.SOCIAL) {
        html =
          '<div class="tag">FRIENDS</div>' +
          '<h2>👥 好友榜</h2>' +
          '<p class="desc">把好友的「成绩分享码」粘进来，就能在这比一比（仅本机保存）。</p>' +
          '<div class="social-import">' +
            '<input id="friendCode" type="text" placeholder="粘贴 SNK1- 开头的分享码" maxlength="200">' +
            '<button class="btn" id="ovImport" type="button">导入</button>' +
          '</div>' +
          '<div id="friendMsg" class="social-msg"></div>' +
          this.renderFriendsBlock() +
          '<button class="btn ghost" id="ovBack" type="button">返回</button>' +
          '<p class="hint">按 Esc / 点「返回」回到开始</p>';

      } else if (s === STATE.ACHIEVEMENTS) {
        html =
          '<div class="tag">ACHIEVEMENTS</div>' +
          '<h2>★ 成就</h2>' +
          this.renderAchievementsBlock() +
          '<button class="btn ghost" id="ovBack" type="button">返回</button>' +
          '<p class="hint">按 Esc / 点「返回」回到开始</p>';

      } else if (s === STATE.TALENTS) {
        html =
          '<div class="tag">TALENTS</div>' +
          '<h2>🌟 天赋</h2>' +
          '<p class="desc">用 ✨星屑 解锁永久强化，跨局生效。</p>' +
          '<p class="stardust-balance big">当前星屑：✨ <b>' + Meta.stardust() + '</b></p>' +
          this.renderTalentsBlock() +
          '<button class="btn ghost" id="ovBack" type="button">返回</button>' +
          '<p class="hint">按 Esc / 点「返回」回到开始</p>';

      } else {
        this.els.overlay.hidden = true;
        this.updateBuff();
        this.updateCombo();
        return;
      }

      this.els.panel.innerHTML = html;
      this.els.overlay.hidden = false;
      this.updateBuff();
      this.updateCombo();

      const self = this;
      const btn = document.getElementById('ovBtn');
      if (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          App.primaryAction();
        });
      }
