<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake Game</title>
<style>
  /* ============================================================
     基础与主题（浅色卡片 + 深色画布，形成对比）
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink:        #0f172a;
    --ink-soft:   #475569;
    --ink-faint:  #94a3b8;
    --line:       #e2e8f0;
    --card:       #ffffff;
    --brand:      #16a34a;
    --brand-2:    #22c55e;
    --accent:     #38bdf8;
    --warn:       #f59e0b;
    --danger:     #ef4444;
    --canvas-bg:  #0b1220;
    --radius:     20px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  /* 深色（夜间）主题：卡片变深、文字变浅，画布保持深色并略加深 */
  :root[data-theme="dark"] {
    --ink:        #e2e8f0;
    --ink-soft:   #cbd5e1;
    --ink-faint:  #94a3b8;
    --line:       #334155;
    --card:       #111c30;
    --brand:      #4ade80;
    --brand-2:    #22c55e;
    --accent:     #38bdf8;
    --warn:       #fbbf24;
    --danger:     #f87171;
    --canvas-bg:  #060c18;
  }
  :root[data-theme="dark"] body {
    background:
      radial-gradient(1200px 600px at 12% -10%, #0c2236 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #0a2a1c 0%, transparent 50%),
      linear-gradient(165deg, #0b1220 0%, #0a0f1a 100%);
  }
  :root[data-theme="dark"] .icon-btn:hover { background: #1e293b; color: var(--ink); }
  /* 深色主题下画布外框也变深，保持整体一致 */
  :root[data-theme="dark"] .canvas-wrap {
    background: linear-gradient(150deg, #0f1a2e, #070d18);
    box-shadow:
      0 18px 40px -12px rgba(0,0,0,.55),
      0 2px 8px rgba(0,0,0,.3);
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    height: 100%;
    overflow: hidden;           /* 小窗口下宁可裁剪，也不要出现滚动条导致画布抖动 */
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%, #e0f2fe 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #dcfce7 0%, transparent 50%),
      linear-gradient(165deg, #f8fafc 0%, #eef2f7 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 18px 16px 16px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;               /* 固定高度 -> 舞台高度由布局决定，画布尺寸变化不会反过来撑高舞台（避免 resize 死循环） */
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  /* ============================ 头部 ============================ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .logo {
    width: 38px; height: 38px;
    flex: 0 0 38px;
    border-radius: 12px;
    background: linear-gradient(140deg, var(--brand-2), #15803d);
    box-shadow: 0 6px 14px rgba(22,163,74,.28);
    display: grid; place-items: center;
  }
  .logo svg { width: 22px; height: 22px; display: block; }

  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    line-height: 1.15;
    white-space: nowrap;
  }
  .title span {
    background: linear-gradient(100deg, var(--brand), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .icon-btn {
    width: 38px; height: 38px;
    flex: 0 0 38px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 12px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .icon-btn:hover { background: #f1f5f9; color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 19px; height: 19px; display: block; }
  .icon-btn.is-off { color: var(--ink-faint); }

  /* ============================ HUD ============================ */
  .hud {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    flex: 0 0 auto;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 12px 10px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    min-width: 0;
  }
  .stat .label {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: .6px;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    letter-spacing: -.5px;
  }
  .stat.score .value { color: var(--brand); }
  .stat.best  .value { color: var(--warn); }
  .stat.level .value { color: var(--accent); }
  .stat .value small { font-size: 12px; font-weight: 700; color: var(--ink-faint); }

  .speed-track {
    margin-top: 6px;
    height: 5px;
    border-radius: 99px;
    background: #eef2f7;
    overflow: hidden;
  }
  .speed-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--brand-2));
    transition: width .25s ease;
  }
  .stage-track {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: .2px;
  }

  /* ============================ 舞台 ============================ */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 200px;          /* 画布始终小于舞台，因此不会产生"画布变大 -> 舞台变大"的循环 */
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .canvas-wrap {
    position: relative;
    line-height: 0;
    border-radius: 18px;
    padding: 7px;
    background: linear-gradient(150deg, #1e293b, #0f172a);
    box-shadow:
      0 18px 40px -12px rgba(15,23,42,.45),
      0 2px 8px rgba(15,23,42,.12);
  }

  canvas {
    display: block;
    border-radius: 12px;
    background: var(--canvas-bg);
    touch-action: none;
  }

  /* ===================== 加速/减速状态条 ===================== */
  /* 绝对定位在画布顶部中央，pointer-events:none 不抢点击；overlay 显示时它 hidden */
  .buff-bar {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .3px;
    pointer-events: none;
    z-index: 3;
    backdrop-filter: blur(3px);
    animation: buff-in .18s ease;
  }
  .buff-bar[hidden] { display: none; }
  .buff-bar.gold {
    color: #fffbeb;
    background: linear-gradient(100deg, rgba(245,158,11,.92), rgba(217,119,6,.9));
    box-shadow: 0 6px 16px -6px rgba(245,158,11,.8);
  }
  .buff-bar.ice {
    color: #ecfeff;
    background: linear-gradient(100deg, rgba(34,211,238,.92), rgba(14,116,144,.9));
    box-shadow: 0 6px 16px -6px rgba(34,211,238,.8);
  }
  .buff-bar .buff-ic { font-size: 15px; line-height: 1; }
  .buff-bar .buff-tm {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    opacity: .92;
    padding-left: 5px;
    margin-left: 1px;
    border-left: 1px solid rgba(255,255,255,.4);
  }
  @keyframes buff-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* ============================ 遮罩层 ============================
     关键：所有遮罩模板都使用正常文档流 flex 列布局，间距交给 gap，
     字号/间距使用 cqw（容器查询宽度单位）随画布宽度优雅缩放，
     避免绝对定位 + 硬编码 px 导致的内容重叠。
     ============================================================== */
  .overlay {
    position: absolute;
    inset: 7px;
    border-radius: 12px;
    /* 完全不透明深底：让 canvas 上的飘字/HUD 颜色不会透出与面板叠在一起 */
    background: rgb(8, 15, 31);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(8px, 2.2cqw, 18px);
    cursor: pointer;
    text-align: center;
    animation: fade .18s ease;
    container-type: inline-size;
  }
  .overlay[hidden] { display: none; }

  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pop  { from { opacity: 0; transform: translateY(8px) scale(.97) }
                    to   { opacity: 1; transform: none } }

  .panel {
    color: #f8fafc;
    width: 100%;
    max-width: min(94cqw, 360px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2.2cqw, 14px);
    animation: pop .22s ease;
  }

  .tag {
    display: inline-block;
    font-size: clamp(10px, 2.4cqw, 12px);
    font-weight: 700;
    letter-spacing: 1.2px;
    padding: 0.35em 0.9em;
    border-radius: 99px;
    background: rgba(56,189,248,.16);
    color: #7dd3fc;
    border: 1px solid rgba(56,189,248,.32);
  }
  .tag.green { background: rgba(34,197,94,.16);  color: #86efac; border-color: rgba(34,197,94,.34); }
  .tag.amber { background: rgba(245,158,11,.18); color: #fcd34d; border-color: rgba(245,158,11,.36); }

  .panel h2 {
    margin: 0;
    font-size: clamp(24px, 7cqw, 40px);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .panel .desc {
    font-size: clamp(12px, 3cqw, 15px);
    line-height: 1.6;
    color: #cbd5e1;
    margin: 0;
  }
  .panel .desc b { color: #f8fafc; font-size: 1.15em; font-variant-numeric: tabular-nums; }

  .scores {
    display: flex;
    justify-content: center;
    gap: clamp(6px, 1.8cqw, 12px);
    width: 100%;
  }
  .scores .box {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(148,163,184,.12);
    border: 1px solid rgba(148,163,184,.2);
    border-radius: 12px;
    padding: clamp(8px, 2cqw, 12px) clamp(6px, 1.5cqw, 10px);
  }
  .scores .box .k { font-size: clamp(10px, 2.2cqw, 12px); color: #94a3b8; letter-spacing: .5px; }
  .scores .box .v {
    font-size: clamp(18px, 4.8cqw, 28px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin-top: 0.15em;
  }
  .scores .box.cur .v { color: #4ade80; }
  .scores .box.bst .v { color: #fbbf24; }

  .record-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: clamp(11px, 2.6cqw, 13px);
    font-weight: 800; letter-spacing: .5px;
    color: #78350f;
    background: linear-gradient(100deg, #fde68a, #fbbf24);
    border-radius: 99px;
    padding: 0.4em 1em;
    box-shadow: 0 6px 16px -6px rgba(245,158,11,.8);
    animation: record-pulse 1.4s ease-in-out infinite;
  }
  @keyframes record-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 6px 16px -6px rgba(245,158,11,.8); }
    50%      { transform: scale(1.06); box-shadow: 0 8px 22px -6px rgba(245,158,11,1); }
  }

  /* ====================== GameOver 排名徽章 ====================== */
  .rank-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: clamp(13px, 3.2cqw, 16px);
    font-weight: 800; letter-spacing: .5px;
    padding: 0.45em 1em 0.45em 0.55em;
    border-radius: 99px;
    background: rgba(148,163,184,.15);
    border: 1px solid rgba(148,163,184,.32);
    color: #e2e8f0;
  }
  .rank-badge .medal {
    display: inline-grid; place-items: center;
    width: 1.6em; height: 1.6em;
    border-radius: 50%;
    font-size: 0.95em;
    font-weight: 800;
    background: rgba(148,163,184,.25);
    color: #f8fafc;
  }
  .rank-badge.gold   { background: linear-gradient(100deg, rgba(253,224,71,.22), rgba(245,158,11,.18)); border-color: rgba(253,224,71,.55); color: #fde68a; }
  .rank-badge.gold   .medal { background: linear-gradient(140deg, #fde68a, #f59e0b); color: #7c2d12; }
  .rank-badge.silver { background: linear-gradient(100deg, rgba(226,232,240,.22), rgba(148,163,184,.18)); border-color: rgba(226,232,240,.45); color: #e2e8f0; }
  .rank-badge.silver .medal { background: linear-gradient(140deg, #f1f5f9, #94a3b8); color: #0f172a; }
  .rank-badge.bronze { background: linear-gradient(100deg, rgba(217,119,6,.22), rgba(180,83,9,.18)); border-color: rgba(217,119,6,.5); color: #fdba74; }
  .rank-badge.bronze .medal { background: linear-gradient(140deg, #fdba74, #b45309); color: #431407; }
  .rank-badge .rank-num { font-variant-numeric: tabular-nums; }

  /* ====================== GameOver 三格统计 ====================== */
  .go-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px, 1.6cqw, 10px);
    width: 100%;
  }
  .go-stats .cell {
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(148,163,184,.18);
    border-radius: 12px;
    padding: clamp(8px, 2cqw, 12px) clamp(6px, 1.5cqw, 10px);
    min-width: 0;
    min-height: 70px;             /* 保证三格统一高度, 不被 k/v 文本挤压变形 */
    display: flex;
    flex-direction: column;
    justify-content: center;     /* k/v 上下分别上下两端对齐, 中间留出空隙 */
    align-items: stretch;
    text-align: center;
    overflow-wrap: anywhere;     /* 中文/超长文本可断字不断字 */
  }
  .go-stats .k {
    font-size: clamp(9px, 2.2cqw, 11px);
    color: #94a3b8;
    letter-spacing: .4px;
    white-space: nowrap;
    line-height: 1.2;
    text-align: center;
  }
  .go-stats .v {
    font-size: clamp(14px, 3.6cqw, 20px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin-top: 6px;             /* 显式间距, 杜绝 k 与 v 紧贴 */
    line-height: 1.1;
    color: #f8fafc;
    text-align: center;
  }
  .go-stats .cell.score .v { color: #4ade80; }
  .go-stats .cell.len   .v { color: #38bdf8; }
  .go-stats .cell.speed .v { color: #fbbf24; font-size: clamp(12px, 3.2cqw, 18px); }
  .go-stats .cell.speed .v small { font-size: 0.6em; color: #cbd5e1; font-weight: 700; margin-left: 2px; }

  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    font-size: clamp(14px, 3.5cqw, 16px);
    font-weight: 800;
    letter-spacing: .6px;
    color: #052e16;
    background: linear-gradient(140deg, #4ade80, #16a34a);
    padding: 0.75em 1.8em;
    border-radius: 99px;
    box-shadow: 0 10px 22px -8px rgba(22,163,74,.75);
    transition: transform .1s, filter .15s;
  }
  .btn:hover  { filter: brightness(1.05); }
  .btn:active { transform: scale(.96); }

  .panel .hint {
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #94a3b8;
    letter-spacing: .3px;
    margin: 0;
  }

  /* ============================ 排行榜 ============================ */
  .leaderboard {
    width: 100%;
    text-align: left;
  }
  .lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(12px, 2.8cqw, 14px);
    font-weight: 800;
    color: #e2e8f0;
    margin-bottom: clamp(6px, 1.5cqw, 10px);
  }
  .lb-list {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    max-height: 40vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(148,163,184,.4) transparent;
  }
  .lb-list::-webkit-scrollbar { width: 6px; }
  .lb-list::-webkit-scrollbar-track { background: transparent; }
  .lb-list::-webkit-scrollbar-thumb {
    background: rgba(148,163,184,.35);
    border-radius: 99px;
  }
  .lb-list li {
    display: grid;
    grid-template-columns: 1.7em 1fr auto auto;
    align-items: center;
    gap: 6px;
    font-size: clamp(11px, 2.6cqw, 13px);
    padding: clamp(6px, 1.6cqw, 10px) clamp(8px, 2cqw, 12px);
    border-radius: 10px;
    margin-bottom: 2px;
    transition: background .15s;
  }
  .lb-list li:nth-child(odd) { background: rgba(248,250,252,0.05); }
  .lb-list li.is-self {
    background: linear-gradient(90deg, rgba(74,222,128,.18), rgba(56,189,248,.12)) !important;
    border: 1px solid rgba(74,222,128,.45);
    box-shadow: 0 0 0 1px rgba(74,222,128,.15) inset;
  }
  .lb-list .lb-ranknum {
    color: #94a3b8;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .lb-list li.is-top1 .lb-ranknum,
  .lb-list li.is-top2 .lb-ranknum,
  .lb-list li.is-top3 .lb-ranknum {
    width: 1.6em; height: 1.6em;
    display: inline-grid; place-items: center;
    border-radius: 50%;
    font-size: 0.95em;
    line-height: 1;
  }
  .lb-list li.is-top1 .lb-ranknum { background: linear-gradient(140deg, #fde68a, #f59e0b); color: #7c2d12; box-shadow: 0 2px 6px -1px rgba(245,158,11,.5); }
  .lb-list li.is-top2 .lb-ranknum { background: linear-gradient(140deg, #f1f5f9, #94a3b8); color: #0f172a; box-shadow: 0 2px 6px -1px rgba(148,163,184,.5); }
  .lb-list li.is-top3 .lb-ranknum { background: linear-gradient(140deg, #fdba74, #b45309); color: #431407; box-shadow: 0 2px 6px -1px rgba(217,119,6,.5); }
  .lb-list .lb-name {
    color: #f8fafc;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 700;
  }
  .lb-list li.is-self .lb-name::after {
    content: '你';
    margin-left: 6px;
    font-size: 0.75em;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    background: rgba(74,222,128,.25);
    color: #86efac;
    border: 1px solid rgba(74,222,128,.4);
  }
  .lb-list .lb-score {
    color: #fbbf24;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .lb-list .lb-meta {
    color: #94a3b8;
    font-size: 0.85em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .lb-empty {
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #94a3b8;
    text-align: center;
    padding: clamp(8px, 2cqw, 12px) 0;
  }

  .lb-current {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(6px, 1.5cqw, 10px);
    font-size: clamp(12px, 3cqw, 15px);
    width: 100%;
  }
  #lbName {
    font: inherit;
    width: 4.5em;
    text-align: center;
    background: rgba(248,250,252,0.12);
    border: 1px solid rgba(148,163,184,0.3);
    border-radius: 8px;
    padding: 0.3em 0.5em;
    color: #f8fafc;
    outline: none;
  }
  #lbName::placeholder { color: #94a3b8; }
  #lbName:read-only { background: transparent; border-color: transparent; }

  #lbEdit, #lbSave, .lb-secondary, .lb-danger {
    appearance: none;
    border: 1px solid rgba(148,163,184,0.35);
    background: rgba(148,163,184,0.15);
    color: #e2e8f0;
    font: inherit;
    font-size: clamp(11px, 2.6cqw, 13px);
    font-weight: 700;
    padding: 0.4em 0.9em;
    border-radius: 99px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  #lbEdit:hover, #lbSave:hover, .lb-secondary:hover { background: rgba(148,163,184,0.25); }
  .lb-danger { border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.12); color: #fca5a5; }
  .lb-danger:hover { background: rgba(248,113,113,0.22); }
  #lbEdit:disabled, #lbSave:disabled, .lb-secondary:disabled, .lb-danger:disabled { opacity: 0.45; cursor: not-allowed; }

  .lb-confirm {
    font-size: clamp(12px, 3cqw, 15px);
    color: #f8fafc;
    line-height: 1.6;
    text-align: center;
  }
  .lb-confirm .lb-count { color: #f87171; font-weight: 800; }
  .lb-confirm-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }

  /* ============================ 底部说明 ============================ */
  .footer {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 14px;
    font-size: 12px;
    color: var(--ink-faint);
  }
  .footer .item { display: inline-flex; align-items: center; gap: 5px; }

  /* ============================ 虚拟方向键 ============================ */
  /* 默认隐藏：桌面用键盘/方向键；仅在触摸设备（无 hover + 粗指针）或窄屏显示 */
  .dpad {
    display: none;
    flex: 0 0 auto;
    width: min(220px, 70vw);
    margin: 2px auto 0;
    aspect-ratio: 1 / 1;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
  }
  .dpad .dbtn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 14px;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;       /* 去掉点击 300ms 延迟，禁止双击缩放 */
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 6px rgba(15,23,42,.10);
    transition: transform .08s ease, background .12s ease;
  }
  .dpad .dbtn:active { transform: scale(.92); background: var(--accent); color: #fff; border-color: var(--accent); }
  /* 十字布局：上在中上、左在中左、右在中右、下在中下 */
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  /* 触摸设备才显示 */
  @media (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
  }

  kbd {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 2px 6px;
    line-height: 1.4;
  }

  /* ============================ 响应式 ============================ */
  @media (max-width: 560px) {
    body { padding: 12px 10px 10px; }
    .title { font-size: 17px; }
    .subtitle { display: none; }
    .stat { padding: 7px 9px 8px; }
    .stat .value { font-size: 18px; }
    .stat .label { font-size: 10px; }
    .footer { font-size: 11px; gap: 4px 10px; }
  }
  @media (max-height: 620px) {
    .subtitle { display: none; }
    .footer { display: none; }
  }
</style>
</head>
<body>

<div class="app">

          <circle cx="15.6" cy="12" r="2.1" fill="#fff"/>
