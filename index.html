<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake Game</title>
<style>
  /* ============================================================
     基础与主题（浅色卡片 + 深色画布，形成对比）
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink:        #0f172a;
    --ink-soft:   #475569;
    --ink-faint:  #94a3b8;
    --line:       #e2e8f0;
    --card:       #ffffff;
    --brand:      #16a34a;
    --brand-2:    #22c55e;
    --accent:     #38bdf8;
    --warn:       #f59e0b;
    --danger:     #ef4444;
    --canvas-bg:  #0b1220;
    --radius:     20px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  /* 深色（夜间）主题：卡片变深、文字变浅，画布保持深色并略加深 */
  :root[data-theme="dark"] {
    --ink:        #e2e8f0;
    --ink-soft:   #cbd5e1;
    --ink-faint:  #94a3b8;
    --line:       #334155;
    --card:       #111c30;
    --brand:      #4ade80;
    --brand-2:    #22c55e;
    --accent:     #38bdf8;
    --warn:       #fbbf24;
    --danger:     #f87171;
    --canvas-bg:  #060c18;
  }
  :root[data-theme="dark"] body {
    background:
      radial-gradient(1200px 600px at 12% -10%, #0c2236 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #0a2a1c 0%, transparent 50%),
      linear-gradient(165deg, #0b1220 0%, #0a0f1a 100%);
  }
  :root[data-theme="dark"] .icon-btn:hover { background: #1e293b; color: var(--ink); }
  /* 深色主题下画布外框也变深，保持整体一致 */
  :root[data-theme="dark"] .canvas-wrap {
    background: linear-gradient(150deg, #0f1a2e, #070d18);
    box-shadow:
      0 18px 40px -12px rgba(0,0,0,.55),
      0 2px 8px rgba(0,0,0,.3);
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    height: 100%;
    overflow: hidden;           /* 小窗口下宁可裁剪，也不要出现滚动条导致画布抖动 */
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%, #e0f2fe 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #dcfce7 0%, transparent 50%),
      linear-gradient(165deg, #f8fafc 0%, #eef2f7 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 18px 16px 16px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;               /* 固定高度 -> 舞台高度由布局决定，画布尺寸变化不会反过来撑高舞台（避免 resize 死循环） */
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  /* ============================ 头部 ============================ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .logo {
    width: 38px; height: 38px;
    flex: 0 0 38px;
    border-radius: 12px;
    background: linear-gradient(140deg, var(--brand-2), #15803d);
    box-shadow: 0 6px 14px rgba(22,163,74,.28);
    display: grid; place-items: center;
  }
  .logo svg { width: 22px; height: 22px; display: block; }

  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    line-height: 1.15;
    white-space: nowrap;
  }
  .title span {
    background: linear-gradient(100deg, var(--brand), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .icon-btn {
    width: 38px; height: 38px;
    flex: 0 0 38px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 12px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .icon-btn:hover { background: #f1f5f9; color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 19px; height: 19px; display: block; }
  .icon-btn.is-off { color: var(--ink-faint); }

  /* ============================ HUD ============================ */
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex: 0 0 auto;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 12px 10px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    min-width: 0;
  }
  .stat .label {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: .6px;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    letter-spacing: -.5px;
  }
  .stat.score .value { color: var(--brand); }
  .stat.best  .value { color: var(--warn); }
  .stat.level .value { color: var(--accent); }
  .stat .value small { font-size: 12px; font-weight: 700; color: var(--ink-faint); }

  /* 生命：实心为剩余，空心为已消耗 */
  .stat.lives .value { font-size: 20px; letter-spacing: 1px; line-height: 1.35; }
  .stat.lives .life { color: var(--danger); }
  .stat.lives .life.gone { color: var(--line); }
  .stat.lives .value.low { animation: life-pulse .7s ease-in-out infinite; }
  @keyframes life-pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  .speed-track {
    margin-top: 6px;
    height: 5px;
    border-radius: 99px;
    background: #eef2f7;
    overflow: hidden;
  }
  .speed-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--brand-2));
    transition: width .25s ease;
  }
  /* 关卡指示条：放在画布外的 HUD 下方（绝对不遮挡游戏界面），居中、紧凑 */
  .stage-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    margin: -4px auto 0;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2px;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
    align-self: center;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    max-width: fit-content;
  }
  .stage-bar-l { color: var(--ink-faint); font-size: 11px; }
  .stage-bar-n { color: var(--brand); }
  .stage-bar-sep { color: var(--ink-faint); opacity: .55; }
  .stage-bar-p { color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  /* ============================ 舞台 ============================ */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 200px;          /* 画布始终小于舞台，因此不会产生"画布变大 -> 舞台变大"的循环 */
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .canvas-wrap {
    position: relative;
    line-height: 0;
    border-radius: 18px;
    padding: 7px;
    background: linear-gradient(150deg, #1e293b, #0f172a);
    box-shadow:
      0 18px 40px -12px rgba(15,23,42,.45),
      0 2px 8px rgba(15,23,42,.12);
  }

  canvas {
    display: block;
    border-radius: 12px;
    background: var(--canvas-bg);
    touch-action: none;
  }

  /* ===================== 加速/减速状态条 ===================== */
  /* 绝对定位在画布顶部中央，pointer-events:none 不抢点击；overlay 显示时它 hidden */
  .buff-bar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .3px;
    pointer-events: none;
    z-index: 3;
    backdrop-filter: blur(3px);
    animation: buff-in .18s ease;
  }
  .buff-bar[hidden] { display: none; }
  .buff-bar.gold {
    color: #fffbeb;
    background: linear-gradient(100deg, rgba(245,158,11,.92), rgba(217,119,6,.9));
    box-shadow: 0 6px 16px -6px rgba(245,158,11,.8);
  }
  .buff-bar.ice {
    color: #ecfeff;
    background: linear-gradient(100deg, rgba(34,211,238,.92), rgba(14,116,144,.9));
    box-shadow: 0 6px 16px -6px rgba(34,211,238,.8);
  }
  .buff-bar .buff-ic { font-size: 15px; line-height: 1; }
  .buff-bar .buff-tm {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    opacity: .92;
    padding-left: 5px;
    margin-left: 1px;
    border-left: 1px solid rgba(255,255,255,.4);
  }
  @keyframes buff-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* ===================== 连击条（E 轮） ===================== */
  /* 与 buff-bar 反向：这条贴画布顶部，buff-bar 贴底部，互不遮挡 */
  .combo-bar {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .3px;
    pointer-events: none;
    z-index: 3;
    backdrop-filter: blur(2px);
    color: #f5f3ff;
    background: linear-gradient(100deg, rgba(167,139,250,.5), rgba(109,40,217,.45));
    box-shadow: 0 4px 12px -6px rgba(139,92,246,.4);
    animation: buff-in .18s ease;
  }
  .combo-bar[hidden] { display: none; }
  .combo-bar.hot {
    background: linear-gradient(100deg, rgba(251,146,60,.55), rgba(217,119,6,.5));
    box-shadow: 0 4px 14px -6px rgba(249,115,22,.45);
  }
  .combo-bar .combo-ic { font-size: 14px; line-height: 1; }
  .combo-bar .combo-mul { font-variant-numeric: tabular-nums; }
  .combo-bar .combo-cnt { font-size: 11px; font-weight: 700; opacity: .8; }
  .combo-bar .combo-tm {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    opacity: .92;
    padding-left: 5px;
    margin-left: 1px;
    border-left: 1px solid rgba(255,255,255,.4);
  }

  /* ===================== 升级卡（E 轮） ===================== */
  .up-cards {
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.6cqw, 10px);
    width: 100%;
  }
  .up-card {
    appearance: none;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.2cqw, 12px);
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: #f8fafc;
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(148,163,184,.22);
    border-radius: 12px;
    padding: clamp(8px, 2.2cqw, 12px) clamp(10px, 2.6cqw, 14px);
    transition: background .15s, border-color .15s, transform .1s;
  }
  .up-card:hover { background: rgba(167,139,250,.20); border-color: rgba(167,139,250,.55); }
  .up-card:active { transform: scale(.985); }
  .up-card .up-ic {
    flex: 0 0 auto;
    width: 2.1em;
    height: 2.1em;
    display: grid;
    place-items: center;
    border-radius: 10px;
    font-size: clamp(14px, 3.4cqw, 18px);
    background: rgba(167,139,250,.22);
    border: 1px solid rgba(167,139,250,.42);
  }
  .up-card .up-body { min-width: 0; flex: 1 1 auto; }
  .up-card .up-name {
    font-size: clamp(12px, 3cqw, 15px);
    font-weight: 800;
    letter-spacing: .3px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .up-card .up-lv {
    font-size: .78em;
    font-weight: 700;
    color: #c4b5fd;
    font-variant-numeric: tabular-nums;
  }
  .up-card .up-desc {
    margin-top: 2px;
    font-size: clamp(10px, 2.5cqw, 12px);
    font-weight: 500;
    color: #cbd5e1;
    line-height: 1.45;
  }
  .up-card .up-key {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 800;
    color: #94a3b8;
    border: 1px solid rgba(148,163,184,.35);
    border-radius: 6px;
    padding: 2px 5px;
    line-height: 1.2;
  }

  /* ===================== 模式选择（G 轮） ===================== */
  .modes {
    display: flex;
    gap: clamp(5px, 1.2cqw, 8px);
    width: 100%;
  }
  .mode-card {
    flex: 1 1 0;
    min-width: 0;
    appearance: none;
    cursor: pointer;
    font-family: inherit;
    color: #cbd5e1;
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(148,163,184,.22);
    border-radius: 12px;
    padding: clamp(7px, 1.8cqw, 11px) clamp(4px, 1cqw, 8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .mode-card:hover { background: rgba(148,163,184,.18); }
  .mode-card:active { transform: scale(.97); }
  .mode-card.on {
    background: rgba(74,222,128,.18);
    border-color: rgba(74,222,128,.55);
    color: #bbf7d0;
  }
  .mode-card .mi { font-size: clamp(13px, 3.2cqw, 17px); line-height: 1; }
  .mode-card .mn { font-size: clamp(11px, 2.8cqw, 13px); font-weight: 800; letter-spacing: .5px; }
  .mode-card .md {
    font-size: clamp(9px, 2.1cqw, 11px);
    font-weight: 500;
    color: #94a3b8;
    line-height: 1.35;
    text-align: center;
  }

  /* ===================== 皮肤选择（G 轮） ===================== */
  .skins {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6cqw, 10px);
    flex-wrap: wrap;
  }
  .skin-dot {
    appearance: none;
    cursor: pointer;
    padding: 0;
    width: clamp(22px, 5.4cqw, 30px);
    height: clamp(22px, 5.4cqw, 30px);
    border-radius: 50%;
    border: 2px solid rgba(148,163,184,.35);
    position: relative;
    transition: transform .12s, box-shadow .15s, border-color .15s;
  }
  .skin-dot i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--s1), var(--s3));
  }
  .skin-dot.on {
    border-color: #fde68a;
    box-shadow: 0 0 0 2px rgba(253,230,138,.32);
    transform: scale(1.1);
  }
  .skin-dot.locked { cursor: not-allowed; opacity: .5; }
  .skin-dot.locked i { filter: grayscale(1) brightness(.7); }
  .skin-dot.locked::after {
    content: '×';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(11px, 2.8cqw, 14px);
    font-weight: 800;
    color: #e2e8f0;
  }

  /* ===================== 档案条（G 轮） ===================== */
  .profile {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px 8px;
    margin: 2px 0 6px;
    font-size: clamp(10px, 2.5cqw, 12px);
    color: #94a3b8;
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
  }
  .profile .pf-item { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
  .profile b { color: #e2e8f0; font-weight: 800; }
  .profile .pf-sep { opacity: .45; padding: 0 2px; }
  .skins { margin: 6px 0; }

  /* ============================ 遮罩层 ============================
     关键：所有遮罩模板都使用正常文档流 flex 列布局，间距交给 gap，
     字号/间距使用 cqw（容器查询宽度单位）随画布宽度优雅缩放，
     避免绝对定位 + 硬编码 px 导致的内容重叠。
     ============================================================== */
  .overlay {
    position: absolute;
    inset: 7px;
    border-radius: 12px;
    /* 完全不透明深底：让 canvas 上的飘字/HUD 颜色不会透出与面板叠在一起 */
    background: rgb(8, 15, 31);
    display: flex;
    justify-content: center;
    align-items: safe center;   /* 内容超出时不裁顶，可滚到顶，避免被遮挡 */
    padding: clamp(8px, 2.2cqw, 18px);
    cursor: pointer;
    text-align: center;
    animation: fade .18s ease;
    container-type: inline-size;
    overflow-y: auto;            /* G 轮：开始屏多了模式/皮肤/档案，小屏可滚动 */
    scrollbar-width: none;       /* Firefox：主页隐藏滚动条，干净不抖 */
  }
  .overlay::-webkit-scrollbar { display: none; }  /* Chrome/Safari/Edge：同上 */
  .overlay[hidden] { display: none; }

  /* ============================ 玩法指引弹窗 ============================ */
  .guide-modal {
    position: absolute;
    inset: 7px;
    border-radius: 12px;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: safe center;
    padding: clamp(8px, 2.2cqw, 18px);
    container-type: inline-size;
    animation: fade .18s ease;
  }
  .guide-modal[hidden] { display: none; }
  .guide-backdrop {
    position: absolute;
    inset: 0;
    background: rgb(8, 15, 31);
    border-radius: 12px;
  }
  .guide-panel {
    position: relative;
    width: 100%;
    max-width: min(94cqw, 380px);
    max-height: 100%;
    min-height: 0;
    box-sizing: border-box;
    background: rgb(15, 23, 42);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 14px;
    padding: clamp(14px, 3.5cqw, 22px);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2.4cqw, 14px);
    text-align: left;
    animation: pop .22s ease;
    overflow-y: auto;
  }
  .guide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .guide-panel h3 {
    margin: 0;
    font-size: clamp(18px, 5cqw, 26px);
    color: #f8fafc;
    flex: 1;
  }
  .guide-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(148,163,184,0.15);
    color: #e2e8f0;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease;
    flex-shrink: 0;
  }
  .guide-close:hover { background: rgba(148,163,184,0.30); }
  .guide-body {
    color: #cbd5e1;
    font-size: clamp(12px, 3cqw, 15px);
    line-height: 1.7;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;             /* 内容过长时 body 自身滚动，标题与「知道了」始终可见 */
  }
  .guide-body p { margin: 0 0 0.55em; }
  .guide-body p:last-child { margin-bottom: 0; }
  .guide-body b { color: #f8fafc; }
  .guide-body ul { margin: 0; padding-left: 1.2em; }
  .guide-body li { margin-bottom: 0.35em; }
  .guide-panel .btn { align-self: center; margin-top: 4px; flex-shrink: 0; }

  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pop  { from { opacity: 0; transform: translateY(8px) scale(.97) }
                    to   { opacity: 1; transform: none } }

  .panel {
    color: #f8fafc;
    width: 100%;
    max-width: min(94cqw, 360px);
    height: 100%;                /* 占满遮罩可用高度，内容通过 flex 分配空间 */
    min-height: 0;               /* flex 子项可被压缩，避免最小高度撑破遮罩 */
    overflow-y: auto;            /* 保险：极端情况仍可滚动，但正常 flex 分配下不应出现 */
    scrollbar-width: none;       /* Firefox：主页面板隐藏滚动条 */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2cqw, 14px);
    animation: pop .22s ease;
  }
  .panel::-webkit-scrollbar { display: none; }  /* Chrome/Safari/Edge：同上 */

  .tag {
    display: inline-block;
    font-size: clamp(10px, 2.4cqw, 12px);
    font-weight: 700;
    letter-spacing: 1.2px;
    padding: 0.35em 0.9em;
    border-radius: 99px;
    background: rgba(56,189,248,.16);
    color: #7dd3fc;
    border: 1px solid rgba(56,189,248,.32);
  }
  .tag.green { background: rgba(34,197,94,.16);  color: #86efac; border-color: rgba(34,197,94,.34); }
  .tag.amber { background: rgba(245,158,11,.18); color: #fcd34d; border-color: rgba(245,158,11,.36); }

  .panel h2 {
    margin: 0;
    font-size: clamp(24px, 7cqw, 40px);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .panel .desc {
    font-size: clamp(12px, 3cqw, 15px);
    line-height: 1.6;
    color: #cbd5e1;
    margin: 0;
  }
  .panel .desc b { color: #f8fafc; font-size: 1.15em; font-variant-numeric: tabular-nums; }

  /* 开始屏紧凑布局：元素多，减少垂直占用避免滚动 */
  .panel:has(.modes) { justify-content: center; gap: clamp(6px, 1.6cqw, 10px); }
  .panel:has(.modes) h2 { font-size: clamp(22px, 6cqw, 36px); }
  .panel:has(.modes) .guide-trigger { margin-top: 0; }
  .panel:has(.modes) .mode-card { padding: clamp(6px, 1.4cqw, 9px) clamp(4px, 1cqw, 8px); gap: 2px; }
  .panel:has(.modes) .skins { margin: 2px 0; gap: clamp(5px, 1.4cqw, 8px); }
  .panel:has(.modes) .skin-dot {
    width: clamp(20px, 4.8cqw, 27px);
    height: clamp(20px, 4.8cqw, 27px);
  }
  .panel:has(.modes) .profile { margin: 0; line-height: 1.25; }
  .panel:has(.modes) .btn-row { gap: clamp(6px, 1.6cqw, 10px); width: 100%; }
  .panel:has(.modes) .btn-row .btn { padding: 0.55em 0.6em; font-size: clamp(12px, 3cqw, 15px); }
  .panel:has(.modes) .hint { margin-top: 0; font-size: clamp(10px, 2.4cqw, 12px); }

  .scores {
    display: flex;
    justify-content: center;
    gap: clamp(6px, 1.8cqw, 12px);
    width: 100%;
  }
  .scores .box {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(148,163,184,.12);
    border: 1px solid rgba(148,163,184,.2);
    border-radius: 12px;
    padding: clamp(8px, 2cqw, 12px) clamp(6px, 1.5cqw, 10px);
  }
  .scores .box .k { font-size: clamp(10px, 2.2cqw, 12px); color: #94a3b8; letter-spacing: .5px; }
  .scores .box .v {
    font-size: clamp(18px, 4.8cqw, 28px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin-top: 0.15em;
  }
  .scores .box.cur .v { color: #4ade80; }
  .scores .box.bst .v { color: #fbbf24; }

  .record-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: clamp(11px, 2.6cqw, 13px);
    font-weight: 800; letter-spacing: .5px;
    color: #78350f;
    background: linear-gradient(100deg, #fde68a, #fbbf24);
    border-radius: 99px;
    padding: 0.4em 1em;
    box-shadow: 0 6px 16px -6px rgba(245,158,11,.8);
    animation: record-pulse 1.4s ease-in-out infinite;
  }
  @keyframes record-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 6px 16px -6px rgba(245,158,11,.8); }
    50%      { transform: scale(1.06); box-shadow: 0 8px 22px -6px rgba(245,158,11,1); }
  }

  /* ====================== GameOver 排名徽章 ====================== */
  .rank-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: clamp(13px, 3.2cqw, 16px);
    font-weight: 800; letter-spacing: .5px;
    padding: 0.35em 0.85em 0.35em 0.45em;
    border-radius: 99px;
    background: rgba(148,163,184,.15);
    border: 1px solid rgba(148,163,184,.32);
    color: #e2e8f0;
  }
  .rank-badge .medal {
    display: inline-grid; place-items: center;
    width: 1.6em; height: 1.6em;
    border-radius: 50%;
    font-size: 0.95em;
    font-weight: 800;
    background: rgba(148,163,184,.25);
    color: #f8fafc;
  }
  .rank-badge.gold   { background: linear-gradient(100deg, rgba(253,224,71,.22), rgba(245,158,11,.18)); border-color: rgba(253,224,71,.55); color: #fde68a; }
  .rank-badge.gold   .medal { background: linear-gradient(140deg, #fde68a, #f59e0b); color: #7c2d12; }
  .rank-badge.silver { background: linear-gradient(100deg, rgba(226,232,240,.22), rgba(148,163,184,.18)); border-color: rgba(226,232,240,.45); color: #e2e8f0; }
  .rank-badge.silver .medal { background: linear-gradient(140deg, #f1f5f9, #94a3b8); color: #0f172a; }
  .rank-badge.bronze { background: linear-gradient(100deg, rgba(217,119,6,.22), rgba(180,83,9,.18)); border-color: rgba(217,119,6,.5); color: #fdba74; }
  .rank-badge.bronze .medal { background: linear-gradient(140deg, #fdba74, #b45309); color: #431407; }
  .rank-badge .rank-num { font-variant-numeric: tabular-nums; }

  /* ====================== GameOver 四格统计（2×2） ====================== */
  .go-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(6px, 1.6cqw, 10px);
    width: 100%;
  }
  .go-stats .cell {
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(148,163,184,.18);
    border-radius: 12px;
    padding: clamp(5px, 1.4cqw, 8px) clamp(6px, 1.5cqw, 10px);
    min-width: 0;
    min-height: 50px;             /* 紧凑：保证四格统一高度，不被 k/v 挤压 */
    display: flex;
    flex-direction: column;
    justify-content: center;     /* k/v 上下分别上下两端对齐, 中间留出空隙 */
    align-items: stretch;
    text-align: center;
    overflow-wrap: anywhere;     /* 中文/超长文本可断字不断字 */
  }
  .go-stats .k {
    font-size: clamp(9px, 2.2cqw, 11px);
    color: #94a3b8;
    letter-spacing: .4px;
    white-space: nowrap;
    line-height: 1.2;
    text-align: center;
  }
  .go-stats .v {
    font-size: clamp(14px, 3.6cqw, 20px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;             /* 显式间距, 杜绝 k 与 v 紧贴 */
    line-height: 1.1;
    color: #f8fafc;
    text-align: center;
  }
  .go-stats .cell.score .v { color: #4ade80; }
  .go-stats .cell.combo .v { color: #c4b5fd; }
  .go-stats .cell.len   .v { color: #38bdf8; }
  .go-stats .cell.speed .v { color: #fbbf24; font-size: clamp(12px, 3.2cqw, 18px); }
  .go-stats .cell.speed .v small { font-size: 0.6em; color: #cbd5e1; font-weight: 700; margin-left: 2px; }

  /* ====================== GameOver 分享码块（防遮挡 / 清晰可复制） ====================== */
  .share-block {
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.6cqw, 10px);
    width: 100%;
    margin: 0;
  }
  .share-label {
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #94a3b8;
    text-align: center;
    line-height: 1.3;
  }
  .share-code {
    font-family: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: clamp(11px, 2.8cqw, 14px);
    font-weight: 700;
    color: #fde68a;
    background: rgba(253, 230, 138, 0.10);
    border: 1px dashed rgba(253, 230, 138, 0.45);
    border-radius: 10px;
    padding: clamp(6px, 1.6cqw, 9px) clamp(8px, 2cqw, 12px);
    text-align: center;
    line-height: 1.35;
    word-break: break-all;
    min-height: 0;
  }
  .share-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(6px, 1.6cqw, 10px);
    width: 100%;
  }
  .share-actions .btn { flex: 1 1 0; min-width: 0; padding: 0.55em 1em; }
  .share-actions .btn.ghost { white-space: nowrap; }

  /* GAME OVER 三个主要操作按钮并为一行 */
  .go-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(6px, 1.6cqw, 10px);
    width: 100%;
  }
  .go-actions .btn {
    flex: 1 1 0;
    min-width: 0;
    padding: 0.65em 0.8em;
    white-space: nowrap;
    font-size: clamp(12px, 3cqw, 15px);
  }

  /* ====================== I 轮：元进度天赋树 ====================== */
  .stardust-balance {
    font-size: clamp(12px, 3cqw, 14px);
    color: #fde68a;
    text-align: center;
    margin: 0;
  }
  .stardust-balance b { color: #fde68a; }
  .stardust-balance.big { font-size: clamp(13px, 3.4cqw, 16px); }
  .stardust-earn {
    font-size: clamp(12px, 3cqw, 14px);
    color: #cbd5e1;
    text-align: center;
    margin: 0;
  }
  .stardust-earn b { color: #fde68a; }
  .talent-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .talent-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(148,163,184,0.10);
    margin-bottom: 0;
  }
  .talent-list li.maxed { background: rgba(253,230,138,0.12); }
  .talent-ic {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 50%;
    background: rgba(74,222,128,0.14);
    margin-top: 1px;
  }
  .talent-main {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-right: 4px;
  }
  .talent-name { font-size: 15px; font-weight: 800; color: #f8fafc; line-height: 1.25; }
  .talent-pips { color: #fde68a; letter-spacing: 1px; margin-left: 5px; font-size: 0.85em; white-space: nowrap; }
  .talent-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
  .btn.talent-up {
    flex: 0 0 auto;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 58px;
    padding: 7px 10px;
    font-size: 12px;
    line-height: 1.1;
    border-radius: 10px;
  }
  .btn.talent-up .talent-cost { font-size: 13px; font-weight: 800; color: #fde68a; }
  .btn.talent-up.is-disabled { opacity: 0.45; cursor: not-allowed; }

  /* ====================== J 轮：每日挑战 + 每日榜 ====================== */
  .daily-mods {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }
  .daily-mod {
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #cbd5e1;
    background: rgba(56,189,248,0.12);
    border: 1px solid rgba(56,189,248,0.35);
    border-radius: 99px;
    padding: 4px 10px;
    line-height: 1.3;
    text-align: center;        /* 防遮挡：长描述可换行，绝不 nowrap 溢出面板 */
  }
  .daily-earn {
    font-size: clamp(12px, 3cqw, 14px);
    color: #7dd3fc;
    text-align: center;
    margin: 0;
  }
  .daily-earn b { color: #7dd3fc; }

  /* GAME OVER 面板元素多，进一步压缩间距避免底部被裁（:has 现代浏览器支持） */
  .panel:has(.go-stats) { gap: clamp(6px, 1.6cqw, 10px); }
  .panel:has(.go-stats) h2 { font-size: clamp(20px, 5.5cqw, 32px); }

  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    font-size: clamp(14px, 3.5cqw, 16px);
    font-weight: 800;
    letter-spacing: .6px;
    color: #052e16;
    background: linear-gradient(140deg, #4ade80, #16a34a);
    padding: 0.75em 1.8em;
    border-radius: 99px;
    box-shadow: 0 10px 22px -8px rgba(22,163,74,.75);
    transition: transform .1s, filter .15s;
  }
  .btn:hover  { filter: brightness(1.05); }
  .btn:active { transform: scale(.96); }
  .btn.ghost {
    background: rgba(148,163,184,0.18);
    color: #cbd5e1;
    box-shadow: none;
  }
  .btn.ghost:hover { background: rgba(148,163,184,0.28); }
  .btn.guide-trigger {
    font-size: clamp(11px, 2.6cqw, 13px);
    padding: 0.45em 0.95em;
    margin-top: -2px;             /* 与标题间距更紧凑 */
  }

  /* 开始屏底部三个入口：排行榜 / 成就 / 好友榜 并排 */
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 2cqw, 12px);
    width: 100%;
  }
  .btn-row .btn {
    flex: 1 1 0;
    min-width: 88px;
    padding-left: 0.6em;
    padding-right: 0.6em;
  }

  .panel .hint {
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #94a3b8;
    letter-spacing: .3px;
    margin: 0;
  }

  /* ============================ 排行榜 ============================ */
  .leaderboard {
    width: 100%;
    text-align: left;
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;              /* 排行榜/好友榜：占满 panel 剩余高度 */
    min-height: 0;
    overflow: hidden;
  }
  .lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(6px, 1.5cqw, 10px);
    font-size: clamp(12px, 2.8cqw, 14px);
    font-weight: 800;
    color: #e2e8f0;
    margin-bottom: clamp(6px, 1.5cqw, 10px);
  }
  .lb-header span {
    min-width: 0;                 /* 可被压缩，不撑破头部 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;      /* 空间不足时省略，保证右侧按钮完整 */
  }
  .lb-header button { flex-shrink: 0; }
  .lb-list {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    flex: 1 1 auto;              /* 列表占满 leaderboard 剩余高度，不再固定 40vh */
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(148,163,184,.4) transparent;
  }
  .lb-list::-webkit-scrollbar { width: 6px; }
  .lb-list::-webkit-scrollbar-track { background: transparent; }
  .lb-list::-webkit-scrollbar-thumb {
    background: rgba(148,163,184,.35);
    border-radius: 99px;
  }
  .lb-list li {
    display: grid;
    grid-template-columns: 1.7em 1fr auto auto;
    align-items: center;
    gap: 6px;
    font-size: clamp(11px, 2.6cqw, 13px);
    padding: clamp(6px, 1.6cqw, 10px) clamp(8px, 2cqw, 12px);
    border-radius: 10px;
    margin-bottom: 2px;
    transition: background .15s;
  }
  .lb-list li:nth-child(odd) { background: rgba(248,250,252,0.05); }
  .lb-list li.is-self {
    background: linear-gradient(90deg, rgba(74,222,128,.18), rgba(56,189,248,.12)) !important;
    border: 1px solid rgba(74,222,128,.45);
    box-shadow: 0 0 0 1px rgba(74,222,128,.15) inset;
  }
  .lb-list .lb-ranknum {
    color: #94a3b8;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .lb-list li.is-top1 .lb-ranknum,
  .lb-list li.is-top2 .lb-ranknum,
  .lb-list li.is-top3 .lb-ranknum {
    width: 1.6em; height: 1.6em;
    display: inline-grid; place-items: center;
    border-radius: 50%;
    font-size: 0.95em;
    line-height: 1;
  }
  .lb-list li.is-top1 .lb-ranknum { background: linear-gradient(140deg, #fde68a, #f59e0b); color: #7c2d12; box-shadow: 0 2px 6px -1px rgba(245,158,11,.5); }
  .lb-list li.is-top2 .lb-ranknum { background: linear-gradient(140deg, #f1f5f9, #94a3b8); color: #0f172a; box-shadow: 0 2px 6px -1px rgba(148,163,184,.5); }
  .lb-list li.is-top3 .lb-ranknum { background: linear-gradient(140deg, #fdba74, #b45309); color: #431407; box-shadow: 0 2px 6px -1px rgba(217,119,6,.5); }
  .lb-list .lb-name {
    color: #f8fafc;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 700;
  }
  .lb-list li.is-self .lb-name::after {
    content: '你';
    margin-left: 6px;
    font-size: 0.75em;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    background: rgba(74,222,128,.25);
    color: #86efac;
    border: 1px solid rgba(74,222,128,.4);
  }
  .lb-list .lb-score {
    color: #fbbf24;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .lb-list .lb-meta {
    color: #94a3b8;
    font-size: 0.85em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* 排行榜：名字、分数、日期/时长/模式分两层，确保 10 字符名字完整展示 */
  .lb-list.leaderboard-list li {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: stretch;
  }
  .lb-list.leaderboard-list .lb-main {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .lb-list.leaderboard-list .lb-ranknum {
    flex: 0 0 1.7em;
    text-align: center;
  }
  .lb-list.leaderboard-list .lb-name {
    flex: 1 1 0%;
    min-width: 0;
    width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-list.leaderboard-list .lb-score {
    flex: 0 0 auto;
    text-align: right;
  }
  .lb-list.leaderboard-list .lb-meta-row {
    display: flex;
    justify-content: flex-start;
    min-width: 0;
  }
  .lb-list.leaderboard-list .lb-meta-row .lb-meta {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-empty {
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #94a3b8;
    text-align: center;
    padding: clamp(8px, 2cqw, 12px) 0;
  }

  /* G 轮：成就面板 */
  .ach-wrap { width: 100%; text-align: left; }
  .ach-progress {
    margin-bottom: clamp(10px, 2.5cqw, 16px);
  }
  .ach-progress-bar {
    width: 100%;
    height: clamp(8px, 1.6cqw, 12px);
    background: rgba(148,163,184,0.18);
    border-radius: 99px;
    overflow: hidden;
  }
  .ach-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #fde68a);
    border-radius: 99px;
    transition: width .4s ease;
  }
  .ach-progress-text {
    margin-top: 6px;
    font-size: clamp(11px, 2.6cqw, 13px);
    color: #94a3b8;
  }
  .ach-progress-text b { color: #fde68a; font-weight: 800; }
  .ach-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: clamp(6px, 1.8cqw, 12px);
    width: 100%;
    max-height: 42vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(148,163,184,.4) transparent;
  }
  .ach-card {
    border-radius: 12px;
    padding: clamp(8px, 2cqw, 12px);
    border: 1px solid rgba(148,163,184,0.2);
    background: rgba(248,250,252,0.05);
    transition: transform .15s, border-color .15s;
  }
  .ach-card.unlocked {
    border-color: rgba(250,204,21,0.5);
    background: linear-gradient(160deg, rgba(250,204,21,0.16), rgba(250,204,21,0.05));
    box-shadow: 0 0 0 1px rgba(250,204,21,0.15) inset;
  }
  .ach-card.locked { opacity: 0.78; }
  .ach-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .ach-star { font-size: 1.1em; color: #fbbf24; }
  .ach-card.locked .ach-star { color: #64748b; }
  .ach-name { font-weight: 800; font-size: clamp(13px, 3cqw, 15px); color: #f8fafc; }
  .ach-desc {
    font-size: clamp(11px, 2.5cqw, 13px);
    color: #cbd5e1;
    margin-bottom: 4px;
  }
  .ach-cond {
    font-size: clamp(10px, 2.3cqw, 12px);
    color: #94a3b8;
    line-height: 1.45;
  }
  .ach-skin {

  kbd {

  /* ============================ 响应式 ============================ */

<body>

<div class="app">

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 1. 配置
   * ========================================================== */
  const Config = {
    COLS: 24,                 // 棋盘列数
    ROWS: 24,                 // 棋盘行数（与列数相等，保证画布为正方形）
    START_LEN: 3,             // 初始蛇长

    TPS_PER_LEVEL: 0.9,       // 每提升一个等级增加的格/秒（降低难度，升级更平缓）
    SCORE_PER_FOOD: 10,       // 每颗食物得分
    SCORE_PER_LEVEL: 100,     // 每 100 分（10 颗食物）提升一个速度等级
    MAX_QUEUED_DIRS: 3,       // 方向缓冲队列最大长度
    MAX_STEPS_PER_FRAME: 4,   // 单帧最多补算的 tick 数，防止卡顿后瞬移
    STORAGE_BEST: 'snake-game.best.v1',
    STORAGE_MUTED: 'snake-game.muted.v1',
    STORAGE_THEME: 'snake-game.theme.v1',
    STORAGE_LEADERBOARD: 'snake-leaderboard',
    LEADERBOARD_MAX: 10,      // 排行榜最多保留条数

    /* ---- C 轮：特殊食物（P1 体验增强）---- */
    SPECIAL_GOLD_ADD: 4,      // 金蛇果：临时加速 +4 格/秒
    SPECIAL_GOLD_TIME: 5,     // 金蛇果 buff 持续 5 秒
    SPECIAL_GOLD_TTL: 8,      // 金蛇果在场上停留 8 秒（不吃则消失）
    SPECIAL_ICE_ADD: 3,       // 冰冻果：临时减速 3 格/秒（存为 add 负值）
    SPECIAL_ICE_TIME: 4,      // 冰冻果 buff 持续 4 秒
    SPECIAL_ICE_TTL: 8,       // 冰冻果在场上停留 8 秒
    SPECIAL_BONUS_SCORE: 25,  // 限时奖励：吃到额外 +25 分
    SPECIAL_BONUS_TIME: 6,    // 限时奖励在场上停留 6 秒（不吃则消失）
    SPECIAL_MIN_TPS: 3,       // 减速下限（不低于此速度，保持可玩）
    SPECIAL_SPAWN_INTERVAL: 9000, // 平均每 9 秒尝试自动生成一个特殊食物

    /* ---- D 轮：关卡 / 障碍 / Boss 蛇（P1 体验增强）---- */
    TOTAL_STAGES: 6,         // 通关所需关卡数（清空第 6 关 = 胜利）
    STAGE_BASE_TARGET: 4,    // 第 1 关需吃到的食物数
    STAGE_TARGET_STEP: 2,    // 每关递增的食物目标（第 N 关 = 4 + (N-1)*2）
    OBSTACLE_STEP: 3,        // 每升一关新增的障碍物数量（第 1 关无障碍，第 2 关起出现）
    BOSS_FIRST_STAGE: 3,     // Boss 蛇首次出现的关卡
    BOSS_EVERY: 3,           // 之后每隔几关再来一次（3、6…）
    BOSS_LEN: 7,             // Boss 蛇初始长度
    BOSS_SPEED_TPS: 4,       // Boss 蛇移动速度（格/秒，独立于玩家）
    GROW_PER_STAGE: 2,       // 每过一关蛇身增长的节数（吃普通食物不变长，升级才变长）

    /* ---- E 轮：生命值 / Combo 连击 / 过关三选一 ---- */
    START_LIVES: 3,          // 初始生命（撞毁只扣 1 点，扣光才结束）
    MAX_LIVES: 6,            // 生命上限（防止「强心」无限叠）
    HIT_INVINCIBLE: 1.2,     // 受击后无敌秒数（期间穿透一切，不重复扣血）
    HIT_SHRINK: 2,           // 受击后蛇身收缩节数（给玩家喘息空间）
    COMBO_WINDOW: 8,         // 连击窗口秒数（超时未再进食则清零）
    COMBO_STEP: 0.1,         // 每层连击加成（第 N 层 = 1 + (N-1) × 0.1）
    COMBO_MAX_MUL: 3,        // 连击倍率上限
    SHIELD_TIME: 6,          // 护盾果提供的免伤秒数
    SHIELD_TTL: 8,           // 护盾果在场上停留秒数
    CALM_TPS: 0.8,           // 「稳如老狗」每层降低的基础速度（格/秒）

    /* ---- F 轮：Boss 进化（血条 / 多形态 / 毒区地形）---- */
    BOSS_HP_BASE: 3,         // Boss 基础血量（撞中尾巴扣 1 点）
    BOSS_HP_STEP: 1,         // 每往后一个 Boss 关，血量 +1
    BOSS_KILL_SCORE: 60,     // 击破一条 Boss 的得分（吃贪婪倍率）
    BOSS_HIT_FLASH: 0.35,    // Boss 被击中后的闪白时长（秒）
    BOSS_DASH_INTERVAL: 3.2, // 冲刺型：两次冲刺之间的间隔（秒）
    BOSS_DASH_WARN: 0.45,    // 冲刺前的预警时长（锁定方向、身体发亮）
    BOSS_DASH_TIME: 0.85,    // 冲刺持续时长（秒）
    BOSS_DASH_MUL: 2.4,      // 冲刺期间的速度倍率
    BOSS_SPLIT_COUNT: 2,     // 分裂者被击破后分裂出的小蛇数量
    BOSS_SPLIT_LEN: 4,       // 分裂体长度（节）
    BOSS_SPLIT_HP: 1,        // 分裂体血量
    HAZARD_COUNT: 3,         // Boss 关的毒区数量
    HAZARD_SIZE: 2,          // 毒区边长（格）
    HAZARD_DRIFT: 5,         // 毒区每隔几秒漂移一格

    /* ---- G 轮：模式 / 成就 / 皮肤 / 统计 ---- */
    TIME_ATTACK_SEC: 60,     // 限时模式的时长（秒）
    GROW_EVERY: 1,           // 无尽 / 限时：每吃几颗增长 1 节（闯关模式固定不变长）
    UPGRADE_EVERY_LEVEL: 3,  // 无尽模式：每升几级弹一次升级卡
    ACH_TOAST_TIME: 3.2,     // 成就提示停留秒数
    STORAGE_STATS: 'snake-stats.v1',
    STORAGE_ACH: 'snake-achievements.v1',
    STORAGE_SKIN: 'snake-skin.v1',

    /* ---- H 轮：社交分享（零后端） ---- */
    STORAGE_FRIENDS: 'snake-friends.v1',
    SHARE_PREFIX: 'SNK1-',
    SHARE_VERSION: 1,
    FRIENDS_MAX: 50,

    /* ---- I 轮：元进度天赋树（跨局永久成长） ---- */
    STORAGE_META: 'snake-meta.v1',

    /* ---- J 轮：每日挑战 + 每日榜（公平同图 · 连续打卡） ---- */
    STORAGE_DAILY: 'snake-daily.v1',            // { 'YYYY-MM-DD': [ {name,score,duration,date,mode} ] }
    STORAGE_DAILY_STREAK: 'snake-daily-streak.v1', // { lastDate, count }
    DAILY_MAX: 10,                             // 每日榜最多保留条数
    DAILY_MOD_COUNT: 2,                       // 每天生效的 modifier 数量
    DAILY_STREAK_BONUS_STEP: 0.1,             // 每连续打卡一天，星屑 +10%
    DAILY_STREAK_BONUS_CAP: 0.5               // 连续打卡星屑加成上限（+50%）
  };

  /**
   * E 轮：过关三选一的升级卡池。
   * - max：可叠加次数（heal 用 available 做动态门槛，不设上限）
   * - available：是否进入候选池（满血时不抽到急救包）
   * - apply：直接改 Game 字段，由 Game.applyUpgrade 统一调用
   */
  const UPGRADES = [
    {
      id: 'heart', icon: '♥', name: '强心', desc: '生命上限 +1，并立即回复 1 点', max: 3,
      apply: function (g) {
        g.maxLives = Math.min(Config.MAX_LIVES, g.maxLives + 1);
        if (g.lives < g.maxLives) g.lives++;
      }
    },
    {
      id: 'combo', icon: '⚡', name: '连击大师', desc: '连击窗口 +2 秒，更容易续上', max: 3,
      apply: function (g) { g.comboWindow += 2; }
    },
    {
      id: 'greed', icon: '★', name: '贪婪', desc: '所有得分 +15%', max: 3,
      apply: function (g) { g.scoreMul += 0.15; }
    },
    {
      id: 'shield', icon: '◈', name: '护盾果', desc: '特殊食物加入护盾果，吃到获 6 秒免伤', max: 2,
      available: function (g) { return g.shieldLevel < 2 && !g.dailyNoShield; },
      apply: function (g) { g.shieldLevel++; }
    },
    {
      id: 'calm', icon: '❄', name: '稳如老狗', desc: '基础速度 −0.8 格/秒', max: 3,
      apply: function (g) { g.calmLevel++; }
    },
    {
      id: 'heal', icon: '✚', name: '急救包', desc: '立即回复 1 点生命', max: 99,
      available: function (g) { return g.lives < g.maxLives; },
      apply: function (g) { if (g.lives < g.maxLives) g.lives++; }
    }
  ];

  /**
   * I 轮：元进度天赋树。
   * - 每局结算获得 ✨星屑（跨局货币），用于在开始屏解锁永久天赋。
   * - TALENTS 是天赋定义（id / 图标 / 名称 / 描述 / 最大等级 / 各级花费）。
   * - Meta 负责读写 localStorage（键 Config.STORAGE_META），并暴露各天赋的「效果 getter」；
   *   等级为 0 时所有 getter 返回恒等值，保证未解锁时与旧行为完全一致（现有测试不受影响）。
   */
  const TALENTS = [
    { id: 'startLife',   icon: '♥', name: '强身',       desc: '初始生命 +1（最多 +2）',               max: 2, cost: [20, 45] },
    { id: 'scoreBonus',  icon: '★', name: '贪婪之魂',   desc: '全局得分 +5%（最多 +15%）',             max: 3, cost: [15, 30, 55] },
    { id: 'comboWindow', icon: '⚡', name: '连击感知',   desc: '连击窗口 +1 秒（最多 +3 秒）',         max: 3, cost: [12, 25, 45] },
    { id: 'specialFreq', icon: '🍀', name: '幸运星',     desc: '特殊食物更频繁（间隔 -20%，最多 -60%）', max: 3, cost: [15, 30, 55] },
    { id: 'calmBase',    icon: '❄', name: '稳健',       desc: '基础速度 -0.8 格/秒（最多 -1.6）',     max: 2, cost: [20, 45] },
    { id: 'startLen',    icon: '🐍', name: '长蛇',       desc: '起步蛇身 +1 节（最多 +2 节）',         max: 2, cost: [18, 40] }
  ];

  const Meta = {
    KEY: Config.STORAGE_META,

    /** 默认数据：星屑 0、所有天赋 0 级 */
    _default: function () {
      const t = {};
      for (let i = 0; i < TALENTS.length; i++) t[TALENTS[i].id] = 0;
      return { stardust: 0, talents: t };
    },

    /** 从 localStorage 读取并归一（脏数据/隐私模式一律兜底为默认） */
    load: function () {
      let data = this._default();
      try {
        const raw = Storage.get(this.KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (typeof parsed.stardust === 'number' && isFinite(parsed.stardust)) {
              data.stardust = Math.max(0, Math.floor(parsed.stardust));
            }
            if (parsed.talents && typeof parsed.talents === 'object') {
              for (let i = 0; i < TALENTS.length; i++) {
                const id = TALENTS[i].id;
                const v = parsed.talents[id];
                if (typeof v === 'number' && isFinite(v)) {
                  data.talents[id] = Math.max(0, Math.min(TALENTS[i].max, Math.floor(v)));
                }
              }
            }
          }
        }
      } catch (e) { data = this._default(); }
      this._cache = data;
      return data;
    },

    /** 始终从 Storage 重新读取（避免跨测试/跨局脏缓存） */
    data: function () { return this.load(); },

    defs: function () { return TALENTS; },

    _def: function (id) {
      for (let i = 0; i < TALENTS.length; i++) if (TALENTS[i].id === id) return TALENTS[i];
      return null;
    },

    stardust: function () { return this.data().stardust; },
    rank: function (id) { return this.data().talents[id] || 0; },

    maxed: function (id) {
      const def = this._def(id);
      return def ? this.rank(id) >= def.max : true;
    },

    /** 下一级花费；已满级返回 null */
    cost: function (id) {
      const def = this._def(id);
      if (!def) return null;
      const r = this.rank(id);
      if (r >= def.max) return null;
      return def.cost[r];
    },

    canUpgrade: function (id) {
      const c = this.cost(id);
      return c !== null && this.stardust() >= c;
    },

    upgrade: function (id) {
      const c = this.cost(id);
      if (c === null) return false;
      if (this.stardust() < c) return false;
      const d = this.data();
      d.stardust -= c;
      d.talents[id] = (d.talents[id] || 0) + 1;
      this.save(d);
      return true;
    },

    addStardust: function (n) {
      const d = this.data();
      d.stardust = Math.max(0, d.stardust + Math.floor(n || 0));
      this.save(d);
      return d.stardust;
    },

    save: function (d) {
      try { Storage.set(this.KEY, JSON.stringify(d)); } catch (e) { /* 隐私模式静默降级 */ }
    },

    /** 本局应得星屑：得分/20 + 最高连击×2 + 击破Boss×5 + 通关+30 + 新纪录+15 */
    earnedFor: function (g) {
      let n = Math.floor((g.score || 0) / 20);
      n += (g.comboBest || 0) * 2;
      n += (g.runBossKills || 0) * 5;
      if (g.win) n += 30;
      if (g.isRecord) n += 15;
      return Math.max(0, Math.floor(n));
    },

    /* ---- 效果 getter：等级 0 时恒等 ---- */
    startLivesBonus:   function () { return this.rank('startLife'); },             // +1 / 级
    scoreBonus:        function () { return this.rank('scoreBonus') * 0.05; },    // +5% / 级
    comboWindowBonus:  function () { return this.rank('comboWindow'); },          // +1s / 级
    specialIntervalMul:function () { return Math.max(0.4, 1 - this.rank('specialFreq') * 0.2); }, // -20% / 级，下限 0.4
    calmBaseLevel:     function () { return this.rank('calmBase'); },             // +1 calmLevel / 级
    startLenBonus:     function () { return this.rank('startLen'); }              // +1 节 / 级
  };

   * - 成绩写入按日期分桶的「每日榜」（与总榜隔离）；连续每天来玩给星屑加成。
   * ========================================================== */
  const DAILY_MODS = {
    comboBoost: { id: 'comboBoost', icon: '⚡', name: '连击红利', desc: '连击窗口 +50%',
                  apply: function (g) { g.comboWindow = Math.round(g.comboWindow * 1.5); } },

  const Daily = {
    _pad2: function (n) { return (n < 10 ? '0' : '') + n; },

    /** 本地日期 YYYY-MM-DD（与玩家时区一致，跨天才算新的一天） */
    todayKey: function () {
      const d = new Date();
      return d.getFullYear() + '-' + Daily._pad2(d.getMonth() + 1) + '-' + Daily._pad2(d.getDate());
    },

    /** 昨天的 YYYY-MM-DD（用于判断连续打卡） */
    yesterdayKey: function () {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.getFullYear() + '-' + Daily._pad2(d.getMonth() + 1) + '-' + Daily._pad2(d.getDate());
    },

    /** FNV-1a 字符串哈希 -> uint32，作为每日种子 */
    hashStr: function (str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return h >>> 0;
    },

    /** mulberry32：小巧可复现的伪随机发生器（同一种子产生同一序列） */
    makeRng: function (seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },

    /** 指定日期的种子（测试可传固定 key） */
    seedFor: function (key) { return Daily.hashStr(key); },
    seed: function () { return Daily.seedFor(Daily.todayKey()); },

    /** 指定日期的每日修饰（洗牌后取前 N 个，测试可传固定 key） */
    modsFor: function (key) {
      const ids = Object.keys(DAILY_MODS);
      const r = Daily.makeRng(Daily.seedFor(key) ^ 0x9e3779b9);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
      }
      return ids.slice(0, Config.DAILY_MOD_COUNT);
    },
    mods: function () { return Daily.modsFor(Daily.todayKey()); },

    /** 读全部每日榜数据 { date: [entries] }（脏数据/隐私模式兜底为 {}） */
    _loadAll: function () {
      try {
        const raw = window.localStorage.getItem(Config.STORAGE_DAILY);
        if (!raw) return {};
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object' || Array.isArray(p)) return {};
        return p;
      } catch (e) { return {}; }
    },
    _saveAll: function (obj) {
      try { window.localStorage.setItem(Config.STORAGE_DAILY, JSON.stringify(obj)); return true; }
      catch (e) { return false; }
    },

    /** 今日榜单（按分数降序、同分新在前） */
    list: function () {
      const data = Daily._loadAll();
      return data[Daily.todayKey()] || [];
    },

    /**
     * 记录一局每日挑战成绩，返回 { rank, total, isRecord, streak }。
     * streak = { count, bonusPct }：连续打卡天数与对应的星屑加成比例。
     */
    record: function (run) {
      const key = Daily.todayKey();
      const data = Daily._loadAll();
      let arr = data[key] || [];
      const rec = {
        name: String(run.name || 'Ply').slice(0, 10),
        score: Number(run.score) || 0,
        duration: Math.max(0, Math.floor(Number(run.duration) || 0)),
        date: new Date().toISOString(),
        mode: 'daily'
      };
      arr.push(rec);
      arr.sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return new Date(b.date) - new Date(a.date);
      });
      if (arr.length > Config.DAILY_MAX) arr.length = Config.DAILY_MAX;
      data[key] = arr;
      Daily._saveAll(data);
      const rank = arr.indexOf(rec) + 1;
      const isRecord = (arr[0] === rec);
      const streak = Daily._bumpStreak(key);
      return { rank: rank, total: arr.length, isRecord: isRecord, streak: streak };
    },

    /** 更新连续打卡：今天已打卡不累加；昨天打卡则 +1；否则重置为 1 */
    _bumpStreak: function (todayKey) {
      let st = { lastDate: '', count: 0 };
      try {
        const p = JSON.parse(Storage.get(Config.STORAGE_DAILY_STREAK, ''));
        if (p && typeof p === 'object') {
          st.lastDate = p.lastDate || '';
          st.count = Number(p.count) || 0;
        }
      } catch (e) { /* 脏数据兜底 */ }
      if (st.lastDate === todayKey) {
        // 今天已打卡，保持
      } else if (st.lastDate === Daily.yesterdayKey()) {
        st.count += 1;
      } else {
        st.count = 1;
      }
      st.lastDate = todayKey;
      try { window.localStorage.setItem(Config.STORAGE_DAILY_STREAK, JSON.stringify(st)); }
      catch (e) { /* 隐私模式静默降级 */ }
      const bonusPct = Math.min(Config.DAILY_STREAK_BONUS_CAP, st.count * Config.DAILY_STREAK_BONUS_STEP);
      return { count: st.count, bonusPct: bonusPct };
    },

    /** 当前连续打卡信息（供 UI 展示） */
    streak: function () {
      let st = { lastDate: '', count: 0 };
      try {
        const p = JSON.parse(Storage.get(Config.STORAGE_DAILY_STREAK, ''));
        if (p && typeof p === 'object') {
          st.lastDate = p.lastDate || '';
          st.count = Number(p.count) || 0;
        }
      } catch (e) { /* 脏数据兜底 */ }
      const bonusPct = Math.min(Config.DAILY_STREAK_BONUS_CAP, st.count * Config.DAILY_STREAK_BONUS_STEP);
      return {
        count: st.count,
        bonusPct: bonusPct,
        lastDate: st.lastDate,
        today: Daily.todayKey(),
        isToday: st.lastDate === Daily.todayKey()
      };
    }
  };

  /* ============================================================
   * H 轮：社交分享（零后端 · 纯前端）
   * - Share：本局成绩 <-> 短码（SNK1- 前缀 + base64）双向编解码
   * - FriendsBoard：导入/查看/删除好友成绩（localStorage，与排行榜严格分离）
   * ========================================================== */
  const Share = {
    /** 把本局成绩打包成可复制的短码 */
    encode: function (run) {
      if (!run || typeof run !== 'object') return '';
      const obj = {
        v: Number(run.v) || 0,
        m: Number(run.m) || 0,
        s: Number(run.s) || 0,
        l: Number(run.l) || 0,
        t: Number(run.t) || 0,
        b: Number(run.b) || 0,
        c: Number(run.c) || 0,
        a: Number(run.a) || 0
      };
      try {
        const json = JSON.stringify(obj);
        // 中文无关的纯数字对象，unicode 转义保险
        const b64 = btoa(unescape(encodeURIComponent(json)));
        return Config.SHARE_PREFIX + b64;
      } catch (e) {
        return '';
      }
    },

    /** 解析分享码；非法 / 截断 / 旧版本一律返回 null，绝不抛异常 */
    decode: function (code) {
      if (!code || typeof code !== 'string') return null;
      code = code.trim();
      const pre = Config.SHARE_PREFIX;
      if (code.indexOf(pre) !== 0) return null;
      const b64 = code.slice(pre.length).trim();
      if (!b64) return null;
      try {
        const json = decodeURIComponent(escape(atob(b64)));
        const obj = JSON.parse(json);
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
        const v = Number(obj.v);
        const m = Number(obj.m);
        const s = Number(obj.s);
        if (!isFinite(v) || !isFinite(m) || !isFinite(s)) return null;
        if (v < Config.SHARE_VERSION || v > Config.SHARE_VERSION) return null; // 仅支持当前版本
        if (m < 0 || m > 2) return null;
        if (s < 0) return null;
        return {
          v: Math.floor(v),
          m: Math.floor(m),
          s: Math.floor(s),
          l: Share._int(obj.l, 0, 9999),
          t: Share._int(obj.t, 0, 999999),
          b: Share._int(obj.b, 0, 9999),
          c: Share._int(obj.c, 0, 9999),
          a: Share._int(obj.a, 0, 99)
        };
      } catch (e) {
        return null;
      }
    },

    _int: function (val, lo, hi) {
      const n = Number(val);
      if (!isFinite(n)) return lo;
      const n2 = Math.floor(n);
      if (n2 < lo) return lo;
      if (n2 > hi) return hi;
      return n2;
    }
  };

  /** H 轮：好友成绩榜（导入他人的分享码，与自己的排行榜严格区分） */
  const FriendsBoard = {
    list: function () {
      const raw = Storage.get(Config.STORAGE_FRIENDS, '');
      if (!raw) return [];
      try {
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        const seen = {};
        const out = [];
        for (let i = 0; i < arr.length; i++) {
          const it = arr[i];
          if (!it || typeof it !== 'object' || typeof it.code !== 'string') continue;
          if (seen[it.code]) continue;
          seen[it.code] = true;
          out.push({
            code: it.code,
            data: it.data && typeof it.data === 'object' ? it.data : null,
            importedAt: Number(it.importedAt) || 0
          });
        }
        out.sort(function (x, y) {
          return (y.data ? y.data.s : 0) - (x.data ? x.data.s : 0);
        });
        return out;
      } catch (e) {
        return [];
      }
    },

    /** 导入一条分享码；返回 { ok, reason, data } */
    add: function (code) {
      if (!code || typeof code !== 'string') return { ok: false, reason: 'empty' };
      code = code.trim();
      if (!code) return { ok: false, reason: 'empty' };
      const data = Share.decode(code);
      if (!data) return { ok: false, reason: 'invalid' };
      const list = this.list();
      for (let i = 0; i < list.length; i++) {
        if (list[i].code === code) return { ok: false, reason: 'dup' };
      }
      list.push({ code: code, data: data, importedAt: Date.now() });
      if (list.length > Config.FRIENDS_MAX) list.length = Config.FRIENDS_MAX;
      Storage.set(Config.STORAGE_FRIENDS, JSON.stringify(list));
      return { ok: true, data: data };
    },

    /** 删除某条记录（按分享码），返回删除后的列表 */
    remove: function (code) {
      const list = this.list().filter(function (it) { return it.code !== code; });
      Storage.set(Config.STORAGE_FRIENDS, JSON.stringify(list));
      return list;
    },

    clear: function () {
      Storage.set(Config.STORAGE_FRIENDS, '[]');
    }
  };

    entries: [],          // 已排序的前 N 条记录
    lastRecord: null,     // 本局刚产生的记录（Game Over 后可编辑名字）

    /** 校验并裁剪单条记录 */
    normalize: function (rec) {
      if (!rec || typeof rec !== 'object') return null;
      const name = String(rec.name || '').slice(0, 10);
      const score = Number(rec.score) || 0;
      const duration = Math.max(0, Math.floor(Number(rec.duration) || 0));
      let date = rec.date;
      if (typeof date !== 'string' || !date) date = new Date().toISOString();
      // G 轮：记录所属模式（老数据没有该字段，统一按闯关处理）
      const mode = (typeof rec.mode === 'string' && rec.mode) ? rec.mode : 'stage';
      return { name: name, score: score, date: date, duration: duration, mode: mode };
    },

    /** 从 localStorage 加载排行榜 */
    load: function () {
      try {
        const raw = window.localStorage.getItem(Config.STORAGE_LEADERBOARD);
        if (!raw) { this.entries = []; return; }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) { this.entries = []; return; }
        const out = [];
        for (let i = 0; i < parsed.length; i++) {
          const r = this.normalize(parsed[i]);
          if (r) out.push(r);
        }
        this.entries = out;
        this.sort();
      } catch (e) {
        this.entries = [];
      }
    },

    /** 持久化排行榜 */
    save: function () {
      try {
        window.localStorage.setItem(Config.STORAGE_LEADERBOARD,
          JSON.stringify(this.entries.slice(0, Config.LEADERBOARD_MAX)));
        return true;
      } catch (e) {
        return false;
      }
    },

    /** 按分数降序，同分按时间倒序（新的在前） */
    sort: function () {
      this.entries.sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return new Date(b.date) - new Date(a.date);
      });
      if (this.entries.length > Config.LEADERBOARD_MAX) {
        this.entries.length = Config.LEADERBOARD_MAX;
      }
    },

    /**
     * 添加一条记录。
     * 同名同分视为同一记录：替换旧记录并保留最新时间。
     */
    add: function (rec) {
      const r = this.normalize(rec);
      if (!r) return false;
      const idx = this.entries.findIndex(function (e) {
        return e.name === r.name && e.score === r.score;
      });
      if (idx >= 0) {
        this.entries[idx] = r;
      } else {
        this.entries.push(r);
      }
      this.sort();
      this.save();
      return r;
    },

    /** 移除一条已知记录（用于改名时去重） */
    remove: function (rec) {
      if (!rec) return;
      this.entries = this.entries.filter(function (e) {
        return !(e.name === rec.name && e.score === rec.score && e.date === rec.date);
      });
    },

    /** 清空排行榜 */
    clear: function () {
      this.entries = [];
      this.save();
    },

    /** 计算某分数在当前榜单中的 1-based 名次 */
    rank: function (score) {
      let r = 1;
      for (let i = 0; i < this.entries.length; i++) {
        if (this.entries[i].score > score) r++;
      }
      return r;
    },

    count: function () { return this.entries.length; }
  };

  /* ============================================================
   * 3.5 G 轮：成就 / 皮肤 / 统计（localStorage，隐私模式一律静默降级）
   * ========================================================== */
  const Achievements = {
    unlocked: {},          // { 成就id: 解锁时间戳 }

    load: function () {
      this.unlocked = {};
      const raw = Storage.get(Config.STORAGE_ACH, '');
      if (!raw) return;
      try {
        const obj = JSON.parse(raw);
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return;
        for (let i = 0; i < ACHIEVEMENTS.length; i++) {
          const id = ACHIEVEMENTS[i].id;
          if (typeof obj[id] === 'number') this.unlocked[id] = obj[id];
        }
      } catch (e) {
        this.unlocked = {};   // 脏数据 -> 当作空进度，绝不抛异常
      }
    },

    save: function () {
      try { window.localStorage.setItem(Config.STORAGE_ACH, JSON.stringify(this.unlocked)); }
      catch (e) { /* 隐私模式：静默降级 */ }
    },

    has: function (id) { return !!this.unlocked[id]; },

    /** 解锁一个成就；已解锁返回 false，新解锁返回 true */
    unlock: function (id) {
      if (this.has(id)) return false;
      this.unlocked[id] = Date.now();
      this.save();
      return true;
    },

    count: function () { return Object.keys(this.unlocked).length; },
    total: function () { return ACHIEVEMENTS.length; },

    find: function (id) {
      for (let i = 0; i < ACHIEVEMENTS.length; i++) {
        if (ACHIEVEMENTS[i].id === id) return ACHIEVEMENTS[i];
      }
      return null;
    }
  };

  const Skins = {
    current: 'classic',

    load: function () {
      const id = Storage.get(Config.STORAGE_SKIN, 'classic');
      this.current = this.find(id) ? id : 'classic';
    },

    save: function () { Storage.set(Config.STORAGE_SKIN, this.current); },

    find: function (id) {
      for (let i = 0; i < SNAKE_SKINS.length; i++) {
        if (SNAKE_SKINS[i].id === id) return SNAKE_SKINS[i];
      }
      return null;
    },

    /** 皮肤是否可用：无解锁条件，或对应成就已拿到 */
    isUnlocked: function (id) {
      const skin = this.find(id);
      if (!skin) return false;
      if (!skin.unlock) return true;
      return Achievements.has(skin.unlock);
    },

    /** 切换皮肤；未解锁或不存在则返回 false */
    select: function (id) {
      if (!this.isUnlocked(id)) return false;
      this.current = id;
      this.save();
      return true;
    },

    currentSkin: function () {
      const s = this.find(this.current);
      if (s && this.isUnlocked(s.id)) return s;
      return SNAKE_SKINS[0];            // 兜底：始终有一个可用皮肤
    }
  };

  const Stats = {
    DEFAULTS: {
      games: 0, wins: 0, totalScore: 0, totalFoods: 0,
      totalDuration: 0, bestCombo: 0, bossKills: 0
    },
    data: null,

    load: function () {
      this.data = Object.assign({}, this.DEFAULTS);
      const raw = Storage.get(Config.STORAGE_STATS, '');
      if (!raw) return;
      try {
        const obj = JSON.parse(raw);
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return;
        for (const k in this.DEFAULTS) {
          if (!Object.prototype.hasOwnProperty.call(this.DEFAULTS, k)) continue;
          const v = Number(obj[k]);
          if (isFinite(v) && v >= 0) this.data[k] = Math.floor(v);
        }
      } catch (e) {
        this.data = Object.assign({}, this.DEFAULTS);
      }
    },

    save: function () {
      try { window.localStorage.setItem(Config.STORAGE_STATS, JSON.stringify(this.data)); }
      catch (e) { /* 隐私模式：静默降级 */ }
    },

    /** 一局结束时合并本局数据 */
    merge: function (run) {
      if (!this.data) this.load();
      this.data.games++;
      if (run.win) this.data.wins++;
      this.data.totalScore += run.score || 0;
      this.data.totalFoods += run.foods || 0;
      this.data.totalDuration += run.duration || 0;
      this.data.bossKills += run.bossKills || 0;
      if ((run.bestCombo || 0) > this.data.bestCombo) this.data.bestCombo = run.bestCombo;
      this.save();
    },

    reset: function () {
      this.data = Object.assign({}, this.DEFAULTS);
      this.save();
    }
  };

  /* ============================================================
   * 4. 音效（Web Audio 合成，无外部音频文件）
   * ========================================================== */
  const Sfx = {
    ctx: null,
    muted: Storage.get(Config.STORAGE_MUTED, '0') === '1',

    /** 首次用户交互后调用：创建 / 恢复音频上下文 */
    unlock: function () {
      if (this.muted) return;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
      }
      if (this.ctx.state === 'suspended' && this.ctx.resume) {
        this.ctx.resume().catch(function () { /* 忽略恢复失败 */ });
      }
    },

    /** 播放单个合成音：频率可线性滑向 endFreq */
    tone: function (opts) {
      if (this.muted || !this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime + (opts.delay || 0);
      const dur = opts.dur || 0.12;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(opts.freq, now);
      if (opts.endFreq && opts.endFreq !== opts.freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.endFreq), now + dur);
      }
      const peak = (opts.gain === undefined ? 0.16 : opts.gain);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    },

    /** 白噪声（撞击的"沙沙"尾音） */
    noise: function (dur, gain, delay) {
      if (this.muted || !this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime + (delay || 0);
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      const src = ctx.createBufferSource();
      const g = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);
      g.gain.setValueAtTime(gain, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.buffer = buf;
      src.connect(filter);
      filter.connect(g);
      g.connect(ctx.destination);
      src.start(now);
    },

    eat: function (level) {
      const base = 620 + Math.min(level, 10) * 18;
      this.tone({ freq: base, endFreq: base * 1.6, type: 'triangle', dur: 0.09, gain: 0.14 });
      this.tone({ freq: base * 1.5, endFreq: base * 2.2, type: 'sine', dur: 0.09, gain: 0.09, delay: 0.055 });
    },

    crash: function () {
      this.tone({ freq: 240, endFreq: 55, type: 'sawtooth', dur: 0.42, gain: 0.16 });
      this.tone({ freq: 120, endFreq: 42, type: 'square',   dur: 0.34, gain: 0.10, delay: 0.02 });
      this.noise(0.28, 0.12, 0.01);
    },

    record: function () {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      for (let i = 0; i < notes.length; i++) {
        this.tone({ freq: notes[i], type: 'triangle', dur: 0.16, gain: 0.12, delay: i * 0.09 });
      }
    },

    start: function () {
      this.tone({ freq: 440, endFreq: 660, type: 'sine', dur: 0.12, gain: 0.10 });
    },

    pause: function (paused) {
      this.tone({ freq: paused ? 520 : 380, endFreq: paused ? 380 : 520, type: 'sine', dur: 0.1, gain: 0.08 });
    },

    /** 吃到特殊食物：金蛇果明亮上扬、冰冻果清冷下行、限时奖励轻快叮咚、护盾果浑厚护体 */
    special: function (kind) {
      if (kind === 'gold') {
        this.tone({ freq: 880, endFreq: 1320, type: 'triangle', dur: 0.14, gain: 0.13 });
      } else if (kind === 'ice') {
        this.tone({ freq: 540, endFreq: 300, type: 'sine', dur: 0.18, gain: 0.12 });
      } else if (kind === 'shield') {
        this.tone({ freq: 392, endFreq: 588, type: 'sine', dur: 0.2, gain: 0.12 });
        this.tone({ freq: 588, endFreq: 784, type: 'triangle', dur: 0.16, gain: 0.09, delay: 0.07 });
      } else {
        // bonus：两声叮咚
        this.tone({ freq: 740, endFreq: 988, type: 'triangle', dur: 0.1, gain: 0.12 });
        this.tone({ freq: 988, endFreq: 1318, type: 'sine', dur: 0.1, gain: 0.08, delay: 0.08 });
      }
    },

    /** E 轮：受击（扣 1 点生命但未结束）——比 crash 短促、更"闷"，听感上区别于真正的死亡 */
    hit: function () {
      this.tone({ freq: 300, endFreq: 120, type: 'square', dur: 0.18, gain: 0.13 });
      this.noise(0.16, 0.09, 0.005);
    },

    /** E 轮：拾取升级卡——明亮上行三音 */
    upgrade: function () {
      const notes = [523.25, 698.46, 880];
      for (let i = 0; i < notes.length; i++) {
        this.tone({ freq: notes[i], type: 'triangle', dur: 0.13, gain: 0.11, delay: i * 0.06 });
      }
    },

    /** G 轮：解锁成就 —— 明亮的上行三音 + 一记高音收尾 */
    achievement: function () {
      const notes = [659.25, 830.61, 987.77];
      for (let i = 0; i < notes.length; i++) {
        this.tone({ freq: notes[i], type: 'triangle', dur: 0.16, gain: 0.10, delay: i * 0.08 });
      }
      this.tone({ freq: 1318.51, type: 'sine', dur: 0.24, gain: 0.07, delay: 0.26 });
    },

    /** F 轮：撞中 Boss 弱点 —— 清脆的金属敲击 */
    bossHit: function () {
      this.tone({ freq: 1180, endFreq: 760, type: 'square', dur: 0.09, gain: 0.10 });
      this.noise(0.08, 0.07, 0.002);
    },

    /** F 轮：击破 Boss —— 下行轰鸣 + 噪声爆裂 */
    bossDown: function () {
      this.tone({ freq: 320, endFreq: 60, type: 'sawtooth', dur: 0.5, gain: 0.16 });
      this.tone({ freq: 160, endFreq: 42, type: 'square', dur: 0.42, gain: 0.11, delay: 0.03 });
      this.noise(0.36, 0.16, 0.01);
    },

    /** E 轮：过关弹出升级卡——两声提示，告知"该做选择了" */
    offer: function () {
      this.tone({ freq: 660, type: 'sine', dur: 0.1, gain: 0.10 });
      this.tone({ freq: 880, type: 'sine', dur: 0.12, gain: 0.09, delay: 0.1 });
    }
  };

  /* ============================================================
   * 5. 游戏核心（纯逻辑，不触碰 DOM）
   * ========================================================== */
  const Game = {
    state: STATE.READY,
    snake: [],          // [{x,y}]，下标 0 为蛇头
    prevSnake: [],      // 上一 tick 的蛇身，用于渲染插值
    dirQueue: [],       // 方向缓冲队列，防止同一帧连按两次导致反向穿身
    dir: DIR.right,
    food: { x: 0, y: 0 },
    score: 0,
    best: 0,
    level: 0,
    isRecord: false,
    win: false,
    deathReason: '',    // 'wall' | 'self'，用于结束界面文案
    headPulse: 0,       // 吃到食物时蛇头的缩放脉冲
    occupied: null,     // Uint8Array，用于 O(1) 判断格子是否被蛇占据

    /* ---- C 轮：特殊食物 ---- */
    special: null,             // 当前场上的特殊食物 {x,y,type,ttl,maxTtl}，null 表示无
    speedBuffAdd: 0,           // 当前速度增益（负数表示减速），无 buff 时为 0
    speedBuffTime: 0,          // 速度 buff 剩余秒数
    specialSpawnTimer: 0,      // 自动生成特殊食物的计时器（ms）
    _lastSpecial: null,        // 最近一次吃到的特殊食物 {type,x,y}（供主循环做特效）

    /* ---- D 轮：关卡 / 障碍 / Boss 蛇 ---- */
    stageMode: false,          // 闯关模式总开关（App.start/restart 时开启；单测可关）
    stage: 1,                  // 当前关卡（从 1 开始）
    stageFoods: 0,             // 当前关已吃到的食物数
    stageTarget: 0,            // 当前关目标食物数（吃满即过关）
    obstacles: [],             // 障碍物列表 [{x,y}]
    /* ---- F 轮：Boss 进化（bosses 为数组，支持分裂体共存）---- */
    bosses: [],                // [{snake,prevSnake,dir,acc,hp,maxHp,kind,dashTimer,dashWarn,dashTime,dashDir,hitFlash}]
    hazards: [],               // 毒区 [{x,y,w,h,timer}]，Boss 关独有
    bossHitPlayer: false,      // Boss 本帧撞到玩家（主循环据此判受击）
    _lastBossHit: null,        // 主循环用：{x,y,kind,killed,left}，击打/击破反馈

    /* ---- G 轮：模式 / 成就 / 统计 ---- */
    mode: 'stage',             // 'stage' 闯关 | 'endless' 无尽 | 'timeattack' 限时
    timeLeft: 0,               // 限时模式剩余秒数
    timeUp: false,             // 限时模式时间到（主循环据此结算，不算死亡）
    achToast: null,            // 画布内成就提示 {name,desc,time,max}
    foodEaten: 0,              // 本局吃到的食物数（无尽/限时用来算变长）
    runFoods: 0,               // 本局吃到的食物总数（累计统计用）
    runBossKills: 0,           // 本局击破 Boss 数
    _gotBonus: false,          // 本局吃到过限时奖励
    _killedSplitter: false,    // 本局击破过分裂者
    _runDuration: 0,           // 本局时长（秒），由 App 在结算前写入
    stageBannerText: '',       // 关卡横幅文案（如「第 3 关」）
    stageBannerTime: 0,        // 关卡横幅剩余显示时间（秒）

    /* ---- J 轮：每日挑战（同图 / 同修饰） ---- */
    rng: Math.random,          // 棋盘生成用的随机源；普通局用 Math.random，每日挑战用按日期播种的 rng
    daily: false,              // 是否每日挑战局
    dailySeed: 0,              // 每日种子（日期哈希）
    dailyMods: [],             // 今日生效的 modifier id 列表
    dailyObsBonus: 0,          // 每日修饰：每关额外障碍数
    dailyHazardMul: 1,        // 每日修饰：毒区数量倍率
    dailyNoShield: false,      // 每日修饰：禁用护盾果
    _dailyResult: null,        // 结算后写入：{ rank, total, isRecord, streak:{count,bonusPct} }

    /* ---- E 轮：生命值 / Combo / 升级卡 ---- */
    lives: 3,                  // 当前生命（撞毁扣 1 点，扣光才结束）
    maxLives: 3,               // 生命上限（「强心」可提升）
    invincible: 0,             // 免伤剩余秒数（受击后 1.2s / 护盾果 6s）
    combo: 0,                  // 当前连击层数
    comboTimer: 0,             // 连击窗口剩余秒数（归零则连击清零）
    comboWindow: 8,            // 连击窗口长度（「连击大师」可提升）
    comboBest: 0,              // 本局最高连击（结算展示）
    scoreMul: 1,               // 全局得分倍率（「贪婪」可提升）
    shieldLevel: 0,            // 「护盾果」等级（>0 时特殊食物池加入护盾果）
    calmLevel: 0,              // 「稳如老狗」等级（每层降低基础速度）
    upgradeLevels: null,       // { [upgradeId]: 已选次数 }
    pendingUpgrades: null,     // 待选的三张升级卡（非 null 时游戏暂停等待选择）
    awaitingUpgrade: false,    // 是否正在等待玩家选卡（主循环据此停止推进逻辑）
    _lastGain: 0,              // 最近一次吃食物实际得分（供飘字显示倍率后数值）

    /** 当前速度（格/秒）；基础速度受「稳如老狗」削减，再叠加临时速度 buff */
    tps: function () {
      const raw = Config.BASE_TPS + this.level * Config.TPS_PER_LEVEL - this.calmLevel * Config.CALM_TPS;
      const base = Math.min(Config.MAX_TPS, Math.max(Config.SPECIAL_MIN_TPS, raw));
      const eff = base + (this.speedBuffAdd || 0);
      return Math.max(Config.SPECIAL_MIN_TPS, eff);
    },

    /** 每 tick 的间隔毫秒数 */
    tickInterval: function () {
      return 1000 / this.tps();
    },

    init: function () {
      const raw = parseInt(Storage.get(Config.STORAGE_BEST, '0'), 10);
      this.best = isNaN(raw) || raw < 0 ? 0 : raw;
      this.occupied = new Uint8Array(Config.COLS * Config.ROWS);
      this.reset();
      this.state = STATE.READY;
    },

    /** 重置为一局新游戏（保留最高分） */
    reset: function () {
      const cx = Math.floor(Config.COLS / 2);
      const cy = Math.floor(Config.ROWS / 2);
      // J 轮：每日挑战用按日期播种的 rng，保证同图；普通局用 Math.random（行为不变）
      this.rng = this.daily ? Daily.makeRng(this.dailySeed) : Math.random;
      // 每日修饰的累加字段每局清零（普通局恒为默认）
      this.dailyObsBonus = 0;
      this.dailyHazardMul = 1;
      this.dailyNoShield = false;
      // I 轮：起步蛇身受「长蛇」天赋影响（等级 0 时为默认长度）
      const startLen = Config.START_LEN + Meta.startLenBonus();
      this.snake = [];
      for (let i = 0; i < startLen; i++) {
        this.snake.push({ x: cx - i, y: cy });
      }
      this.prevSnake = this.snake.map(function (s) { return { x: s.x, y: s.y }; });
      this.dir = DIR.right;
      this.dirQueue = [];
      this.score = 0;
      this.level = 0;
      this.isRecord = false;
      this.win = false;
      this.deathReason = '';
      this.headPulse = 0;
      this.special = null;
      this.speedBuffAdd = 0;
      this.speedBuffTime = 0;
      this.specialSpawnTimer = 0;
      this._lastSpecial = null;

      /* ---- D 轮：关卡状态（保留外部设置的 stageMode 开关，不在此重置）---- */
      this.stage = 1;
      this.stageFoods = 0;
      this.stageTarget = Config.STAGE_BASE_TARGET;
      this.obstacles = [];
      this.bosses = [];
      this.hazards = [];
      this.bossHitPlayer = false;
      this._lastBossHit = null;
      this.stageBannerText = '';
      this.stageBannerTime = 0;

      /* ---- E 轮：生命 / 连击 / 升级（叠加 I 轮天赋的永久加成）---- */
      this.lives = Math.min(Config.MAX_LIVES, Config.START_LIVES + Meta.startLivesBonus());
      this.maxLives = this.lives;
      this.invincible = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.comboWindow = Config.COMBO_WINDOW + Meta.comboWindowBonus();
      this.comboBest = 0;
      this.scoreMul = 1 + Meta.scoreBonus();
      this.shieldLevel = 0;
      this.calmLevel = Meta.calmBaseLevel();
      this.upgradeLevels = {};
      this.pendingUpgrades = null;
      this.awaitingUpgrade = false;
      this._lastGain = 0;
      // I 轮：特殊食物刷新间隔受「幸运星」天赋影响
      this.specialInterval = Math.round(Config.SPECIAL_SPAWN_INTERVAL * Meta.specialIntervalMul());

      /* ---- G 轮：模式相关（stageMode 由 App.start/restart 按 mode 同步）---- */
      this.timeLeft = (this.mode === 'timeattack') ? Config.TIME_ATTACK_SEC : 0;
      this.timeUp = false;
      this.foodEaten = 0;
      this.runFoods = 0;
      this.runBossKills = 0;
      this._gotBonus = false;
      this._killedSplitter = false;
      this._runDuration = 0;

      // J 轮：每日修饰在基础初始化之后叠加（comboWindow/scoreMul/calmLevel 等已在上方就绪）
      if (this.daily) {
        for (let i = 0; i < this.dailyMods.length; i++) {
          const m = DAILY_MODS[this.dailyMods[i]];
          if (m && m.apply) m.apply(this);
        }
      }

      this.placeFood();
    },

    /**
     * 加入一个方向输入。
     * 防反向：新方向必须与队列中最后一个方向（队列空时与当前方向）不相反；
     * 由于入队时已逐级校验，出队执行时不可能出现 180° 掉头。
     */
    queueDirection: function (next) {
      if (this.state !== STATE.PLAYING) return false;
      const last = this.dirQueue.length ? this.dirQueue[this.dirQueue.length - 1] : this.dir;
      if (next.x === last.x && next.y === last.y) return false;          // 与当前方向相同，忽略
      if (next.x === -last.x && next.y === -last.y) return false;        // 180° 反向，忽略
      if (this.dirQueue.length >= Config.MAX_QUEUED_DIRS) return false;  // 队列已满，忽略
      this.dirQueue.push(next);
      return true;
    },

    /** 取出下一个待执行方向（队列为空时保持原方向） */
    consumeDirection: function () {
      if (this.dirQueue.length) {
        this.dir = this.dirQueue.shift();
      }
      return this.dir;
    },

    /** 在空白处随机生成食物；棋盘填满时返回 false（视为通关） */
    placeFood: function () {
      this.occupied.fill(0);
      for (let i = 0; i < this.snake.length; i++) {
        this.occupied[this.snake[i].y * Config.COLS + this.snake[i].x] = 1;
      }
      // 特殊食物也占据一个格子，食物不得与之重叠
      if (this.special) {
        this.occupied[this.special.y * Config.COLS + this.special.x] = 1;
      }
      // 障碍物同样占据格子
      for (let i = 0; i < this.obstacles.length; i++) {
        this.occupied[this.obstacles[i].y * Config.COLS + this.obstacles[i].x] = 1;
      }
      // F 轮：毒区也算占用 —— 食物刷在毒区里等于逼玩家去送死
      for (let i = 0; i < this.hazards.length; i++) {
        const hz = this.hazards[i];
        for (let a = hz.x; a < hz.x + hz.w; a++) {
          for (let b = hz.y; b < hz.y + hz.h; b++) {
            this.occupied[b * Config.COLS + a] = 1;
          }
        }
      }
      const total = Config.COLS * Config.ROWS;
      let free = 0;
      for (let i = 0; i < total; i++) {
        if (!this.occupied[i]) free++;
      }
      if (free === 0) { this.food = { x: -1, y: -1 }; return false; }

      let target = Math.floor(this.rng() * free);
      for (let i = 0; i < total; i++) {
        if (this.occupied[i]) continue;
        if (target === 0) {
          this.food = { x: i % Config.COLS, y: Math.floor(i / Config.COLS) };
          return true;
        }
        target--;
      }
      return false;
    },

    /** 在「蛇身 + 普通食物」之外随机挑一个空格，返回 {x,y} 或 null（棋盘满） */
    randomEmptyCell: function () {
      this.occupied.fill(0);
      for (let i = 0; i < this.snake.length; i++) {
        this.occupied[this.snake[i].y * Config.COLS + this.snake[i].x] = 1;
      }
      if (this.food.x >= 0) {
        this.occupied[this.food.y * Config.COLS + this.food.x] = 1;
      }
      // 障碍物也占位
      for (let i = 0; i < this.obstacles.length; i++) {
        this.occupied[this.obstacles[i].y * Config.COLS + this.obstacles[i].x] = 1;
      }
      // F 轮：Boss 蛇身同样占位（毒区不该压在 Boss 身上）
      for (let k = 0; k < this.bosses.length; k++) {
        const bs = this.bosses[k].snake;
        for (let i = 0; i < bs.length; i++) {
          this.occupied[bs[i].y * Config.COLS + bs[i].x] = 1;
        }
      }
      // F 轮：毒区同样占位（特殊食物不该刷在毒区里）
      for (let i = 0; i < this.hazards.length; i++) {
        const hz = this.hazards[i];
        for (let a = hz.x; a < hz.x + hz.w; a++) {
          for (let b = hz.y; b < hz.y + hz.h; b++) {
            this.occupied[b * Config.COLS + a] = 1;
          }
        }
      }
      const total = Config.COLS * Config.ROWS;
      let free = 0;
      for (let i = 0; i < total; i++) {
        if (!this.occupied[i]) free++;
      }
      if (free === 0) return null;
      let target = Math.floor(this.rng() * free);
      for (let i = 0; i < total; i++) {
        if (this.occupied[i]) continue;
        if (target === 0) return { x: i % Config.COLS, y: Math.floor(i / Config.COLS) };
        target--;
      }
      return null;
    },

    /** 在空格放置一个特殊食物（gold/ice/bonus）；返回是否成功 */
    placeSpecial: function (type) {
      const cell = this.randomEmptyCell();
      if (!cell) return false;
      const ttlMap = {
        gold: Config.SPECIAL_GOLD_TTL,
        ice: Config.SPECIAL_ICE_TTL,
        bonus: Config.SPECIAL_BONUS_TIME,
        shield: Config.SHIELD_TTL
      };
